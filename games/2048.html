<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>2048 - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #faf8ef; color: #776e65; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #8f7a66; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .header { display: flex; justify-content: space-between; width: 400px; margin-bottom: 20px; align-items: center; }
        h1 { font-size: 60px; font-weight: bold; margin: 0; }
        .score-container { background: #bbada0; padding: 10px 20px; border-radius: 5px; color: white; text-align: center; }
        .score-container .title { font-size: 13px; text-transform: uppercase; }
        .score-container .score { font-size: 25px; font-weight: bold; }
        .game-board { background: #bbada0; width: 400px; height: 400px; border-radius: 10px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 10px; box-sizing: border-box; position: relative; }
        .cell { background: rgba(238, 228, 218, 0.35); border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; color: #776e65; }

        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 35px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 35px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 35px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 30px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 30px; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.33); }

        .game-over { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(238, 228, 218, 0.73); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; }
        .game-over p { font-size: 50px; font-weight: bold; margin: 0 0 20px 0; }
        .retry-button { background: #8f7a66; color: white; border: none; padding: 10px 20px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .controls { margin-top: 20px; color: #776e65; text-align: center; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">2048 - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>



    <div class="header">
        <h1>2048</h1>
        <div class="score-container">
            <div class="title">Punkte</div>
            <div class="score" id="score">0</div>
        </div>
    </div>

    <div class="game-board" id="grid">
        <!-- Cells generated by JS -->
        <div class="game-over" id="game-over">
            <p>Game Over!</p>
            <button class="retry-button" onclick="initGame()">Nochmal spielen</button>
        </div>
    </div>

    <div class="controls">
        Steuerung: Pfeiltasten (Oben, Unten, Links, Rechts)
    </div>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');
        let board = [];
        let score = 0;
        let hasWon = false;

        function initGame() {
            board = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            hasWon = false;
            scoreElement.innerText = score;
            gameOverElement.style.display = 'none';
            gridElement.innerHTML = '';

            for (let i = 0; i < 16; i++) {
                let cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = `cell-${Math.floor(i/4)}-${i%4}`;
                gridElement.appendChild(cell);
            }
            gridElement.appendChild(gameOverElement);

            addRandomTile();
            addRandomTile();
            updateBoard();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) {
                        emptyCells.push({r, c});
                    }
                }
            }
            if (emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function updateBoard() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    let cell = document.getElementById(`cell-${r}-${c}`);
                    let val = board[r][c];
                    cell.innerText = val === 0 ? '' : val;
                    cell.className = 'cell';
                    if (val > 0) {
                        if (val <= 2048) {
                            cell.classList.add(`tile-${val}`);
                        } else {
                            cell.classList.add('tile-2048'); // Fallback for higher
                        }
                    }
                }
            }
            scoreElement.innerText = score;

            if (checkGameOver()) {
                gameOverElement.style.display = 'flex';
                // Reward XP
                if (window.userSystem && score > 0) {
                    window.userSystem.addXP(Math.floor(score / 50));
                }
            }
        }

        function slide(row) {
            let newRow = row.filter(val => val !== 0);
            for (let i = 0; i < newRow.length - 1; i++) {
                if (newRow[i] === newRow[i+1]) {
                    newRow[i] *= 2;
                    score += newRow[i];
                    newRow.splice(i + 1, 1);

                    if(newRow[i] === 2048 && !hasWon) {
                        hasWon = true;
                        if(window.userSystem) {
                            window.userSystem.addCoins(100);
                            alert("Du hast 2048 erreicht! +100 Münzen");
                        }
                    }
                }
            }
            while (newRow.length < 4) {
                newRow.push(0);
            }
            return newRow;
        }

        function moveLeft() {
            let moved = false;
            for (let r = 0; r < 4; r++) {
                let originalRow = [...board[r]];
                board[r] = slide(board[r]);
                if (originalRow.join(',') !== board[r].join(',')) moved = true;
            }
            return moved;
        }

        function moveRight() {
            let moved = false;
            for (let r = 0; r < 4; r++) {
                let originalRow = [...board[r]];
                board[r].reverse();
                board[r] = slide(board[r]);
                board[r].reverse();
                if (originalRow.join(',') !== board[r].join(',')) moved = true;
            }
            return moved;
        }

        function moveUp() {
            let moved = false;
            for (let c = 0; c < 4; c++) {
                let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                let originalCol = [...col];
                let newCol = slide(col);
                for (let r = 0; r < 4; r++) {
                    board[r][c] = newCol[r];
                }
                if (originalCol.join(',') !== newCol.join(',')) moved = true;
            }
            return moved;
        }

        function moveDown() {
            let moved = false;
            for (let c = 0; c < 4; c++) {
                let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                let originalCol = [...col];
                col.reverse();
                let newCol = slide(col);
                newCol.reverse();
                for (let r = 0; r < 4; r++) {
                    board[r][c] = newCol[r];
                }
                if (originalCol.join(',') !== newCol.join(',')) moved = true;
            }
            return moved;
        }

        function checkGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) return false;
                    if (c < 3 && board[r][c] === board[r][c+1]) return false;
                    if (r < 3 && board[r][c] === board[r+1][c]) return false;
                }
            }
            return true;
        }

        document.addEventListener('keydown', (e) => {
            if (gameOverElement.style.display === 'flex') return;

            let moved = false;
            switch(e.key) {
                case 'ArrowLeft': moved = moveLeft(); break;
                case 'ArrowRight': moved = moveRight(); break;
                case 'ArrowUp': moved = moveUp(); break;
                case 'ArrowDown': moved = moveDown(); break;
            }

            if (moved) {
                addRandomTile();
                updateBoard();
            }
        });

        initGame();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = '2048';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
