<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agar.io Clone - Online PVP Simulation</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f0f0f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: #333; pointer-events: none; z-index: 10; }
        #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px; width: 150px; pointer-events: none; }
        h3 { margin: 0 0 5px 0; font-size: 14px; text-transform: uppercase; color: #666; }
        ol { margin: 0; padding-left: 20px; font-size: 14px; }
        li { margin-bottom: 3px; }
        #back-btn { position: absolute; bottom: 10px; left: 10px; padding: 10px 20px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-family: Arial, sans-serif; z-index: 20;}
        #back-btn:hover { background-color: #c0392b; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 30px; border-radius: 10px; text-align: center; display: none; z-index: 30;}
        #game-over h1 { margin-top: 0; color: #e74c3c; }
        #game-over button { margin-top: 15px; padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #3498db; color: white; }
        #game-over button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Agar.io Clone - Online PVP Simulation</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <div id="ui">
        <h2>Masse: <span id="score">20</span></h2>
    </div>

    <div id="leaderboard">
        <h3>Bestenliste</h3>
        <ol id="lb-list"></ol>
    </div>

    <div id="game-over">
        <h1>Gefressen!</h1>
        <p>Deine Endmasse: <span id="final-score"></span></p>
        <button onclick="location.reload()">Nochmal spielen</button>
    </div>

    <a href="../index.html" id="back-btn">Zurück zum Portal</a>
    <canvas id="gameCanvas"></canvas>

    <script src="../js/user-system.js"></script>
    <script>

            // Advanced Particle System Graphics

            // Playable Particle Popper Mechanics
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            let particles = [];
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6348', '#a29bfe', '#fd79a8'];
            let mouse = { x: -1000, y: -1000 };
            let score = 0;
            let combo = 0;
            let comboTimer = 0;

            canvas.addEventListener('mousemove', (e) => {
                const r = canvas.getBoundingClientRect();
                mouse.x = e.clientX - r.left;
                mouse.y = e.clientY - r.top;
            });

            canvas.addEventListener('mouseleave', () => {
                mouse.x = -1000;
                mouse.y = -1000;
            });

            // Click to pop particles
            canvas.addEventListener('mousedown', (e) => {
                const r = canvas.getBoundingClientRect();
                const mx = e.clientX - r.left;
                const my = e.clientY - r.top;

                let hit = false;
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    const dx = mx - p.x;
                    const dy = my - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist <= p.radius * 2.5) { // generous hit box
                        // Pop effect
                        createExplosion(p.x, p.y, p.color);
                        particles.splice(i, 1);
                        hit = true;
                        combo++;
                        comboTimer = 60; // frames
                        score += 10 * combo;

                        // Spawn new ones to keep game going
                        for(let k=0; k<2; k++) particles.push(new Particle());

                        // Sync with global system
                        if (window.userSystem) {
                            window.userSystem.addXP(Math.min(combo, 5));
                        }
                    }
                }
                if (!hit) combo = 0;
            });

            let explosions = [];
            function createExplosion(x, y, color) {
                for(let i=0; i<8; i++) {
                    explosions.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        life: 1.0,
                        color: color
                    });
                }
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * (canvas.width / dpr);
                    this.y = Math.random() * (canvas.height / dpr);
                    this.vx = (Math.random() - 0.5) * 3;
                    this.vy = (Math.random() - 0.5) * 3;
                    this.radius = Math.random() * 4 + 2;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    // Bounce off walls
                    if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
                    if (this.x > (canvas.width / dpr) - this.radius) { this.x = (canvas.width / dpr) - this.radius; this.vx *= -1; }
                    if (this.y < this.radius) { this.y = this.radius; this.vy *= -1; }
                    if (this.y > (canvas.height / dpr) - this.radius) { this.y = (canvas.height / dpr) - this.radius; this.vy *= -1; }

                    // Dodge mouse slightly
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 80) {
                        this.vx -= dx * 0.005;
                        this.vy -= dy * 0.005;
                    }

                    // Speed limit
                    const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                    if (speed > 4) {
                        this.vx = (this.vx / speed) * 4;
                        this.vy = (this.vy / speed) * 4;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.closePath();
                    ctx.shadowBlur = 0;
                }
            }

            // Init particles
            for (let i = 0; i < 60; i++) particles.push(new Particle());

            function animate() {
                // Clear with trail
                ctx.fillStyle = 'rgba(10, 14, 23, 0.25)';
                ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

                // Draw connecting lines
                for(let i=0; i<particles.length; i++) {
                    for(let j=i+1; j<particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = dx*dx + dy*dy;

                        if(dist < 7000) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 - dist/46000})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                // Handle explosions
                for(let i = explosions.length - 1; i >= 0; i--) {
                    let ex = explosions[i];
                    ex.x += ex.vx;
                    ex.y += ex.vy;
                    ex.life -= 0.05;

                    if(ex.life <= 0) {
                        explosions.splice(i, 1);
                        continue;
                    }

                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, 2 * ex.life, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${ex.life})`;
                    ctx.fill();
                    ctx.closePath();
                }

                // UI overlays
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px "Fredoka One", cursive';
                ctx.textAlign = 'left';
                ctx.fillText(`Punkte: ${score}`, 20, 40);

                if (combo > 1 && comboTimer > 0) {
                    comboTimer--;
                    ctx.fillStyle = `rgba(255, 71, 87, ${comboTimer/60})`;
                    ctx.font = 'bold 28px "Fredoka One", cursive';
                    ctx.fillText(`${combo}x COMBO!`, 20, 75);
                } else if (comboTimer <= 0) {
                    combo = 0;
                }

                requestAnimationFrame(animate);
            }
            animate();

</script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'agario-clone';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
