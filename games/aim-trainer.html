<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Aim Trainer - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; z-index: 10; }
        .game-area { width: 800px; height: 500px; background: #34495e; position: relative; border: 2px solid #ecf0f1; margin-top: 20px; overflow: hidden; cursor: crosshair; }
        .target { position: absolute; background: #e74c3c; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: crosshair; user-select: none; }
        .target::after { content: ''; width: 50%; height: 50%; background: white; border-radius: 50%; position: absolute; }
        .target::before { content: ''; width: 20%; height: 20%; background: #e74c3c; border-radius: 50%; position: absolute; z-index: 2; }
        .stats { display: flex; gap: 30px; font-size: 1.5rem; margin-top: 10px; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 1.2rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; z-index: 10; }
        button:hover { background: #2980b9; }
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Aim Trainer - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <h1>Aim Trainer</h1>

    <div class="stats">
        <div>Ziele: <span id="score">0</span>/30</div>
        <div>Zeit: <span id="time">0.00</span>s</div>
    </div>

    <div class="game-area" id="gameArea">
        <div id="startScreen">
            <h2>Klicke 30 Ziele so schnell wie möglich!</h2>
            <button onclick="startGame()">Start</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startScreen = document.getElementById('startScreen');

        let score = 0;
        let startTime;
        let timerInterval;
        let isPlaying = false;
        const maxTargets = 30;

        function startGame() {
            score = 0;
            scoreEl.textContent = score;
            startScreen.style.display = 'none';
            isPlaying = true;
            startTime = Date.now();

            timerInterval = setInterval(() => {
                timeEl.textContent = ((Date.now() - startTime) / 1000).toFixed(2);
            }, 10);

            spawnTarget();
        }

        function spawnTarget() {
            if (!isPlaying) return;

            const target = document.createElement('div');
            target.classList.add('target');

            const size = Math.random() * 40 + 30; // 30px to 70px
            target.style.width = `${size}px`;
            target.style.height = `${size}px`;

            const maxX = gameArea.clientWidth - size;
            const maxY = gameArea.clientHeight - size;

            target.style.left = `${Math.random() * maxX}px`;
            target.style.top = `${Math.random() * maxY}px`;

            target.addEventListener('mousedown', hitTarget);

            gameArea.appendChild(target);
        }

        function hitTarget(e) {
            if (!isPlaying) return;
            e.stopPropagation(); // Prevent game area click

            this.remove();
            score++;
            scoreEl.textContent = score;

            if (score >= maxTargets) {
                endGame();
            } else {
                spawnTarget();
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            timeEl.textContent = finalTime;

            startScreen.innerHTML = `
                <h2>Gut gemacht!</h2>
                <p>Zeit: ${finalTime}s</p>
                <button onclick="startGame()">Nochmal spielen</button>
            `;
            startScreen.style.display = 'flex';

            // Clear remaining targets
            document.querySelectorAll('.target').forEach(t => t.remove());
        }
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'aim-trainer';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
