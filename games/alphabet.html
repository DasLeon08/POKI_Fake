<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Sprint - Jules Spiele</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #34495e, #95a5a6); font-family: 'Nunito', sans-serif; color: white; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        .letter { font-size: 30px; background-color: #ecf0f1; color: #2c3e50; width: 60px; height: 60px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: transform 0.1s, background-color 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .letter:active { transform: scale(0.9); }
        .hidden { visibility: hidden; }
        .info { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .btn-back { margin-top: 30px; display: inline-block; padding: 10px 20px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .timer { font-size: 36px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Alphabet Sprint - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <div class="timer" id="timer">0.00s</div>
    <div class="info">Klicke das Alphabet in der richtigen Reihenfolge! Nächster Buchstabe: <span id="nextLetter">A</span></div>
    <div class="grid" id="grid"></div>
    <a href="../index.html" class="btn-back">Zurück zum Portal</a>

    <script>
        const gridEl = document.getElementById('grid');
        const nextLetterEl = document.getElementById('nextLetter');
        const timerEl = document.getElementById('timer');

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
        let shuffled = [...alphabet].sort(() => Math.random() - 0.5);
        let currentIndex = 0;
        let startTime = 0;
        let timerInterval;

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                let time = (Date.now() - startTime) / 1000;
                timerEl.innerText = time.toFixed(2) + "s";
            }, 10);
        }

        function createGrid() {
            gridEl.innerHTML = '';
            shuffled.forEach(letter => {
                let div = document.createElement('div');
                div.classList.add('letter');
                div.innerText = letter;
                div.onclick = () => {
                    if (letter === alphabet[currentIndex]) {
                        if (currentIndex === 0) startTimer();
                        div.classList.add('hidden');
                        currentIndex++;
                        if (currentIndex < 26) {
                            nextLetterEl.innerText = alphabet[currentIndex];
                        } else {
                            clearInterval(timerInterval);
                            alert(`Du hast das Alphabet in ${timerEl.innerText} geschafft!`);
                            location.reload();
                        }
                    } else {
                        div.style.backgroundColor = '#e74c3c';
                        setTimeout(() => div.style.backgroundColor = '#ecf0f1', 200);
                    }
                };
                gridEl.appendChild(div);
            });
        }

        createGrid();
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'alphabet';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
