<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Balance Akt</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #89f7fe; padding-top: 50px; overflow: hidden; }
        #board { width: 300px; height: 20px; background: #333; margin: 150px auto 0; position: relative; transform-origin: center; transition: transform 0.1s; }
        #ball { width: 30px; height: 30px; background: red; border-radius: 50%; position: absolute; top: -30px; left: 135px; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Balance Akt</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Balance Akt</h1>
    <p>Benutze Links/Rechts oder A/D, um das Brett zu neigen und den Ball in der Mitte zu halten!</p>
    <p>Zeit: <span id="time">0</span>s</p>
    <div id="board"><div id="ball"></div></div>
    <br><br>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        let angle = 0, ballPos = 135, time = 0, interval, playing = true;
        const board = document.getElementById('board'), ball = document.getElementById('ball'), timeEl = document.getElementById('time');

        document.addEventListener('keydown', e => { if(e.key==='ArrowLeft'||e.key==='a') angle-=5; if(e.key==='ArrowRight'||e.key==='d') angle+=5; });

        interval = setInterval(() => {
            if(!playing) return;
            time += 0.05; timeEl.textContent = Math.floor(time);
            angle += (Math.random() - 0.5) * 2; // random tilt
            ballPos += angle * 0.1;
            board.style.transform = `rotate(${angle}deg)`;
            ball.style.left = ballPos + 'px';
            if(ballPos < -15 || ballPos > 285) { playing=false; clearInterval(interval); alert('Game Over! Zeit: ' + Math.floor(time) + 's'); location.reload(); }
        }, 50);
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'balance';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
