<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Ballon Zerplatzen</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fecfef; padding-top: 50px; }
        #game { position: relative; width: 400px; height: 500px; margin: 0 auto; background: white; border: 2px solid #333; overflow: hidden; }
        .balloon { position: absolute; font-size: 40px; cursor: pointer; user-select: none; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Ballon Zerplatzen</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Ballon Zerplatzen</h1>
    <p>Punkte: <span id="score">0</span> | Zeit: <span id="time">30</span></p>
    <div id="game"></div>
    <br>
    <button class="btn" onclick="startGame()">Start</button>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        let score = 0, time = 30, interval, spawnInterval;
        const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time'), game = document.getElementById('game');
        function startGame() {
            score = 0; time = 30; scoreEl.textContent = score; timeEl.textContent = time;
            game.innerHTML = ''; clearInterval(interval); clearInterval(spawnInterval);
            interval = setInterval(() => { time--; timeEl.textContent = time; if (time <= 0) endGame(); }, 1000);
            spawnInterval = setInterval(spawnBalloon, 800);
        }
        function spawnBalloon() {
            const b = document.createElement('div');
            b.classList.add('balloon');
            b.textContent = '🎈';
            b.style.left = Math.random() * 350 + 'px';
            b.style.bottom = '-50px';
            game.appendChild(b);
            let pos = -50;
            const fly = setInterval(() => {
                if (time <= 0) { clearInterval(fly); return; }
                pos += 2; b.style.bottom = pos + 'px';
                if (pos > 500) { clearInterval(fly); if (game.contains(b)) game.removeChild(b); }
            }, 20);
            b.onclick = () => {
                score++; scoreEl.textContent = score;
                b.textContent = '💥';
                setTimeout(() => { if(game.contains(b)) game.removeChild(b); }, 100);
            };
        }
        function endGame() { clearInterval(interval); clearInterval(spawnInterval); alert('Zeit abgelaufen! Punkte: ' + score); }
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'balloon-pop';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
