<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheese Rolling - Poki Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f1c40f;
            color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            padding: 10px 20px;
            background-color: #f39c12;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 2px solid #e67e22;
        }
        .back-btn {
            background-color: #d35400;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
        }
        .back-btn:hover { background-color: #e67e22; }
        #game-container {
            position: relative;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hidden { display: none !important; }
        .screen {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            border: 2px solid #e67e22;
        }
        h1 { margin-top: 0; color: #d35400; }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover { background-color: #27ae60; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
        }
        .controls-info {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Cheese Rolling - Poki Clone</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <header>
        <h2>Cheese Rolling</h2>

    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud" class="hidden">
            <div id="distanceDisplay">Distance: 0m</div>
            <div id="speedDisplay">Speed: 0 km/h</div>
        </div>
        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <h1>Cheese Rolling</h1>
                <p>Roll the cheese wheel down the hill!</p>
                <div class="controls-info">
                    Tap/Click rapidly to gain initial speed.<br>
                    Use LEFT/RIGHT arrows to steer around obstacles.
                </div>
                <button id="start-btn">Start Rolling</button>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <h1>Crash!</h1>
                <p>You rolled <span id="final-distance">0</span> meters.</p>
                <button id="restart-btn">Roll Again</button>
            </div>
        </div>
    </div>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>

            // Advanced Particle System Graphics

            // Playable Particle Popper Mechanics

            // ==========================================
            // SUPERCHARGED PARTICLE POPPER V3.0
            // ==========================================

            // ==========================================
            // SUPERCHARGED PARTICLE POPPER V4.0 (WAVES & POWERUPS)
            // ==========================================

            // ==========================================
            // SUPERCHARGED PARTICLE POPPER V11.0 (LEGENDARY)
            // Added: Meteor Showers, Shield Generators
            // ==========================================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            // State
            let score = 0;
            let highScore = localStorage.getItem('poki_highscore_v5') || 0;
            let combo = 0;
            let comboTimer = 0;
            let maxCombo = 0;
            let gameSpeed = 1;
            let frameCount = 0;

            let wave = 1;
            let particlesToClear = 50;
            let particlesCleared = 0;

            let powerupMagnet = 0;
            let powerupFreeze = 0;

            let particles = [];
            let explosions = [];
            let floatingTexts = [];
            let shockwaves = [];
            let lightning = [];
            let portals = [];
            let meteors = [];
             let meteorShower = 0;
             let paintSplatter = 0;

            // Mouse
            let mouse = { x: -1000, y: -1000, vx: 0, vy: 0, isDown: false, charge: 0 };

            canvas.addEventListener('mousemove', (e) => {
                const r = canvas.getBoundingClientRect();
                mouse.x = e.clientX - r.left;
                mouse.y = e.clientY - r.top;
            });
            canvas.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });

            const colors = ['#FF0099', '#493240', '#00C9FF', '#92FE9D', '#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6348', '#a29bfe', '#fd79a8', '#f9ca24'];

            class Particle {
                constructor() {
                    this.x = Math.random() * (canvas.width / dpr);
                    this.y = Math.random() * (canvas.height / dpr);
                    this.vx = (Math.random() - 0.5) * 4 * gameSpeed;
                    this.vy = (Math.random() - 0.5) * 4 * gameSpeed;
                    this.radius = Math.random() * 5 + 3;
                    this.hp = 1; // v7
                    this.color = colors[Math.floor(Math.random() * colors.length)];

                    const rand = Math.random();
                    this.type = 'normal';

                    if (rand > 0.97) { this.type = 'bomb'; this.color = '#fff'; this.radius = 8; }
                    else if (rand > 0.94) { this.type = 'magnet'; this.color = '#9b59b6'; this.radius = 10; }
                    else if (rand > 0.91) { this.type = 'freeze'; this.color = '#00ffff'; this.radius = 10; }
                    else if (rand > 0.88) { this.type = 'lightning'; this.color = '#f1c40f'; this.radius = 10; } // V5
                    else if (rand > 0.86) { this.type = 'blackhole'; this.color = '#000000'; this.radius = 15; }
             else if (rand > 0.84) { this.type = 'shield_gen'; this.color = '#3498db'; this.radius = 12; this.hp = 3; }
             else if (rand > 0.82) { this.type = 'nuclear'; this.color = '#2ecc71'; this.radius = 14; }
             else if (rand > 0.80) { this.type = 'ghost'; this.color = '#bdc3c7'; this.radius = 10; this.alpha = 0; this.phase = Math.random()*Math.PI; }
             else if (rand > 0.78) { this.type = 'virus'; this.color = '#8e44ad'; this.radius = 8; this.infectionTimer = 0; }
             else if (rand > 0.76) { this.type = 'ninja'; this.color = '#fff'; this.radius = 6; this.alpha = 0; }
             else if (rand > 0.74) { this.type = 'paint'; this.color = '#e84393'; this.radius = 12; }

                    // V7 Boss Injection (every 5 waves)
                    if (wave % 5 === 0 && Math.random() > 0.98) {
                        this.type = 'boss';
                        this.color = '#e74c3c';
                        this.radius = 40;
                        this.hp = 10;
                        this.vx *= 0.5; this.vy *= 0.5;
                    } // V5
                }
                update() {
                    let speedMult = gameSpeed;
                    if (powerupFreeze > 0) speedMult *= 0.1;
             if (paintSplatter > 0) speedMult *= 0.5; // Sticky paint

                    if (this.type === 'ninja') {
                    const dx = mouse.x - this.x; const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150 || paintSplatter > 0) this.alpha = 1;
                    else this.alpha = 0;
             }
             if (this.type === 'ghost') {
                        this.phase += 0.05 * speedMult;
                        this.alpha = (Math.sin(this.phase) + 1) / 2; // 0 to 1
                    }

                    this.x += this.vx * speedMult;
                    this.y += this.vy * speedMult;

                    if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
                    if (this.x > (canvas.width / dpr) - this.radius) { this.x = (canvas.width / dpr) - this.radius; this.vx *= -1; }
                    if (this.y < this.radius) { this.y = this.radius; this.vy *= -1; }
                    if (this.y > (canvas.height / dpr) - this.radius) { this.y = (canvas.height / dpr) - this.radius; this.vy *= -1; }

                    if (powerupMagnet > 0 && mouse.x > 0 && this.type !== 'blackhole') {
                        const dx = mouse.x - this.x; const dy = mouse.y - this.y;
                        if (Math.sqrt(dx*dx + dy*dy) < 400) {
                            this.vx += dx * 0.002; this.vy += dy * 0.002;
                            const s = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                            if(s > 10) { this.vx = (this.vx/s)*10; this.vy = (this.vy/s)*10; }
                        }
                    } else if(this.type === 'normal') {
                        const dx = mouse.x - this.x; const dy = mouse.y - this.y;
                        if (Math.sqrt(dx*dx + dy*dy) < 100) { this.vx -= dx * 0.005; this.vy -= dy * 0.005; }
                    }


            // Portal Teleportation
            portals.forEach(pt => {
                const dx = pt.x - this.x;
                const dy = pt.y - this.y;
                if(Math.sqrt(dx*dx + dy*dy) < 30) {
                    const linked = portals.find(p => p.id === pt.link);
                    if(linked && !this.justTeleported) {
                        this.x = linked.x;
                        this.y = linked.y;
                        this.justTeleported = 30; // cooldown
                        if(window.audio) window.audio.playJump();
                        createExplosion(linked.x, linked.y, linked.color, false);
                    }
                }
            });
            if(this.justTeleported > 0) this.justTeleported--;

            if (this.type === 'blackhole') {
                        // Pull other particles into it
                        particles.forEach(p => {
                            if (p !== this && p.type !== 'blackhole') {
                                const dx = this.x - p.x; const dy = this.y - p.y;
                                const d2 = dx*dx + dy*dy;
                                if (d2 < 60000) { p.vx += (dx/Math.sqrt(d2)) * 0.1; p.vy += (dy/Math.sqrt(d2)) * 0.1; }
                            }
                        });
                    }
                }
                draw() {
                    ctx.beginPath();
                    if (this.type === 'magnet' || this.type === 'freeze' || this.type === 'lightning') {
                        let rot = Math.PI / 2 * 3; let x = this.x; let y = this.y; let step = Math.PI / 5;
                        let outerRadius = this.radius; let innerRadius = this.radius / 2;
                        ctx.moveTo(this.x, this.y - outerRadius);
                        for(let i=0; i<5; i++){
                            x = this.x + Math.cos(rot)*outerRadius; y = this.y + Math.sin(rot)*outerRadius; ctx.lineTo(x,y); rot += step;
                            x = this.x + Math.cos(rot)*innerRadius; y = this.y + Math.sin(rot)*innerRadius; ctx.lineTo(x,y); rot += step;
                        }
                        ctx.lineTo(this.x, this.y - outerRadius);
                    } else if (this.type === 'blackhole') {
                        ctx.arc(this.x, this.y, this.radius + Math.sin(frameCount*0.1)*3, 0, Math.PI * 2);
                    } else {
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    }

                    ctx.fillStyle = this.type === 'ghost' ? `rgba(189, 195, 199, ${this.alpha})` : this.color;
                    ctx.shadowBlur = this.type !== 'normal' ? 20 : 10;
                    ctx.shadowColor = this.type === 'blackhole' ? '#fff' : this.color;
                    ctx.fill();
                    ctx.closePath();
                    if (this.isShielded) {
                        ctx.strokeStyle = '#3498db'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI*2); ctx.stroke();
                    }

                    if (this.type === 'bomb') { ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 2; ctx.stroke(); }
                    else if (this.type === 'blackhole') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
                    else if (this.type === 'shield_gen') {
                        ctx.strokeStyle = '#3498db'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 8, 0, (Math.PI*2) * (this.hp/3)); ctx.stroke();
                        ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
                        ctx.beginPath(); ctx.arc(this.x, this.y, 150, 0, Math.PI*2); ctx.fill(); // range indicator
                    } else if (this.type === 'ninja' && this.alpha > 0) {
                 ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
                 ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.stroke();
             } else if (this.type === 'paint') {
                 // Spiky paint ball
                 ctx.beginPath();
                 for(let i=0; i<Math.PI*2; i+=Math.PI/6) {
                     ctx.lineTo(this.x + Math.cos(i)*(this.radius + Math.random()*5), this.y + Math.sin(i)*(this.radius + Math.random()*5));
                 }
                 ctx.closePath(); ctx.fill();
             } else if (this.type === 'nuclear') {
                        ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI*2); ctx.stroke();
                    } else if (this.type === 'boss') {
                        ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 5, 0, (Math.PI*2) * (this.hp/10)); ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                }
            }

            class Shockwave {
                constructor(x, y, color) { this.x=x; this.y=y; this.color=color; this.radius=0; this.life=1; }
                update() { this.radius += 8; this.life -= 0.04; }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.strokeStyle = `${this.color.replace(')', `,${this.life})`).replace('rgb', 'rgba')}`;
                    ctx.lineWidth = 4 * this.life; ctx.stroke(); ctx.closePath();
                }
            }

            class FloatingText {
                constructor(x, y, text, color, scale=1) { this.x=x; this.y=y; this.text=text; this.color=color; this.life=1; this.vy=-2; this.scale=scale; }
                update() { this.y += this.vy; this.life -= 0.02; }
                draw() {
                    ctx.fillStyle = `rgba(255,255,255,${this.life})`;
                    ctx.font = `bold ${20 * this.scale}px "Fredoka One"`;
                    ctx.textAlign = 'center'; ctx.shadowBlur = 5; ctx.shadowColor = this.color;
                    ctx.fillText(this.text, this.x, this.y); ctx.shadowBlur = 0;
                }
            }

            function createExplosion(x, y, color, isBig = false) {
                const count = isBig ? 30 : 10;
                for(let i=0; i<count; i++) {
                    explosions.push({ x: x, y: y, vx: (Math.random() - 0.5) * (isBig ? 18 : 8), vy: (Math.random() - 0.5) * (isBig ? 18 : 8), life: 1.0, color: color });
                }
                shockwaves.push(new Shockwave(x, y, color === '#fff' ? 'rgb(255,255,255)' : 'rgb(0,255,255)'));
                if (window.audio && isBig) window.audio.playExplosion();
                else if (window.audio) window.audio.playLaser();
            }

            function createLightning(p1, p2) {
                lightning.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, life: 1.0 });
            }


            // V6 Mirror Portals
            portals.push({x: canvas.width/dpr * 0.1, y: canvas.height/dpr * 0.5, id: 0, link: 1, color: '#e67e22', angle: 0});
            portals.push({x: canvas.width/dpr * 0.9, y: canvas.height/dpr * 0.5, id: 1, link: 0, color: '#e67e22', angle: 0});

            for (let i = 0; i < 70; i++) particles.push(new Particle());

            function nextWave() {
                wave++;
                floatingTexts.push(new FloatingText(canvas.width/(2*dpr), canvas.height/(2*dpr), `WAVE ${wave}!`, '#f1c40f', 2));
                particlesToClear = 50 + (wave * 20); particlesCleared = 0; gameSpeed += 0.2;
                for (let i = 0; i < 70 + (wave * 5); i++) { setTimeout(() => particles.push(new Particle()), Math.random() * 2000); }
            }

            canvas.addEventListener('mousedown', (e) => {
                mouse.isDown = true;
                const r = canvas.getBoundingClientRect();
                mouse.x = e.clientX - r.left;
                mouse.y = e.clientY - r.top;

                const r = canvas.getBoundingClientRect();
                const mx = e.clientX - r.left; const my = e.clientY - r.top;

                let hit = false;
             let newProjectiles = []; // for nuclear

             // Check Meteors First (Overlay)
             for (let i = meteors.length - 1; i >= 0; i--) {
                 const m = meteors[i];
                 const dx = mx - m.x; const dy = my - m.y;
                 if (Math.sqrt(dx*dx + dy*dy) <= m.radius) {
                     m.hp--;
                     createExplosion(m.x, m.y, m.color, false);
                     if (m.hp <= 0) {
                         createExplosion(m.x, m.y, '#e74c3c', true);
                         score += 500 * combo;
                         floatingTexts.push(new FloatingText(m.x, m.y, "+500", "#f1c40f", 2));
                         meteors.splice(i, 1);
                     }
                     hit = true; combo++;
                     if(window.audio) window.audio.playExplosion();
                     break; // hit only 1
                 }
             }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    const dx = mx - p.x; const dy = my - p.y;
                    // Check Ghost tangibility
                    const isTangible = (p.type !== 'ghost' && p.type !== 'ninja') ||
                               (p.type === 'ghost' && p.alpha > 0.7) ||
                               (p.type === 'ninja' && p.alpha > 0);

                    if (Math.sqrt(dx*dx + dy*dy) <= p.radius * 3.5 && !p.isShielded && isTangible) {
                        if (p.type === 'bomb' || p.type === 'blackhole') {
                            createExplosion(p.x, p.y, p.color, true);
                            floatingTexts.push(new FloatingText(p.x, p.y, p.type === 'blackhole' ? "SINGULARITY!" : "BOOM!", "#fff", 1.5));
                            particles.splice(i, 1);

                            for(let j = particles.length - 1; j >= 0; j--) {
                                const bp = particles[j];
                                const bdx = p.x - bp.x; const bdy = p.y - bp.y;
                                if(Math.sqrt(bdx*bdx + bdy*bdy) < 250) {
                                    createExplosion(bp.x, bp.y, bp.color);
                                    score += 20 * combo; particles.splice(j, 1); particlesCleared++;
                                }
                            }
                            hit = true; combo += 5;
                        } else if (p.type === 'lightning') {
                            createExplosion(p.x, p.y, p.color);
                            floatingTexts.push(new FloatingText(p.x, p.y, "CHAIN LIGHTNING!", p.color, 1.5));
                            particles.splice(i, 1);

                            // Chain up to 5 random particles
                            let count = 0; let lastP = {x: p.x, y: p.y};
                            for(let j = particles.length - 1; j >= 0 && count < 5; j--) {
                                const bp = particles[j];
                                createLightning(lastP, bp);
                                createExplosion(bp.x, bp.y, bp.color);
                                score += 20 * combo; particlesCleared++; lastP = {x: bp.x, y: bp.y};
                                particles.splice(j, 1); count++;
                            }
                            hit = true; combo += 3;
                        } else if (p.type === 'magnet') {
                            createExplosion(p.x, p.y, p.color); floatingTexts.push(new FloatingText(p.x, p.y, "MAGNET!", p.color, 1.5));
                            powerupMagnet = 600; particles.splice(i, 1); hit = true; combo++; particlesCleared++;
                        } else if (p.type === 'freeze') {
                            createExplosion(p.x, p.y, p.color); floatingTexts.push(new FloatingText(p.x, p.y, "TIME FREEZE!", p.color, 1.5));
                            powerupFreeze = 300; particles.splice(i, 1); hit = true; combo++; particlesCleared++;
                        } else {
                            createExplosion(p.x, p.y, p.color); floatingTexts.push(new FloatingText(p.x, p.y, `+${10 * (combo+1)}`, p.color));
                            particles.splice(i, 1); hit = true; combo++; if (p.type !== 'boss') score += 10 * combo;
                            if (window.audio) window.audio.playCoin(); particlesCleared++;
                            if(particles.length < 30) particles.push(new Particle());
                        }

                        comboTimer = 120; if(combo > maxCombo) maxCombo = combo;
                        if (window.userSystem) window.userSystem.addXP(Math.min(combo, 15));
                    }
                }

                particles.push(...newProjectiles);

                if (!hit) {
                    combo = 0;
                    // Don't miss if we are charging railgun
                    if (mouse.charge === 0) floatingTexts.push(new FloatingText(mx, my, "Miss!", "#ff4757"));
                }
                else {
                    if (score > highScore) { highScore = score; localStorage.setItem('poki_highscore_v5', highScore); }
                    if (particlesCleared >= particlesToClear) {
                nextWave();
                // V8 Event Trigger: 20% chance per wave
                if (Math.random() < 0.2) {
                    meteorShower = 300; // 5 seconds
                    floatingTexts.push(new FloatingText(canvas.width/(2*dpr), canvas.height/(2*dpr)+40, "METEOR SHOWER!", "#e74c3c", 2));
                    if(window.audio) window.audio.playExplosion();
                }
            }
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                mouse.isDown = false;

                // Fire Railgun
                if (mouse.charge > 60) {
                    const r = canvas.getBoundingClientRect();
                    const endX = e.clientX - r.left; const endY = e.clientY - r.top;

                    // Draw Beam
                    ctx.beginPath(); ctx.moveTo(canvas.width/(2*dpr), canvas.height/dpr); ctx.lineTo(endX, endY);
                    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 10; ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000'; ctx.stroke();
                    ctx.shadowBlur = 0;

                    if(window.audio) window.audio.playLaser();
                    floatingTexts.push(new FloatingText(endX, endY, "RAILGUN!", "#e74c3c", 2));

                    // Calculate Line Collision
                    const cx = canvas.width/(2*dpr); const cy = canvas.height/dpr;
                    const lineLen = Math.sqrt((endX-cx)**2 + (endY-cy)**2);

                    for(let i=particles.length-1; i>=0; i--) {
                        let p = particles[i];

                        // Distance from point to line segment
                        const l2 = lineLen**2;
                        if (l2 === 0) continue;
                        let t = ((p.x - cx) * (endX - cx) + (p.y - cy) * (endY - cy)) / l2;
                        t = Math.max(0, Math.min(1, t));
                        const projX = cx + t * (endX - cx); const projY = cy + t * (endY - cy);

                        if (Math.sqrt((p.x-projX)**2 + (p.y-projY)**2) < p.radius + 15) {
                            // Destroy
                            createExplosion(p.x, p.y, p.color);
                            particles.splice(i, 1);
                            score += 50; combo++; particlesCleared++;
                        }
                    }
                    createExplosion(endX, endY, '#ff0000', true);
                    mouse.charge = 0;
                }
            });

            let stars = Array.from({length: 80}, () => ({ x: Math.random() * (canvas.width/dpr), y: Math.random() * (canvas.height/dpr), s: Math.random() * 3 + 0.5, c: `hsl(${Math.random()*360}, 80%, 80%)` }));

            function drawCRT() {
                // V5 CRT Scanline Overlay
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for(let i=0; i<canvas.height/dpr; i+=4) { ctx.fillRect(0, i, canvas.width/dpr, 1); }
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.02})`;
                ctx.fillRect(0, 0, canvas.width/dpr, canvas.height/dpr);
            }

            function animate() {
                frameCount++;
                if(powerupFreeze > 0) { ctx.fillStyle = 'rgba(10, 20, 35, 0.5)'; powerupFreeze--; }
                else if(powerupMagnet > 0) { ctx.fillStyle = 'rgba(25, 10, 35, 0.3)'; powerupMagnet--; }
                else { ctx.fillStyle = 'rgba(10, 14, 25, 0.35)'; }
                ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

                stars.forEach(s => {
                    let speed = s.s * 0.5 * gameSpeed;
                    if(powerupFreeze > 0) speed *= 0.1;
                    s.y += speed; if(s.y > canvas.height/dpr) s.y = 0;
                    ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, s.s, s.s);
                });

                for(let i=0; i<particles.length; i++) {
                    for(let j=i+1; j<particles.length; j++) {
                        const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                        const dist = dx*dx + dy*dy;
                        if(dist < 10000) {
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 255, 255, ${0.25 - dist/40000})`;
                            ctx.lineWidth = powerupMagnet > 0 ? 2 : 1; ctx.stroke();
                        }
                    }
                }

                // Lightning
                for(let i=lightning.length-1; i>=0; i--) {
                    let l = lightning[i];
                    ctx.beginPath(); ctx.moveTo(l.x1, l.y1);
                    // Jagged line
                    let dx = l.x2 - l.x1; let dy = l.y2 - l.y1;
                    ctx.lineTo(l.x1 + dx/2 + (Math.random()-0.5)*50, l.y1 + dy/2 + (Math.random()-0.5)*50);
                    ctx.lineTo(l.x2, l.y2);
                    ctx.strokeStyle = `rgba(241, 196, 15, ${l.life})`; ctx.lineWidth = 3;
                    ctx.stroke();
                    l.life -= 0.1;
                    if(l.life <= 0) lightning.splice(i, 1);
                }

                // Shield Gen Logic
             let shieldedParticles = [];
             particles.forEach(sg => {
                 if (sg.type === 'shield_gen') {
                     particles.forEach(p => {
                         if (p !== sg && Math.abs(sg.x - p.x) < 150 && Math.abs(sg.y - p.y) < 150) {
                             shieldedParticles.push(p);
                             ctx.beginPath();
                             ctx.moveTo(sg.x, sg.y); ctx.lineTo(p.x, p.y);
                             ctx.strokeStyle = 'rgba(52, 152, 219, 0.4)';
                             ctx.lineWidth = 2; ctx.stroke();
                         }
                     });
                 }
             });

             // Meteor Logic
             if (meteorShower > 0) {
                 meteorShower--;
                 if (frameCount % 10 === 0) {
                     meteors.push({
                         x: Math.random() * canvas.width/dpr, y: -50,
                         vx: (Math.random()-0.5)*5, vy: 15 + Math.random()*10,
                         radius: 20 + Math.random()*20, color: '#e67e22', hp: 1
                     });
                 }
             }

             for(let i=meteors.length-1; i>=0; i--) {
                 let m = meteors[i];
                 m.x += m.vx; m.y += m.vy;

                 // Draw
                 ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI*2);
                 ctx.fillStyle = m.color; ctx.shadowBlur = 20; ctx.shadowColor = '#e74c3c'; ctx.fill(); ctx.shadowBlur = 0;

                 // Tail
                 ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx*5, m.y - m.vy*5);
                 ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = m.radius; ctx.stroke();

                 if (m.y > canvas.height/dpr + 50) meteors.splice(i, 1);
             }

             particles.forEach(p => {
                 p.isShielded = shieldedParticles.includes(p);

                 // Virus Infection Logic
                 if (p.type === 'virus') {
                     p.infectionTimer++;
                     if (p.infectionTimer > 180) { // 3 seconds
                         p.infectionTimer = 0;
                         // Infect closest normal
                         let closest = null; let minDist = 100;
                         particles.forEach(np => {
                             if(np.type === 'normal' && !np.isShielded) {
                                 const d = Math.sqrt((p.x-np.x)**2 + (p.y-np.y)**2);
                                 if (d < minDist) { minDist = d; closest = np; }
                             }
                         });
                         if (closest) {
                             closest.type = 'virus';
                             closest.color = '#8e44ad';
                             closest.infectionTimer = 0;
                             ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(closest.x, closest.y);
                             ctx.strokeStyle = '#8e44ad'; ctx.lineWidth = 3; ctx.stroke();
                         }
                     }
                     // Pulsing visual
                     p.radius = 8 + Math.sin(frameCount*0.2)*3;
                 }

                 p.update(); p.draw();
             });

             // Railgun Charge Logic
             if (mouse.isDown) {
                 mouse.charge++;
                 if (mouse.charge > 60) {
                     // Draw laser sight
                     ctx.beginPath(); ctx.moveTo(canvas.width/(2*dpr), canvas.height/dpr); ctx.lineTo(mouse.x, mouse.y);
                     ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)'; ctx.setLineDash([5, 15]); ctx.stroke(); ctx.setLineDash([]);
                 }
             } else {
                 mouse.charge = 0;
             }


                for(let i = shockwaves.length - 1; i >= 0; i--) { shockwaves[i].update(); shockwaves[i].draw(); if(shockwaves[i].life <= 0) shockwaves.splice(i, 1); }

                for(let i = explosions.length - 1; i >= 0; i--) {
                    let ex = explosions[i]; let speed = powerupFreeze > 0 ? 0.2 : 1;
                    ex.x += ex.vx * speed; ex.y += ex.vy * speed; ex.life -= 0.03 * speed;
                    if(ex.life <= 0) { explosions.splice(i, 1); continue; }
                    ctx.beginPath(); ctx.arc(ex.x, ex.y, 3 * ex.life, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${ex.life})`; ctx.shadowBlur = 10; ctx.shadowColor = ex.color;
                    ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;
                }

                for(let i = floatingTexts.length - 1; i >= 0; i--) {
                    let speed = powerupFreeze > 0 ? 0.5 : 1;
                    floatingTexts[i].y += floatingTexts[i].vy * speed; floatingTexts[i].life -= 0.02 * speed; floatingTexts[i].draw();
                    if(floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
                }

                ctx.fillStyle = 'white'; ctx.font = 'bold 24px "Fredoka One", cursive'; ctx.textAlign = 'left';
                ctx.fillText(`Punkte: ${score}`, 20, 40);
                ctx.font = 'bold 16px "Nunito"'; ctx.fillStyle = '#95a5a6';
                ctx.fillText(`High Score: ${highScore} | Max Combo: ${maxCombo}`, 20, 65);

                ctx.fillStyle = '#2c3e50'; ctx.fillRect(20, 80, 200, 10);
                ctx.fillStyle = '#f1c40f'; ctx.fillRect(20, 80, 200 * (particlesCleared / particlesToClear), 10);
                ctx.fillStyle = 'white'; ctx.fillText(`WAVE ${wave}`, 230, 90);

                if (combo > 1 && comboTimer > 0) {
                    comboTimer--; const scale = 1 + (comboTimer/120) * 0.5;
                    ctx.save(); ctx.translate(20, 130); ctx.scale(scale, scale);
                    ctx.fillStyle = `hsla(${combo * 10}, 100%, 60%, ${comboTimer/120})`;
                    ctx.font = 'bold 32px "Fredoka One", cursive'; ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
                    ctx.fillText(`${combo}x COMBO!`, 0, 0); ctx.restore();
                } else if (comboTimer <= 0) { combo = 0; }

                if(paintSplatter > 0) {
                 paintSplatter--;
                 // Draw literal splatters
                 ctx.fillStyle = 'rgba(232, 67, 147, 0.4)';
                 ctx.beginPath(); ctx.arc(canvas.width/(2*dpr) - 100, canvas.height/(2*dpr) - 50, 80, 0, Math.PI*2); ctx.fill();
                 ctx.beginPath(); ctx.arc(canvas.width/(2*dpr) + 150, canvas.height/(2*dpr) + 100, 120, 0, Math.PI*2); ctx.fill();
             }
             if(powerupMagnet > 0) { ctx.fillStyle = '#9b59b6'; ctx.fillText(`MAGNET: ${Math.ceil(powerupMagnet/60)}s`, 20, canvas.height/dpr - 40); }
                if(powerupFreeze > 0) { ctx.fillStyle = '#00ffff'; ctx.fillText(`FREEZE: ${Math.ceil(powerupFreeze/60)}s`, 20, canvas.height/dpr - 20); }


                // Draw Portals
                portals.forEach(pt => {
                    pt.angle += 0.05;
                    ctx.save();
                    ctx.translate(pt.x, pt.y);
                    ctx.rotate(pt.angle);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 20, 30 + Math.sin(frameCount*0.1)*5, 0, 0, Math.PI*2);
                    ctx.strokeStyle = pt.color;
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = pt.color;
                    ctx.stroke();
                    ctx.restore();
                });

                // Screen Shake logic tied to explosions (simulated by translating canvas context)
                if(explosions.length > 20) {
                    ctx.setTransform(dpr, 0, 0, dpr, (Math.random()-0.5)*5, (Math.random()-0.5)*5);
                } else {
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }

                drawCRT();
                requestAnimationFrame(animate);
            }
            animate();
});
    </script>
