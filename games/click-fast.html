<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Klick-Meister</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #d57eeb; padding-top: 50px; }
        #target { width: 100px; height: 100px; background: white; border-radius: 50%; display: inline-block; margin-top: 50px; font-size: 30px; line-height: 100px; cursor: pointer; user-select: none; }
        #target:active { transform: scale(0.95); background: #eee; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Klick-Meister</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Klick-Meister</h1>
    <p>Klicke so oft du kannst in 10 Sekunden!</p>
    <p>Verbleibende Zeit: <span id="time">10</span>s</p>
    <div id="target" onclick="clickTarget()">0</div>
    <br>
    <button class="btn" onclick="start()">Start</button>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        let score = 0, time = 10, playing = false, interval;
        const target = document.getElementById('target'), timeEl = document.getElementById('time');
        function start() {
            score = 0; time = 10; playing = true; target.textContent = score; timeEl.textContent = time;
            clearInterval(interval);
            interval = setInterval(() => {
                time--; timeEl.textContent = time;
                if (time <= 0) { playing = false; clearInterval(interval); alert('Du hast ' + score + ' mal geklickt!'); }
            }, 1000);
        }
        function clickTarget() { if (playing) { score++; target.textContent = score; } }
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'click-fast';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
