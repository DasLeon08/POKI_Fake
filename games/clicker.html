<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Clicker Game - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .click-area { width: 200px; height: 200px; background-color: #f1c40f; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #333; cursor: pointer; user-select: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.1s; margin-top: 30px; }
        .click-area:active { transform: scale(0.95); }
        .stats { display: flex; gap: 20px; margin-top: 20px; font-size: 1.5rem; }
        .upgrades { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
        .upgrade-btn { padding: 10px 20px; font-size: 1rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; display: flex; justify-content: space-between; min-width: 250px; }
        .upgrade-btn:hover { background: #2980b9; }
        .upgrade-btn:disabled { background: #95a5a6; cursor: not-allowed; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">Zurück zum Portal</a>
    <h1>Cookie Clicker</h1>

    <div class="stats">
        <div>Cookies: <span id="score">0</span></div>
        <div>Cookies pro Klick: <span id="cpc">1</span></div>
        <div>Cookies pro Sekunde: <span id="cps">0</span></div>
    </div>

    <div class="click-area" id="clickArea">Klick mich!</div>

    <div class="upgrades">
        <h3>Upgrades:</h3>
        <button class="upgrade-btn" id="upgClick" onclick="buyClickUpgrade()">
            <span>Klick-Kraft (+1/Klick)</span>
            <span id="costClick">10</span>
        </button>
        <button class="upgrade-btn" id="upgAuto" onclick="buyAutoUpgrade()">
            <span>Auto-Klicker (+1/s)</span>
            <span id="costAuto">50</span>
        </button>
    </div>

    <script>
        let score = 0;
        let cookiesPerClick = 1;
        let cookiesPerSecond = 0;

        let costClick = 10;
        let costAuto = 50;

        const scoreEl = document.getElementById('score');
        const cpcEl = document.getElementById('cpc');
        const cpsEl = document.getElementById('cps');
        const clickArea = document.getElementById('clickArea');
        const upgClickBtn = document.getElementById('upgClick');
        const upgAutoBtn = document.getElementById('upgAuto');
        const costClickEl = document.getElementById('costClick');
        const costAutoEl = document.getElementById('costAuto');

        clickArea.addEventListener('click', () => {
            score += cookiesPerClick;
            updateDisplay();
        });

        function buyClickUpgrade() {
            if (score >= costClick) {
                score -= costClick;
                cookiesPerClick++;
                costClick = Math.floor(costClick * 1.5);
                updateDisplay();
            }
        }

        function buyAutoUpgrade() {
            if (score >= costAuto) {
                score -= costAuto;
                cookiesPerSecond++;
                costAuto = Math.floor(costAuto * 1.5);
                updateDisplay();
            }
        }

        function updateDisplay() {
            scoreEl.textContent = Math.floor(score);
            cpcEl.textContent = cookiesPerClick;
            cpsEl.textContent = cookiesPerSecond;
            costClickEl.textContent = costClick;
            costAutoEl.textContent = costAuto;

            upgClickBtn.disabled = score < costClick;
            upgAutoBtn.disabled = score < costAuto;
        }

        setInterval(() => {
            score += cookiesPerSecond / 10;
            updateDisplay();
        }, 100);

        updateDisplay();
    </script>
</body>
</html>
