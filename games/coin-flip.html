<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kopf oder Zahl - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; perspective: 1000px; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .coin-container { width: 150px; height: 150px; margin: 40px auto; transform-style: preserve-3d; transition: transform 2s ease-out; }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; font-size: 3rem; font-weight: bold; border: 8px solid #f1c40f; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.5); }
        .heads { background: radial-gradient(circle, #f39c12 30%, #e67e22 100%); color: #fff; transform: rotateY(0deg); }
        .tails { background: radial-gradient(circle, #ecf0f1 30%, #bdc3c7 100%); color: #333; transform: rotateY(180deg); }
        .result-text { font-size: 2rem; margin-top: 20px; height: 40px; font-weight: bold; }
        button { padding: 15px 30px; font-size: 1.5rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; margin-top: 30px; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        button:active { transform: translateY(2px); }
        .stats { display: flex; gap: 40px; margin-top: 30px; font-size: 1.2rem; color: #ecf0f1; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Kopf oder Zahl - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <h1>Kopf oder Zahl</h1>

    <div class="coin-container" id="coin">
        <div class="coin-face heads">Kopf</div>
        <div class="coin-face tails">Zahl</div>
    </div>

    <div class="result-text" id="resultText">Drücke auf Werfen</div>

    <button onclick="flipCoin()" id="flipBtn">Münze werfen</button>

    <div class="stats">
        <div>Kopf: <span id="headsCount">0</span></div>
        <div>Zahl: <span id="tailsCount">0</span></div>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const resultText = document.getElementById('resultText');
        const flipBtn = document.getElementById('flipBtn');
        const headsCountEl = document.getElementById('headsCount');
        const tailsCountEl = document.getElementById('tailsCount');

        let isFlipping = false;
        let heads = 0;
        let tails = 0;
        let flips = 0;

        function flipCoin() {
            if (isFlipping) return;
            isFlipping = true;
            flipBtn.disabled = true;
            resultText.textContent = 'Münze fliegt...';

            flips++;
            const random = Math.random();
            const result = random < 0.5 ? 'heads' : 'tails';

            // Reset animation by removing inline transform
            coin.style.transition = 'none';
            coin.style.transform = `rotateY(${flips % 2 === 0 ? 0 : 180}deg)`;

            // Force reflow
            void coin.offsetWidth;

            // Add animation back
            coin.style.transition = 'transform 2s ease-out';

            // Calculate final rotation
            const spins = 5 * 360; // 5 full rotations
            const finalRotation = result === 'heads' ? spins : spins + 180;

            coin.style.transform = `rotateY(${finalRotation}deg)`;

            setTimeout(() => {
                if (result === 'heads') {
                    resultText.textContent = 'Es ist KOPF!';
                    heads++;
                    headsCountEl.textContent = heads;
                } else {
                    resultText.textContent = 'Es ist ZAHL!';
                    tails++;
                    tailsCountEl.textContent = tails;
                }

                // Keep the state for next flip without transition
                coin.style.transition = 'none';
                coin.style.transform = `rotateY(${result === 'heads' ? 0 : 180}deg)`;

                isFlipping = false;
                flipBtn.disabled = false;
            }, 2000);
        }
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'coin-flip';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
