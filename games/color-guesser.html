<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Farben Raten - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .color-display { font-size: 3rem; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; padding: 20px; border-radius: 10px; background: rgba(0,0,0,0.5); }
        .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 600px; }
        .color-box { width: 100px; height: 100px; border-radius: 15px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .color-box:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .color-box:active { transform: scale(0.95); }
        .message { margin-top: 20px; font-size: 1.5rem; height: 30px; }
        .score { font-size: 1.2rem; margin-bottom: 10px; }
        .restart-btn { margin-top: 20px; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .restart-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Farben Raten - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <h1>Finde die richtige Farbe!</h1>

    <div class="score">Punkte: <span id="scoreDisplay">0</span></div>
    <div class="color-display" id="colorDisplay">RGB(255, 255, 255)</div>
    <div class="message" id="message">Klicke auf die richtige Farbe!</div>

    <div class="options" id="container">
        <!-- Farbboxen kommen hier rein -->
    </div>

    <button class="restart-btn" id="resetBtn">Neue Farben</button>

    <script>
        let numSquares = 6;
        let colors = [];
        let pickedColor;
        let score = 0;

        const squares = document.querySelectorAll(".square");
        const colorDisplay = document.getElementById("colorDisplay");
        const messageDisplay = document.getElementById("message");
        const h1 = document.querySelector("h1");
        const resetButton = document.getElementById("resetBtn");
        const container = document.getElementById("container");
        const scoreDisplay = document.getElementById("scoreDisplay");

        init();

        function init() {
            setupSquares();
            reset();
        }

        function setupSquares() {
            container.innerHTML = '';
            for (let i = 0; i < numSquares; i++) {
                const square = document.createElement('div');
                square.classList.add('color-box');
                square.addEventListener("click", function () {
                    let clickedColor = this.style.backgroundColor;
                    if (clickedColor === pickedColor) {
                        messageDisplay.textContent = "Richtig!";
                        resetButton.textContent = "Nochmal spielen?";
                        changeColors(clickedColor);
                        score++;
                        scoreDisplay.textContent = score;
                    } else {
                        this.style.backgroundColor = "#2c3e50"; // Hide wrong answer
                        messageDisplay.textContent = "Falsch, versuch's nochmal!";
                        score = Math.max(0, score - 1);
                        scoreDisplay.textContent = score;
                    }
                });
                container.appendChild(square);
            }
        }

        function reset() {
            colors = generateRandomColors(numSquares);
            pickedColor = pickColor();
            colorDisplay.textContent = pickedColor;
            resetButton.textContent = "Neue Farben";
            messageDisplay.textContent = "Finde die richtige Farbe!";

            const allSquares = document.querySelectorAll('.color-box');
            for (let i = 0; i < allSquares.length; i++) {
                if (colors[i]) {
                    allSquares[i].style.display = "block";
                    allSquares[i].style.backgroundColor = colors[i];
                } else {
                    allSquares[i].style.display = "none";
                }
            }
        }

        resetButton.addEventListener("click", function () {
            reset();
        });

        function changeColors(color) {
            const allSquares = document.querySelectorAll('.color-box');
            for (let i = 0; i < allSquares.length; i++) {
                allSquares[i].style.backgroundColor = color;
            }
        }

        function pickColor() {
            let random = Math.floor(Math.random() * colors.length);
            return colors[random];
        }

        function generateRandomColors(num) {
            let arr = [];
            for (let i = 0; i < num; i++) {
                arr.push(randomColor());
            }
            return arr;
        }

        function randomColor() {
            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);
            return "rgb(" + r + ", " + g + ", " + b + ")";
        }
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'color-guesser';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
