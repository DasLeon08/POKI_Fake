<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vier Gewinnt - Jules Spiele</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f39c12, #d35400); font-family: 'Nunito', sans-serif; color: white; }
        .board { background-color: #34495e; padding: 10px; border-radius: 10px; display: grid; grid-template-columns: repeat(7, 60px); grid-template-rows: repeat(6, 60px); gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); margin-top: 20px; }
        .cell { width: 60px; height: 60px; background-color: #ecf0f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 0.3s; box-shadow: inset 0 5px 10px rgba(0,0,0,0.2); }
        .red { background-color: #e74c3c; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3); }
        .yellow { background-color: #f1c40f; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3); }
        .info { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .btn-back { margin-top: 30px; display: inline-block; padding: 10px 20px; background-color: #2c3e50; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="info">Am Zug: <span id="player">Rot</span></div>
    <div class="board" id="board"></div>
    <a href="../index.html" class="btn-back">Zurück zum Portal</a>

    <script>
        const boardEl = document.getElementById('board');
        const playerEl = document.getElementById('player');
        let currentPlayer = 'red';
        let gameActive = true;
        const columns = 7;
        const rows = 6;
        let board = Array(columns).fill(null).map(() => Array(rows).fill(null));

        function createBoard() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < columns; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.col = c;
                    cell.dataset.row = r;
                    cell.addEventListener('click', handleDrop);
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleDrop(e) {
            if (!gameActive) return;
            let col = parseInt(e.target.dataset.col);
            for (let r = rows - 1; r >= 0; r--) {
                if (!board[col][r]) {
                    board[col][r] = currentPlayer;
                    const cell = document.querySelector(`[data-col="${col}"][data-row="${r}"]`);
                    cell.classList.add(currentPlayer);
                    checkWin(col, r);
                    currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
                    playerEl.innerText = currentPlayer === 'red' ? 'Rot' : 'Gelb';
                    playerEl.style.color = currentPlayer === 'red' ? '#e74c3c' : '#f1c40f';
                    return;
                }
            }
        }

        function checkWin(c, r) {
            const directions = [
                {x: 1, y: 0}, {x: 0, y: 1}, {x: 1, y: 1}, {x: 1, y: -1}
            ];

            for (let {x, y} of directions) {
                let count = 1;
                count += countDirection(c, r, x, y);
                count += countDirection(c, r, -x, -y);
                if (count >= 4) {
                    gameActive = false;
                    setTimeout(() => {
                        alert(`Spieler ${currentPlayer === 'red' ? 'Rot' : 'Gelb'} gewinnt!`);
                        location.reload();
                    }, 100);
                }
            }
        }

        function countDirection(c, r, dx, dy) {
            let count = 0;
            let nc = c + dx;
            let nr = r + dy;
            while (nc >= 0 && nc < columns && nr >= 0 && nr < rows && board[nc][nr] === currentPlayer) {
                count++;
                nc += dx;
                nr += dy;
            }
            return count;
        }

        createBoard();
    </script>
</body>
</html>
