<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker 2</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #f3e5ab; color: #3e2723; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .game-container { background-color: #fff8e1; border: 4px solid #8d6e63; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); padding: 40px; display: flex; gap: 40px; max-width: 800px; width: 100%; }
        .left-panel { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; border-left: 2px dashed #8d6e63; padding-left: 40px; }
        .cookie-btn { background: none; border: none; cursor: pointer; padding: 0; outline: none; transition: transform 0.1s; width: 200px; height: 200px; background-image: radial-gradient(circle, #8d6e63 10%, transparent 10%), radial-gradient(circle, #8d6e63 10%, transparent 10%); background-size: 20px 20px; background-position: 0 0, 10px 10px; background-color: #d7ccc8; border-radius: 50%; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.2); }
        .cookie-btn:active { transform: scale(0.95); }
        .stats { font-size: 28px; font-weight: bold; margin-bottom: 20px; color: #5d4037; }
        .cps { font-size: 18px; color: #795548; margin-bottom: 30px; }
        .upgrade-btn { background: #8d6e63; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; text-align: left; display: flex; justify-content: space-between; transition: background 0.2s; }
        .upgrade-btn:hover { background: #5d4037; }
        .upgrade-btn:disabled { background: #d7ccc8; cursor: not-allowed; }
        .cost { background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 5px; }
        .header { display: flex; justify-content: space-between; width: 100%; max-width: 800px; margin-bottom: 20px; }
        a { color: #5d4037; text-decoration: none; font-size: 16px; font-weight: bold; }
        a:hover { color: #3e2723; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../index.html">← Zurück zur Übersicht</a>
        <button class="upgrade-btn" onclick="saveProgress()" style="padding: 5px 15px; width: auto;">Save</button>
    </div>

    <div class="game-container">
        <div class="left-panel">
            <div class="stats"><span id="cookieCount">0</span> Cookies</div>
            <div class="cps"><span id="cpsCount">0</span> pro Sekunde</div>
            <button class="cookie-btn" id="cookieBtn"></button>
            <div style="margin-top: 30px; font-size: 14px; color: #8d6e63;">Klickkraft: <span id="clickPower">1</span></div>
        </div>

        <div class="right-panel">
            <h3>Upgrades</h3>
            <button class="upgrade-btn" id="upgCursor" onclick="buyUpgrade('cursor')">
                <span>Cursor (+1 Klick)</span> <span class="cost" id="costCursor">15</span>
            </button>
            <button class="upgrade-btn" id="upgGrandma" onclick="buyUpgrade('grandma')">
                <span>Oma (+1 CPS)</span> <span class="cost" id="costGrandma">100</span>
            </button>
            <button class="upgrade-btn" id="upgFarm" onclick="buyUpgrade('farm')">
                <span>Farm (+8 CPS)</span> <span class="cost" id="costFarm">1100</span>
            </button>
            <button class="upgrade-btn" id="upgMine" onclick="buyUpgrade('mine')">
                <span>Mine (+47 CPS)</span> <span class="cost" id="costMine">12000</span>
            </button>
            <button class="upgrade-btn" id="upgFactory" onclick="buyUpgrade('factory')">
                <span>Fabrik (+260 CPS)</span> <span class="cost" id="costFactory">130000</span>
            </button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        let cookies = 0;
        let cps = 0;
        let clickPower = 1;

        const upgrades = {
            cursor: { cost: 15, power: 1, count: 0, type: 'click', baseCost: 15 },
            grandma: { cost: 100, power: 1, count: 0, type: 'cps', baseCost: 100 },
            farm: { cost: 1100, power: 8, count: 0, type: 'cps', baseCost: 1100 },
            mine: { cost: 12000, power: 47, count: 0, type: 'cps', baseCost: 12000 },
            factory: { cost: 130000, power: 260, count: 0, type: 'cps', baseCost: 130000 }
        };

        const cookieCountEl = document.getElementById('cookieCount');
        const cpsCountEl = document.getElementById('cpsCount');
        const clickPowerEl = document.getElementById('clickPower');
        const cookieBtn = document.getElementById('cookieBtn');

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return Math.floor(num);
        }

        function updateDisplay() {
            cookieCountEl.textContent = formatNumber(cookies);
            cpsCountEl.textContent = formatNumber(cps);
            clickPowerEl.textContent = formatNumber(clickPower);

            for (const [key, upg] of Object.entries(upgrades)) {
                const btn = document.getElementById(`upg${key.charAt(0).toUpperCase() + key.slice(1)}`);
                const costEl = document.getElementById(`cost${key.charAt(0).toUpperCase() + key.slice(1)}`);
                costEl.textContent = formatNumber(upg.cost);
                btn.disabled = cookies < upg.cost;
            }
        }

        cookieBtn.addEventListener('click', () => {
            cookies += clickPower;
            updateDisplay();
        });

        function buyUpgrade(id) {
            const upg = upgrades[id];
            if (cookies >= upg.cost) {
                cookies -= upg.cost;
                upg.count++;
                upg.cost = Math.ceil(upg.baseCost * Math.pow(1.15, upg.count));

                if (upg.type === 'click') {
                    clickPower += upg.power;
                } else {
                    cps += upg.power;
                }
                updateDisplay();
            }
        }

        setInterval(() => {
            if (cps > 0) {
                cookies += cps / 10; // Run 10 times a second for smoother updates
                updateDisplay();
            }
        }, 100);

        setInterval(() => {
            if (window.userSystem && cps > 0) {
                window.userSystem.addXP(Math.floor(cps / 10) || 1);
            }
        }, 60000); // 1 min

        // Load/Save
        function saveProgress() {
            const data = { cookies, cps, clickPower, upgrades };
            localStorage.setItem('cookieClicker2Save', JSON.stringify(data));
            if (window.userSystem) window.userSystem.addCoins(10);
            alert('Gespeichert! +10 Coins');
        }

        function loadProgress() {
            const save = localStorage.getItem('cookieClicker2Save');
            if (save) {
                const data = JSON.parse(save);
                cookies = data.cookies;
                cps = data.cps;
                clickPower = data.clickPower;
                for(let key in data.upgrades) {
                    if(upgrades[key]) {
                        upgrades[key].count = data.upgrades[key].count;
                        upgrades[key].cost = data.upgrades[key].cost;
                    }
                }
            }
            updateDisplay();
        }

        loadProgress();
    </script>
</body>
</html>
