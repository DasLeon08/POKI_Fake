<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Würfeln - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .dice-container { display: flex; gap: 40px; margin: 40px 0; }
        .die { font-size: 8rem; color: #ecf0f1; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); transition: transform 0.5s; cursor: pointer; user-select: none; }
        .die.rolling { transform: rotate(720deg) scale(1.2); }
        .result { font-size: 2rem; font-weight: bold; margin-bottom: 20px; }
        button { padding: 15px 30px; font-size: 1.5rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        button:active { transform: translateY(2px); }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Würfeln - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <h1>Würfeln</h1>

    <div class="dice-container">
        <div class="die" id="die1">⚀</div>
        <div class="die" id="die2">⚀</div>
    </div>

    <div class="result" id="resultText">Drücke den Button</div>
    <button onclick="rollDice()">Würfeln!</button>

    <script>
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        const die1El = document.getElementById('die1');
        const die2El = document.getElementById('die2');
        const resultText = document.getElementById('resultText');
        let isRolling = false;

        function rollDice() {
            if (isRolling) return;
            isRolling = true;

            die1El.classList.add('rolling');
            die2El.classList.add('rolling');
            resultText.textContent = 'Würfelt...';

            setTimeout(() => {
                const num1 = Math.floor(Math.random() * 6);
                const num2 = Math.floor(Math.random() * 6);

                die1El.textContent = diceFaces[num1];
                die2El.textContent = diceFaces[num2];

                die1El.classList.remove('rolling');
                die2El.classList.remove('rolling');

                const total = num1 + 1 + num2 + 1;
                resultText.textContent = `Ergebnis: ${total}`;

                if (num1 === num2) {
                    resultText.textContent += ' (Pasch!)';
                }

                isRolling = false;
            }, 500);
        }
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'dice';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
