<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #f1f1f1; color: #333; font-family: 'Comic Sans MS', cursive, sans-serif; }
        canvas { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="100%" height="100%" fill="%23f9f9f9"/><path d="M0 20 L400 20 M0 40 L400 40 M0 60 L400 60 M0 80 L400 80 M0 100 L400 100 M0 120 L400 120 M0 140 L400 140 M0 160 L400 160 M0 180 L400 180 M0 200 L400 200 M0 220 L400 220 M0 240 L400 240 M0 260 L400 260 M0 280 L400 280 M0 300 L400 300 M0 320 L400 320 M0 340 L400 340 M0 360 L400 360 M0 380 L400 380 M0 400 L400 400 M0 420 L400 420 M0 440 L400 440 M0 460 L400 460 M0 480 L400 480 M0 500 L400 500 M0 520 L400 520 M0 540 L400 540 M0 560 L400 560 M0 580 L400 580" stroke="%23e1e1e1" stroke-width="1"/></svg>'); background-size: cover; border: 4px solid #333; border-radius: 10px; max-width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; width: 400px; margin-bottom: 20px; align-items: center; }
        .btn { background: #8bc34a; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #7cb342; }
        a { color: #555; text-decoration: none; font-size: 16px; font-weight: bold; }
        a:hover { color: #8bc34a; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); padding: 30px; border-radius: 10px; text-align: center; border: 4px solid #8bc34a; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 10; width: 200px; }
        #scoreDisplay { font-size: 24px; font-weight: bold; color: #d32f2f; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../index.html">← Zurück zur Übersicht</a>
        <div id="scoreDisplay">0</div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOver">
            <h2 style="color: #d32f2f; margin-top: 0;">Game Over!</h2>
            <p id="finalScore" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">0</p>
            <button class="btn" onclick="initGame()">Nochmal</button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreText = document.getElementById('finalScore');

        let doodler, platforms, score, isGameOver, loop, keys;
        const platformWidth = 60;
        const platformHeight = 15;
        const gravity = 0.3;

        function initGame() {
            doodler = { x: 200, y: 500, vx: 0, vy: -10, radius: 15, color: '#ffeb3b' };
            platforms = [];
            score = 0;
            isGameOver = false;
            keys = { left: false, right: false };

            // Initial platforms
            platforms.push({ x: 200, y: 580, type: 'normal' }); // Base
            for (let i = 0; i < 7; i++) {
                platforms.push(createPlatform(600 - (i * 85)));
            }

            scoreDisplay.textContent = '0';
            gameOverScreen.style.display = 'none';
            if (loop) cancelAnimationFrame(loop);
            gameLoop();
        }

        function createPlatform(y) {
            let type = 'normal';
            let r = Math.random();
            if (r < 0.2) type = 'moving';
            else if (r < 0.3) type = 'breakable';
            return {
                x: Math.random() * (400 - platformWidth),
                y: y,
                type: type,
                vx: type === 'moving' ? (Math.random() > 0.5 ? 2 : -2) : 0,
                broken: false
            };
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        function update() {
            if (isGameOver) return;

            // Move doodler
            if (keys.left) doodler.x -= 5;
            if (keys.right) doodler.x += 5;

            // Screen wrap
            if (doodler.x < -doodler.radius) doodler.x = 400 + doodler.radius;
            if (doodler.x > 400 + doodler.radius) doodler.x = -doodler.radius;

            doodler.vy += gravity;
            doodler.y += doodler.vy;

            // Camera follow / Score
            if (doodler.y < 300) {
                let diff = 300 - doodler.y;
                doodler.y = 300;
                score += Math.floor(diff);
                scoreDisplay.textContent = score;

                platforms.forEach(p => {
                    p.y += diff;
                    if (p.y > 600) {
                        let newY = Math.min(...platforms.map(pl => pl.y)) - (Math.random() * 50 + 50);
                        Object.assign(p, createPlatform(newY));
                    }
                });
            }

            // Platform collision (only when falling)
            if (doodler.vy > 0) {
                platforms.forEach(p => {
                    if (!p.broken && doodler.x + doodler.radius > p.x && doodler.x - doodler.radius < p.x + platformWidth &&
                        doodler.y + doodler.radius > p.y && doodler.y + doodler.radius < p.y + platformHeight + doodler.vy) {

                        if (p.type === 'breakable') {
                            p.broken = true;
                        } else {
                            doodler.vy = -10; // Jump

                            // Bounce effect
                            ctx.fillStyle = '#ff9800';
                            ctx.beginPath();
                            ctx.arc(doodler.x, doodler.y + doodler.radius, 20, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                });
            }

            // Move platforms
            platforms.forEach(p => {
                if (p.type === 'moving' && !p.broken) {
                    p.x += p.vx;
                    if (p.x < 0 || p.x > 400 - platformWidth) p.vx *= -1;
                }
            });

            // Game over
            if (doodler.y > 600 + doodler.radius) {
                gameOver();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 600);

            // Platforms
            platforms.forEach(p => {
                if (p.broken) return;

                ctx.fillStyle = p.type === 'normal' ? '#8bc34a' : (p.type === 'moving' ? '#2196f3' : '#795548');
                ctx.fillRect(p.x, p.y, platformWidth, platformHeight);
                ctx.strokeStyle = '#555';
                ctx.strokeRect(p.x, p.y, platformWidth, platformHeight);
            });

            // Doodler
            ctx.fillStyle = doodler.color;
            ctx.beginPath();
            ctx.arc(doodler.x, doodler.y, doodler.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Eyes
            ctx.fillStyle = '#333';
            ctx.beginPath();
            let eyeDir = keys.left ? -5 : (keys.right ? 5 : 0);
            ctx.arc(doodler.x - 5 + eyeDir, doodler.y - 5, 3, 0, Math.PI * 2);
            ctx.arc(doodler.x + 5 + eyeDir, doodler.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();

            // Snout
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.arc(doodler.x + eyeDir * 1.5, doodler.y + 5, 8, 0, Math.PI, false);
            ctx.fill();
        }

        function gameLoop() {
            if (!isGameOver) {
                update();
                draw();
                loop = requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            isGameOver = true;
            gameOverScreen.style.display = 'block';
            finalScoreText.textContent = `Punkte: ${score}`;

            if (window.userSystem) {
                window.userSystem.addXP(Math.floor(score / 50));
                window.userSystem.addCoins(Math.floor(score / 200));
            }
        }

        initGame();
    </script>
</body>
</html>
