<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Schatzsuche</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #ffb199; padding-top: 50px; }
        #map { width: 400px; height: 400px; background: #d2b48c; margin: 0 auto; position: relative; border: 5px solid #8b4513; cursor: crosshair; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Schatzsuche</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Schatzsuche</h1>
    <p>Klicke auf die Karte, um den Schatz zu finden! Warm oder kalt?</p>
    <p id="msg">Viel Glück!</p>
    <div id="map"></div>
    <br>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        const map = document.getElementById('map'), msg = document.getElementById('msg');
        let tx = Math.random()*400, ty = Math.random()*400, clicks = 0;
        map.addEventListener('click', e => {
            clicks++;
            let rect = map.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
            let dist = Math.sqrt(Math.pow(tx-x,2) + Math.pow(ty-y,2));
            if(dist < 20) { msg.textContent = 'Gefunden in ' + clicks + ' Klicks!'; tx=Math.random()*400; ty=Math.random()*400; clicks=0; }
            else if(dist < 50) msg.textContent = 'Sehr heiß!';
            else if(dist < 100) msg.textContent = 'Warm.';
            else if(dist < 200) msg.textContent = 'Kalt.';
            else msg.textContent = 'Eiskalt!';
        });
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'find-treasure';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
