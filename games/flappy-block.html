<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Flappy Block - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        canvas { background: #87ceeb; border: 2px solid #ecf0f1; margin-top: 20px; }
        #score { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">Zurück zum Portal</a>
    <h1>Flappy Block</h1>
    <div id="score">Punkte: 0</div>
    <canvas id="flappyCanvas" width="400" height="500"></canvas>

    <script>
        const canvas = document.getElementById("flappyCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let frames = 0;
        let score = 0;
        let gameOver = false;

        const block = {
            x: 50,
            y: 150,
            w: 30,
            h: 30,
            velocity: 0,
            gravity: 0.25,
            jump: -4.5,
            draw: function() {
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(this.x, this.y, this.w, this.h);
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                if(this.y + this.h >= canvas.height) {
                    this.y = canvas.height - this.h;
                    gameOver = true;
                }
                if(this.y < 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            flap: function() {
                this.velocity = this.jump;
            }
        };

        const pipes = {
            position: [],
            w: 50,
            gap: 120,
            dx: 2,
            draw: function() {
                for(let i = 0; i < this.position.length; i++){
                    let p = this.position[i];
                    let topY = p.y;
                    let bottomY = p.y + this.gap;
                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(p.x, 0, this.w, topY);
                    ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY);
                }
            },
            update: function() {
                if(frames % 100 == 0){
                    this.position.push({
                        x: canvas.width,
                        y: Math.random() * (canvas.height - this.gap - 100) + 50
                    });
                }
                for(let i = 0; i < this.position.length; i++){
                    let p = this.position[i];
                    p.x -= this.dx;

                    // Collision detection
                    if(block.x + block.w > p.x && block.x < p.x + this.w &&
                      (block.y < p.y || block.y + block.h > p.y + this.gap)){
                        gameOver = true;
                    }

                    if(p.x + this.w < 0){
                        this.position.shift();
                        score++;
                        scoreElement.innerHTML = "Punkte: " + score;
                        i--;
                    }
                }
            },
            reset: function() {
                this.position = [];
            }
        };

        function draw() {
            ctx.fillStyle = "#87ceeb";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            block.draw();
            pipes.draw();
        }

        function update() {
            block.update();
            pipes.update();
        }

        function loop() {
            if(!gameOver) {
                update();
                draw();
                frames++;
                requestAnimationFrame(loop);
            } else {
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "30px sans-serif";
                ctx.fillText("Game Over", 120, 200);
                ctx.font = "20px sans-serif";
                ctx.fillText("Klick zum Neustart", 120, 240);
            }
        }

        document.addEventListener("keydown", function(e){
            if(e.keyCode == 32 || e.keyCode == 38){ // Space or Up arrow
                if(gameOver) {
                    gameOver = false;
                    block.y = 150;
                    block.velocity = 0;
                    pipes.reset();
                    score = 0;
                    scoreElement.innerHTML = "Punkte: 0";
                    frames = 0;
                    loop();
                } else {
                    block.flap();
                }
            }
        });

        document.addEventListener("mousedown", function(e){
            if(gameOver) {
                gameOver = false;
                block.y = 150;
                block.velocity = 0;
                pipes.reset();
                score = 0;
                scoreElement.innerHTML = "Punkte: 0";
                frames = 0;
                loop();
            } else {
                block.flap();
            }
        });

        loop();
    </script>
</body>
</html>
