<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Sim 2D - Poki Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            padding: 10px 20px;
            background-color: #34495e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 2px solid #87CEEB;
        }
        .back-btn {
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
        }
        .back-btn:hover { background-color: #2980b9; }
        #game-container {
            position: relative;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hidden { display: none !important; }
        .screen {
            background-color: rgba(44, 62, 80, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            border: 2px solid #3498db;
        }
        h1 { margin-top: 0; color: #f1c40f; }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover { background-color: #27ae60; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .hud-panel {
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #34495e;
        }
        .controls-info {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <header>
        <h2>Flight Sim 2D</h2>
        <a href="../index.html" class="back-btn">Zurück zur Übersicht</a>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="hud" class="hidden">
            <div class="hud-panel" id="altitudeDisplay">ALT: 0 ft</div>
            <div class="hud-panel" id="speedDisplay">SPD: 0 kts</div>
            <div class="hud-panel" id="pitchDisplay">PTCH: 0°</div>
        </div>
        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <h1>Flight Sim 2D</h1>
                <p>Take off, fly through the rings, and land safely!</p>
                <div class="controls-info">
                    UP / DOWN : Pitch (Nose Up/Down)<br>
                    W / S : Throttle (Increase/Decrease Speed)<br>
                    G : Landing Gear Toggle
                </div>
                <button id="start-btn">Start Flight</button>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <h1 id="end-title">Crash!</h1>
                <p id="end-message">You hit the ground too hard.</p>
                <button id="restart-btn">Try Again</button>
            </div>
        </div>
    </div>

    <script src="../js/progress.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');

        const altDisplay = document.getElementById('altitudeDisplay');
        const spdDisplay = document.getElementById('speedDisplay');
        const pitchDisplay = document.getElementById('pitchDisplay');
        const endTitle = document.getElementById('end-title');
        const endMessage = document.getElementById('end-message');

        let gameState = 'start';
        let lastTime = 0;

        let worldX = 0; // camera scroll
        let score = 0;

        // Input
        const keys = { ArrowUp: false, ArrowDown: false, w: false, s: false, g: false };
        let gearToggled = false;

        window.addEventListener('keydown', e => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if(e.key.toLowerCase() === 'g' && !gearToggled) {
                plane.gearDown = !plane.gearDown;
                gearToggled = true;
            }
        });
        window.addEventListener('keyup', e => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if(e.key.toLowerCase() === 'g') gearToggled = false;
        });

        const plane = {
            x: 150, // Screen X is fixed, world scrolls
            y: 350,
            width: 40, height: 15,
            pitch: 0, // radians
            speed: 0, // horizontal
            vSpeed: 0, // vertical
            throttle: 0, // 0 to 100
            gearDown: true,
            crashed: false
        };

        const runway = { x: 50, w: 1000 };
        const landingRunway = { x: 5000, w: 1000 };
        let rings = [];
        let groundHeight = 30; // height from bottom

        function initLevel() {
            plane.y = canvas.height - groundHeight - 10;
            plane.pitch = 0;
            plane.speed = 0;
            plane.vSpeed = 0;
            plane.throttle = 0;
            plane.gearDown = true;
            plane.crashed = false;
            worldX = 0;
            score = 0;

            rings = [];
            for(let i=0; i<5; i++) {
                rings.push({
                    x: 1500 + i * 800,
                    y: canvas.height - 100 - Math.random() * 200,
                    radius: 40,
                    passed: false
                });
            }
        }

        function update(dt) {
            if(gameState !== 'playing') return;

            // Throttle Control
            if(keys.w) plane.throttle += 20 * dt;
            if(keys.s) plane.throttle -= 20 * dt;
            plane.throttle = Math.max(0, Math.min(100, plane.throttle));

            // Pitch Control (inverted like real plane: pull up = down arrow)
            let pitchSpeed = 1.5 * dt;
            if(plane.speed > 20) { // Need speed to pitch effectively
                if(keys.ArrowDown) plane.pitch -= pitchSpeed; // Nose up
                if(keys.ArrowUp) plane.pitch += pitchSpeed; // Nose down
            }
            // Clamp pitch (-45 to +45 deg approx)
            plane.pitch = Math.max(-Math.PI/4, Math.min(Math.PI/4, plane.pitch));

            // Aerodynamics (Simplified)
            // Thrust
            let thrust = plane.throttle * 0.5 * dt;

            // Drag (increases with speed and gear down)
            let drag = plane.speed * 0.005 + (plane.gearDown ? 0.05 : 0.01);

            // Lift (increases with speed and slight nose up)
            let lift = (plane.speed * 0.05) * Math.max(0.5, -plane.pitch * 2);

            // Gravity
            let gravity = 10 * dt;

            // Horizontal Speed
            plane.speed += thrust - drag;
            if(plane.speed < 0) plane.speed = 0;

            // Vertical Speed (Lift vs Gravity)
            // Only lift off if speed > 50 and nose up
            if(plane.y < canvas.height - groundHeight - 10 || (plane.speed > 50 && plane.pitch < -0.1)) {
                plane.vSpeed += gravity - lift;
            } else {
                plane.vSpeed = 0;
                plane.pitch = 0; // level out on ground
            }

            // Apply Velocity
            plane.y += plane.vSpeed;
            worldX += plane.speed * dt; // Scroll world instead of plane X

            // Ground Collision
            let onRunway = (worldX + plane.x > runway.x && worldX + plane.x < runway.x + runway.w) ||
                           (worldX + plane.x > landingRunway.x && worldX + plane.x < landingRunway.x + landingRunway.w);

            if(plane.y >= canvas.height - groundHeight - 10) {
                plane.y = canvas.height - groundHeight - 10;
                plane.vSpeed = 0;

                // Crash checks
                if(plane.vSpeed > 5 || plane.speed > 150 || plane.pitch > 0.2 || plane.pitch < -0.3 || !plane.gearDown || !onRunway) {
                    endGame(false, "CRASH! " + (!plane.gearDown ? "Gear was UP!" : !onRunway ? "Landed off runway!" : "Too hard/fast!"));
                    return;
                }

                // Successful landing stop
                if(worldX > 4000 && plane.speed < 5) { // Rough check for landing area
                    endGame(true, "Landed safely! Rings collected: " + score);
                    return;
                }
            }

            // Sky ceiling
            if(plane.y < 20) plane.y = 20;

            // Rings Collision
            rings.forEach(r => {
                if(!r.passed) {
                    let rx = r.x - worldX; // relative x
                    if(Math.abs(plane.x - rx) < plane.width/2 && Math.abs(plane.y - r.y) < r.radius) {
                        r.passed = true;
                        score++;
                    }
                }
            });

            updateHUD();
        }

        function draw() {
            // Sky
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#3498db');
            grad.addColorStop(1, '#87CEEB');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // World Elements (translated by worldX)
            ctx.save();
            ctx.translate(-worldX % 800, 0); // Modulo for infinite background illusion

            // Clouds
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath(); ctx.arc(100, 100, 30, 0, Math.PI*2); ctx.arc(130, 90, 40, 0, Math.PI*2); ctx.arc(160, 100, 30, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(500, 150, 40, 0, Math.PI*2); ctx.arc(550, 140, 50, 0, Math.PI*2); ctx.arc(600, 150, 40, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(-worldX, 0); // Actual world translation for ground objects

            // Ground
            ctx.fillStyle = '#27ae60'; // Grass
            ctx.fillRect(0, canvas.height - groundHeight, 10000, groundHeight);

            // Runways
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(runway.x, canvas.height - groundHeight, runway.w, groundHeight);
            ctx.fillRect(landingRunway.x, canvas.height - groundHeight, landingRunway.w, groundHeight);

            // Runway markers
            ctx.fillStyle = 'white';
            for(let i=0; i<10; i++) {
                ctx.fillRect(runway.x + 100 + i*80, canvas.height - groundHeight + 10, 40, 5);
                ctx.fillRect(landingRunway.x + 100 + i*80, canvas.height - groundHeight + 10, 40, 5);
            }

            // Rings
            rings.forEach(r => {
                ctx.strokeStyle = r.passed ? 'rgba(46, 204, 113, 0.5)' : '#f1c40f';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.ellipse(r.x, r.y, 10, r.radius, 0, 0, Math.PI*2);
                ctx.stroke();
            });

            ctx.restore(); // End world translation

            // Draw Plane (Fixed X on screen, rotates with pitch)
            ctx.save();
            ctx.translate(plane.x, plane.y);
            ctx.rotate(plane.pitch);

            // Fuselage
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            ctx.moveTo(-20, 0);
            ctx.lineTo(15, -5);
            ctx.lineTo(20, 0);
            ctx.lineTo(15, 5);
            ctx.lineTo(-20, 5);
            ctx.fill();

            // Wing
            ctx.fillStyle = '#bdc3c7';
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(5, -15);
            ctx.lineTo(10, 0);
            ctx.fill();

            // Tail
            ctx.beginPath();
            ctx.moveTo(-20, 0);
            ctx.lineTo(-25, -12);
            ctx.lineTo(-15, 0);
            ctx.fill();

            // Landing Gear
            if(plane.gearDown) {
                ctx.strokeStyle = '#34495e';
                ctx.lineWidth = 2;
                // Front
                ctx.beginPath(); ctx.moveTo(10, 5); ctx.lineTo(10, 15); ctx.stroke();
                ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(10, 15, 3, 0, Math.PI*2); ctx.fill();
                // Back
                ctx.beginPath(); ctx.moveTo(-10, 5); ctx.lineTo(-10, 15); ctx.stroke();
                ctx.beginPath(); ctx.arc(-10, 15, 3, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();
        }

        function updateHUD() {
            let alt = Math.max(0, Math.floor((canvas.height - groundHeight - 10 - plane.y) * 10)); // pseudo feet
            altDisplay.innerText = `ALT: ${alt} ft`;
            spdDisplay.innerText = `SPD: ${Math.floor(plane.speed * 2)} kts`;

            let pDeg = Math.floor(-plane.pitch * (180/Math.PI));
            pitchDisplay.innerText = `PTCH: ${pDeg}°`;

            if(plane.speed < 40 && alt > 10) spdDisplay.style.color = 'red'; // stall warning
            else spdDisplay.style.color = '#2c3e50';
        }

        function startGame() {
            initLevel();
            gameState = 'playing';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame(won, message) {
            gameState = 'gameover';
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            endTitle.innerText = won ? "Landed Successfully!" : "Crash!";
            endTitle.style.color = won ? "#2ecc71" : "#e74c3c";
            endMessage.innerText = message;

            if (won && window.ProgressSystem) {
                window.ProgressSystem.addXP(50 + score * 10);
                window.ProgressSystem.addCoins(20 + score * 5);
            }
        }

        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if(dt < 0.1) update(dt);
            draw();

            if(gameState === 'playing') requestAnimationFrame(gameLoop);
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        initLevel();
        draw();
    </script>
</body>
</html>
