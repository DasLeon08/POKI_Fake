<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zahlenraten - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .game-container { background: #34495e; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; margin-top: 20px; width: 400px; }
        h1 { margin-bottom: 10px; }
        p { font-size: 1.2rem; margin-bottom: 20px; }
        .input-area { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        input[type="number"] { font-size: 2rem; width: 100px; text-align: center; border-radius: 5px; border: none; outline: none; padding: 5px; }
        button { padding: 10px 20px; font-size: 1.5rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; }
        button:hover { background: #2980b9; }
        .message { font-size: 1.5rem; height: 30px; margin-top: 20px; font-weight: bold; }
        .attempts { margin-top: 20px; font-size: 1.2rem; color: #bdc3c7; }
        .past-guesses { margin-top: 15px; font-size: 1rem; color: #95a5a6; min-height: 50px; }
    </style>
</head>
<body>


    <div class="game-container">

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Zahlenraten - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

        <h1>Zahlenraten</h1>
        <p>Ich denke an eine Zahl zwischen 1 und 100.</p>

        <div class="input-area">
            <input type="number" id="guessField" min="1" max="100" autofocus>
            <button id="guessSubmit" onclick="checkGuess()">Raten</button>
        </div>

        <div class="message" id="message"></div>
        <div class="attempts" id="attemptsText">Versuche: 0</div>
        <div class="past-guesses" id="pastGuesses"></div>

        <button id="resetButton" style="display: none; margin-top: 20px; width: 100%;" onclick="resetGame()">Neues Spiel</button>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let guessCount = 0;
        let previousGuesses = [];

        const guessField = document.getElementById('guessField');
        const guessSubmit = document.getElementById('guessSubmit');
        const message = document.getElementById('message');
        const attemptsText = document.getElementById('attemptsText');
        const pastGuesses = document.getElementById('pastGuesses');
        const resetButton = document.getElementById('resetButton');

        function checkGuess() {
            let userGuess = Number(guessField.value);

            if (userGuess < 1 || userGuess > 100 || isNaN(userGuess)) {
                message.textContent = 'Bitte eine Zahl von 1-100 eingeben!';
                message.style.color = '#e74c3c';
                return;
            }

            guessCount++;
            attemptsText.textContent = `Versuche: ${guessCount}`;
            previousGuesses.push(userGuess);
            pastGuesses.textContent = `Bisher geraten: ${previousGuesses.join(', ')}`;

            if (userGuess === randomNumber) {
                message.textContent = `Glückwunsch! ${randomNumber} ist richtig!`;
                message.style.color = '#2ecc71';
                setGameOver();
            } else if (guessCount === 10) {
                message.textContent = `Game Over! Die Zahl war ${randomNumber}.`;
                message.style.color = '#e74c3c';
                setGameOver();
            } else {
                message.textContent = 'Falsch!';
                message.style.color = '#e74c3c';
                if(userGuess < randomNumber) {
                    message.textContent += ' Die Zahl ist größer!';
                } else if(userGuess > randomNumber) {
                    message.textContent += ' Die Zahl ist kleiner!';
                }
            }

            guessField.value = '';
            guessField.focus();
        }

        function setGameOver() {
            guessField.disabled = true;
            guessSubmit.disabled = true;
            resetButton.style.display = 'block';
        }

        function resetGame() {
            guessCount = 0;
            previousGuesses = [];

            attemptsText.textContent = 'Versuche: 0';
            pastGuesses.textContent = '';
            message.textContent = '';

            resetButton.style.display = 'none';
            guessField.disabled = false;
            guessSubmit.disabled = false;
            guessField.value = '';
            guessField.focus();

            randomNumber = Math.floor(Math.random() * 100) + 1;
        }

        guessField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'guess-number';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
