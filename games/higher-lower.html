<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Höher oder Tiefer - Jules Spiele</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #27ae60, #f1c40f); font-family: 'Nunito', sans-serif; color: white; }
        .game-container { background: rgba(0,0,0,0.6); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .number { font-size: 80px; font-weight: bold; margin: 20px 0; }
        .buttons button { margin: 10px; padding: 15px 30px; font-size: 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        .buttons button:hover { transform: scale(1.05); }
        .btn-higher { background-color: #2ecc71; color: white; }
        .btn-lower { background-color: #e74c3c; color: white; }
        .btn-back { margin-top: 30px; display: inline-block; padding: 10px 20px; background-color: #34495e; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .score { font-size: 24px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="game-container">

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Höher oder Tiefer - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

        <div class="score">Streak: <span id="score">0</span></div>
        <p>Ist die nächste Zahl (1-100) höher oder tiefer?</p>
        <div class="number" id="currentNumber">50</div>
        <div class="buttons">
            <button class="btn-higher" onclick="guess('higher')">Höher ⬆️</button>
            <button class="btn-lower" onclick="guess('lower')">Tiefer ⬇️</button>
        </div>
        <a href="../index.html" class="btn-back">Zurück zum Portal</a>
    </div>

    <script>
        const numberEl = document.getElementById('currentNumber');
        const scoreEl = document.getElementById('score');

        let currentNum = 50;
        let score = 0;

        function getRandom() {
            return Math.floor(Math.random() * 100) + 1;
        }

        function guess(direction) {
            let nextNum = getRandom();
            while(nextNum === currentNum) nextNum = getRandom(); // ensure different number

            if ((direction === 'higher' && nextNum > currentNum) || (direction === 'lower' && nextNum < currentNum)) {
                score++;
                scoreEl.innerText = score;
                currentNum = nextNum;
                numberEl.innerText = currentNum;
                document.body.style.backgroundColor = '#2ecc71';
                setTimeout(() => document.body.style.background = 'linear-gradient(135deg, #27ae60, #f1c40f)', 300);
            } else {
                alert(`Falsch! Die Zahl war ${nextNum}. Dein Streak: ${score}`);
                score = 0;
                scoreEl.innerText = score;
                currentNum = getRandom();
                numberEl.innerText = currentNum;
            }
        }
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'higher-lower';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
