<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Miner - Jules Spiele</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .back-btn { align-self: flex-start; text-decoration: none; color: white; background: #34495e; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        .back-btn:hover { background: #2c3e50; border: 1px solid white; }
        h1 { margin-top: 0; color: #f1c40f; }
        .stats { display: flex; gap: 20px; background: #34495e; padding: 15px 30px; border-radius: 10px; margin-bottom: 20px; font-size: 1.2rem; }
        .gold-display { color: #f1c40f; font-weight: bold; }
        .mps-display { color: #2ecc71; }
        .mine-area { background: #7f8c8d; width: 300px; height: 300px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 100px; cursor: pointer; user-select: none; transition: transform 0.1s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 5px solid #95a5a6; position: relative; overflow: hidden; }
        .mine-area:active { transform: scale(0.95); }
        .mine-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 20%; background: #3e2723; z-index: 0; }
        .rock { position: relative; z-index: 1; }
        .click-text { position: absolute; color: #f1c40f; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 1s ease-out forwards; z-index: 2; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        .upgrades { margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; width: 100%; max-width: 800px; }
        .upgrade-card { background: #34495e; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #3498db; }
        .upgrade-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .upgrade-info p { margin: 0; color: #bdc3c7; font-size: 0.9rem; }
        .buy-btn { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .buy-btn:hover { background: #2ecc71; }
        .buy-btn:disabled { background: #7f8c8d; cursor: not-allowed; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Zurück zur Übersicht</a>

    <h1>⛏️ Idle Miner</h1>

    <div class="stats">
        <div class="gold-display">💰 Gold: <span id="gold">0</span></div>
        <div class="mps-display">⛏️ Gold/Sek: <span id="gps">0</span></div>
        <div class="mps-display">👆 Klick-Stärke: <span id="clickPower">1</span></div>
    </div>

    <div class="mine-area" id="mine" onclick="mineGold(event)">
        <div class="mine-bg"></div>
        <div class="rock">🪨</div>
    </div>

    <div class="upgrades" id="upgrades-container">
        <!-- Upgrades will be generated here -->
    </div>

    <script>
        let gold = 0;
        let gps = 0; // Gold per second
        let clickPower = 1;

        const upgrades = [
            { id: 'pickaxe', name: 'Bessere Spitzhacke', desc: '+1 Klick-Stärke', cost: 15, type: 'click', value: 1, count: 0, costMult: 1.5, icon: '⛏️' },
            { id: 'miner', name: 'Zwergen-Minenarbeiter', desc: '+1 Gold/Sek', cost: 50, type: 'idle', value: 1, count: 0, costMult: 1.15, icon: '🧔' },
            { id: 'drill', name: 'Bohrmaschine', desc: '+5 Gold/Sek', cost: 250, type: 'idle', value: 5, count: 0, costMult: 1.15, icon: '🛠️' },
            { id: 'dynamite', name: 'Dynamit', desc: '+15 Gold/Sek', cost: 1000, type: 'idle', value: 15, count: 0, costMult: 1.15, icon: '🧨' },
            { id: 'excavator', name: 'Riesiger Bagger', desc: '+50 Gold/Sek', cost: 5000, type: 'idle', value: 50, count: 0, costMult: 1.15, icon: '🚜' }
        ];

        const goldEl = document.getElementById('gold');
        const gpsEl = document.getElementById('gps');
        const clickPowerEl = document.getElementById('clickPower');
        const upgradesContainer = document.getElementById('upgrades-container');

        function updateDisplay() {
            goldEl.innerText = Math.floor(gold);
            gpsEl.innerText = gps.toFixed(1);
            clickPowerEl.innerText = clickPower;

            // Update button states
            upgrades.forEach((upg, index) => {
                const btn = document.getElementById(`buy-${index}`);
                if (btn) {
                    btn.disabled = gold < upg.cost;
                    btn.innerText = `${Math.floor(upg.cost)} G`;
                }
            });
        }

        function mineGold(event) {
            gold += clickPower;
            createClickEffect(event, clickPower);
            updateDisplay();
        }

        function createClickEffect(e, amount) {
            const el = document.createElement('div');
            el.className = 'click-text';
            el.innerText = `+${amount}`;

            // Position near click but slightly randomized
            const rect = document.getElementById('mine').getBoundingClientRect();
            const x = e.clientX - rect.left + (Math.random() * 20 - 10);
            const y = e.clientY - rect.top + (Math.random() * 20 - 10);

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            document.getElementById('mine').appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function buyUpgrade(index) {
            const upg = upgrades[index];
            if (gold >= upg.cost) {
                gold -= upg.cost;
                upg.count++;

                if (upg.type === 'click') {
                    clickPower += upg.value;
                } else if (upg.type === 'idle') {
                    gps += upg.value;
                }

                upg.cost = upg.cost * upg.costMult;
                renderUpgrades();
                updateDisplay();
            }
        }

        function renderUpgrades() {
            upgradesContainer.innerHTML = '';
            upgrades.forEach((upg, index) => {
                const div = document.createElement('div');
                div.className = 'upgrade-card';
                div.innerHTML = `
                    <div class="upgrade-info">
                        <h3>${upg.icon} ${upg.name} (Lvl ${upg.count})</h3>
                        <p>${upg.desc}</p>
                    </div>
                    <button id="buy-${index}" class="buy-btn" onclick="buyUpgrade(${index})">${Math.floor(upg.cost)} G</button>
                `;
                upgradesContainer.appendChild(div);
            });
        }

        // Game Loop
        setInterval(() => {
            if (gps > 0) {
                gold += gps / 10; // Run 10 times a second for smoother updates
                updateDisplay();
            }
        }, 100);

        // Notify user system
        setInterval(() => {
            if(window.parent && window.parent.userSystem) {
                // Give some passive xp/coins based on progression occasionally
                if (gps > 10 && Math.random() < 0.1) {
                    window.parent.userSystem.addCoins(1);
                }
            }
        }, 10000);

        // Init
        renderUpgrades();
        updateDisplay();

        // Initial user system reward for opening
        if(window.parent && window.parent.userSystem) {
            window.parent.userSystem.addXP(10);
        }
    </script>
</body>
</html>
