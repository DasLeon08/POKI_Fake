<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dino Hürden</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #ffb199; padding-top: 50px; }
        canvas { background: white; border: 2px solid #333; display: block; margin: 0 auto; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Dino Hürden</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Dino Hürden</h1>
    <p>Drücke Leertaste zum Springen!</p>
    <canvas id="gameCanvas" width="600" height="200"></canvas>
    <br>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
        let dino = {x: 50, y: 150, w: 30, h: 30, dy: 0, jump: -10, g: 0.6}, obs = {x: 600, y: 150, w: 20, h: 30, speed: 5}, score = 0, playing = true;

        document.addEventListener('keydown', e => { if(e.code==='Space' && dino.y >= 150 && playing) dino.dy = dino.jump; });

        function loop() {
            if(!playing) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);

            dino.dy += dino.g; dino.y += dino.dy;
            if(dino.y > 150) { dino.y = 150; dino.dy = 0; }

            obs.x -= obs.speed;
            if(obs.x + obs.w < 0) { obs.x = 600; score++; obs.speed += 0.2; }

            if(dino.x < obs.x+obs.w && dino.x+dino.w > obs.x && dino.y < obs.y+obs.h && dino.y+dino.h > obs.y) {
                playing = false; alert('Game Over! Punkte: ' + score); location.reload();
            }

            ctx.fillStyle = 'green'; ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
            ctx.fillStyle = 'red'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = 'black'; ctx.font = '20px Arial'; ctx.fillText('Punkte: ' + score, 10, 30);

            requestAnimationFrame(loop);
        }
        loop();
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'jump-dino';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
