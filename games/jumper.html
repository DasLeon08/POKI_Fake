<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Endlos-Springer - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #f1f2f6; color: #2f3542; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #ff4757; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        #game-container { position: relative; width: 400px; height: 600px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" fill="%23eccc68"/><circle cx="10" cy="10" r="1" fill="%237bed9f"/></svg>'); border: 4px solid #747d8c; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        #score-board { position: absolute; top: 10px; left: 10px; font-size: 24px; font-weight: bold; color: #ff6348; text-shadow: 2px 2px 0px white; z-index: 10; }

        #player { position: absolute; width: 40px; height: 40px; background: #1e90ff; border-radius: 50% 50% 10px 10px; bottom: 50px; left: 180px; z-index: 5; transition: transform 0.1s; }
        #player::after { content: ''; position: absolute; top: 10px; left: 8px; width: 8px; height: 8px; background: white; border-radius: 50%; box-shadow: 16px 0 0 white; }
        #player::before { content: ''; position: absolute; top: 13px; left: 10px; width: 4px; height: 4px; background: black; border-radius: 50%; box-shadow: 16px 0 0 black; }

        .platform { position: absolute; width: 60px; height: 15px; background: #2ed573; border-radius: 10px; border-bottom: 3px solid #1e8449; }
        .spring { position: absolute; width: 20px; height: 10px; background: #ff7f50; top: -10px; left: 20px; border-radius: 5px 5px 0 0; }

        #game-over { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; display: none; z-index: 20; }
        #game-over h2 { font-size: 40px; margin: 0 0 20px 0; color: #ff4757; }
        #game-over button { padding: 10px 30px; font-size: 20px; background: #2ed573; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #game-over button:hover { background: #26ae60; }
        .controls { margin-top: 15px; color: #747d8c; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Endlos-Springer - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>



    <div id="game-container">
        <div id="score-board">0</div>
        <div id="player"></div>
        <div id="platforms-container"></div>

        <div id="game-over">
            <h2>Abgestürzt!</h2>
            <p style="font-size: 24px; margin-bottom: 30px;">Punkte: <span id="final-score">0</span></p>
            <button onclick="startGame()">Nochmal spielen</button>
        </div>
    </div>

    <div class="controls">Pfeiltasten Links/Rechts zum Bewegen</div>

    <script src="../js/user-system.js"></script>
    <script>
        const container = document.getElementById('game-container');
        const playerElement = document.getElementById('player');
        const platformsContainer = document.getElementById('platforms-container');
        const scoreBoard = document.getElementById('score-board');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreSpan = document.getElementById('final-score');

        let isGameOver = false;
        let score = 0;
        let player = {
            x: 180,
            y: 50, // from bottom
            width: 40,
            height: 40,
            vx: 0,
            vy: 0,
            jumpForce: 12,
            gravity: 0.4,
            speed: 5
        };
        let platforms = [];
        let platformCount = 8;
        let keys = { ArrowLeft: false, ArrowRight: false };
        let animationId;

        function startGame() {
            isGameOver = false;
            score = 0;
            player.x = 180;
            player.y = 100; // Start higher up
            player.vx = 0;
            player.vy = player.jumpForce; // Initial jump
            platforms = [];
            platformsContainer.innerHTML = '';
            scoreBoard.innerText = score;
            gameOverScreen.style.display = 'none';

            // Create initial ground platform to ensure safe start
            createPlatform(170, 20);

            // Create remaining random platforms
            for (let i = 1; i < platformCount; i++) {
                let platGap = 600 / platformCount;
                let newPlatBottom = 20 + i * platGap;
                let newPlatLeft = Math.random() * (400 - 60);
                createPlatform(newPlatLeft, newPlatBottom);
            }

            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function createPlatform(left, bottom) {
            let platform = document.createElement('div');
            platform.classList.add('platform');
            platform.style.left = left + 'px';
            platform.style.bottom = bottom + 'px';

            // Randomly add springs to platforms (10% chance)
            let hasSpring = Math.random() < 0.1 && bottom > 100;
            if(hasSpring) {
                let spring = document.createElement('div');
                spring.classList.add('spring');
                platform.appendChild(spring);
                platform.hasSpring = true;
            } else {
                platform.hasSpring = false;
            }

            platformsContainer.appendChild(platform);
            platforms.push({ element: platform, left: left, bottom: bottom, width: 60, height: 15, hasSpring: hasSpring });
        }

        function updatePlayer() {
            // Apply gravity
            player.vy -= player.gravity;

            // Apply horizontal movement
            if (keys.ArrowLeft) player.x -= player.speed;
            if (keys.ArrowRight) player.x += player.speed;

            // Screen wrap
            if (player.x < -player.width) player.x = 400;
            else if (player.x > 400) player.x = -player.width;

            // Move player vertically
            player.y += player.vy;

            // Update visual position
            playerElement.style.left = player.x + 'px';
            playerElement.style.bottom = player.y + 'px';

            // Flip character direction based on movement
            if(keys.ArrowLeft) playerElement.style.transform = 'scaleX(-1)';
            if(keys.ArrowRight) playerElement.style.transform = 'scaleX(1)';

            // Check collision with platforms only when falling
            if (player.vy < 0) {
                platforms.forEach(p => {
                    // Check if player bottom edge crosses platform top edge
                    if (player.y > p.bottom &&
                        player.y + player.vy <= p.bottom + p.height &&
                        player.x + player.width > p.left &&
                        player.x < p.left + p.width) {

                        // Jump!
                        if(p.hasSpring) {
                            player.vy = player.jumpForce * 1.5; // Super jump
                            score += 50;
                        } else {
                            player.vy = player.jumpForce;
                        }
                    }
                });
            }
        }

        function movePlatforms() {
            // Camera follow logic: if player goes above middle of screen, move platforms down
            if (player.y > 300) {
                let diff = player.y - 300;
                player.y = 300; // Keep player visually in center
                score += Math.floor(diff);
                scoreBoard.innerText = score;

                platforms.forEach(p => {
                    p.bottom -= diff;
                    p.element.style.bottom = p.bottom + 'px';

                    // If platform goes below screen, remove and create new one at top
                    if (p.bottom < -20) {
                        p.element.remove();
                        platforms.shift(); // Remove from array

                        let newPlatLeft = Math.random() * (400 - 60);
                        let newPlatBottom = 600 + Math.random() * 50; // Spawn slightly above visible area
                        createPlatform(newPlatLeft, newPlatBottom);
                    }
                });
            }
        }

        function checkGameOver() {
            if (player.y < 0) {
                isGameOver = true;
                gameOverScreen.style.display = 'flex';
                finalScoreSpan.innerText = score;

                if(window.userSystem) {
                    window.userSystem.addXP(Math.floor(score / 10));
                }
            }
        }

        function gameLoop() {
            if (isGameOver) return;

            updatePlayer();
            movePlatforms();
            checkGameOver();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.key === 'ArrowRight') keys.ArrowRight = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.key === 'ArrowRight') keys.ArrowRight = false;
        });

        // Start initial game
        startGame();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'jumper';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
