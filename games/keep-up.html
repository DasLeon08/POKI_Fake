<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Ball Hochhalten</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #7579ff; padding-top: 50px; overflow: hidden; }
        #gameArea { width: 400px; height: 500px; background: #87CEEB; margin: 0 auto; position: relative; border: 2px solid black; }
        #ball { width: 50px; height: 50px; background: radial-gradient(circle, white, gray); border-radius: 50%; position: absolute; cursor: pointer; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Ball Hochhalten</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Ball Hochhalten</h1>
    <p>Klicke den Ball, damit er nicht den Boden berührt!</p>
    <p>Punkte: <span id="score">0</span></p>
    <div id="gameArea"><div id="ball"></div></div>
    <br>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        let score=0, dy=0, g=0.5, y=50, x=175, dx=0, playing=true;
        const ball=document.getElementById('ball'), scoreEl=document.getElementById('score');

        ball.onmousedown = () => { if(playing) { dy = -10; score++; scoreEl.textContent=score; dx=(Math.random()-0.5)*10; } };

        setInterval(() => {
            if(!playing) return;
            dy += g; y += dy; x += dx;
            if(x < 0 || x > 350) dx = -dx;
            if(y > 450) { playing=false; alert('Game Over! Punkte: '+score); y=50; dy=0; score=0; scoreEl.textContent=score; playing=true; }
            ball.style.top = y + 'px'; ball.style.left = x + 'px';
        }, 20);
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'keep-up';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
