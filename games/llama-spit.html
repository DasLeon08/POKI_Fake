<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama Spit Sniper - Poki Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            padding: 10px 20px;
            background-color: #34495e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 2px solid #e74c3c;
        }
        .back-btn {
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
        }
        .back-btn:hover { background-color: #c0392b; }
        #game-container {
            position: relative;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            cursor: crosshair;
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hidden { display: none !important; }
        .screen {
            background-color: rgba(44, 62, 80, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            border: 2px solid #e74c3c;
        }
        h1 { margin-top: 0; color: #f1c40f; }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover { background-color: #27ae60; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Llama Spit Sniper - Poki Clone</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <header>
        <h2>Llama Spit Sniper</h2>

    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud" class="hidden">
            <div id="scoreDisplay">Score: 0</div>
            <div id="timerDisplay">Time: 30</div>
        </div>
        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <h1>Llama Spit Sniper</h1>
                <p>Spit on the annoying tourists before time runs out!</p>
                <p>Click to Shoot.</p>
                <button id="start-btn">Start Spitting</button>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <h1>Game Over!</h1>
                <p>You spitted on <span id="final-score">0</span> tourists.</p>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');

        let gameState = 'start';
        let score = 0;
        let timeLeft = 30;
        let lastTime = 0;

        // Entities
        let tourists = [];
        let spits = [];
        let splats = [];

        // Mouse
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let llamaRecoil = 0;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => {
            if (gameState === 'playing') {
                shootSpit();
            }
        });

        function shootSpit() {
            // Llama is at bottom center
            const startX = canvas.width / 2;
            const startY = canvas.height - 50;

            // Calculate angle
            const dx = mouseX - startX;
            const dy = mouseY - startY;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 0) {
                spits.push({
                    x: startX,
                    y: startY,
                    vx: (dx / dist) * 15,
                    vy: (dy / dist) * 15,
                    targetX: mouseX,
                    targetY: mouseY,
                    progress: 0, // distance traveled vs total distance
                    totalDist: dist
                });
                llamaRecoil = 20; // visual kickback
            }
        }

        function spawnTourist() {
            if (tourists.length < 5) {
                const side = Math.random() > 0.5 ? 1 : -1;
                tourists.push({
                    x: side === 1 ? -50 : canvas.width + 50,
                    y: 300 + Math.random() * 150, // Horizon area
                    vx: side * (1 + Math.random() * 3),
                    radius: 20,
                    wobbleOffset: Math.random() * Math.PI * 2
                });
            }
        }

        function update(dt) {
            if(gameState !== 'playing') return;

            // Timer
            timeLeft -= dt;
            if(timeLeft <= 0) {
                endGame();
                return;
            }
            timerDisplay.innerText = `Time: ${Math.ceil(timeLeft)}`;

            // Spawning
            if(Math.random() < dt * 2) spawnTourist();

            // Llama recoil recovery
            if(llamaRecoil > 0) llamaRecoil -= dt * 100;

            // Update Tourists
            for(let i=tourists.length-1; i>=0; i--) {
                let t = tourists[i];
                t.x += t.vx;

                // Remove if off screen
                if(t.x < -100 || t.x > canvas.width + 100) {
                    tourists.splice(i, 1);
                }
            }

            // Update Spits
            for(let i=spits.length-1; i>=0; i--) {
                let s = spits[i];
                s.x += s.vx;
                s.y += s.vy;

                // Distance check to "hit" the ground/target plane
                const currentDist = Math.sqrt((s.x - canvas.width/2)**2 + (s.y - (canvas.height-50))**2);

                if (currentDist >= s.totalDist) {
                    // Check collision with tourists
                    let hit = false;
                    for(let j=tourists.length-1; j>=0; j--) {
                        let t = tourists[j];
                        // Wobbly Y position
                        let actualTy = t.y + Math.sin(performance.now()/200 + t.wobbleOffset)*10;

                        let distToT = Math.sqrt((s.targetX - t.x)**2 + (s.targetY - actualTy)**2);
                        if (distToT < t.radius * 2) {
                            score++;
                            scoreDisplay.innerText = `Score: ${score}`;
                            tourists.splice(j, 1);

                            // Splat effect
                            splats.push({x: s.targetX, y: s.targetY, time: 2, hit: true});
                            hit = true;
                            break; // one hit per spit
                        }
                    }
                    if(!hit) {
                        splats.push({x: s.targetX, y: s.targetY, time: 1, hit: false});
                    }
                    spits.splice(i, 1);
                }
            }

            // Update Splats
            for(let i=splats.length-1; i>=0; i--) {
                splats[i].time -= dt;
                if(splats[i].time <= 0) splats.splice(i, 1);
            }
        }

        function draw() {
            // Background (Mountains & Grass)
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Mountains
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath();
            ctx.moveTo(0, 400);
            ctx.lineTo(200, 200);
            ctx.lineTo(400, 400);
            ctx.lineTo(600, 150);
            ctx.lineTo(800, 400);
            ctx.lineTo(800, 600);
            ctx.lineTo(0, 600);
            ctx.fill();

            // Ground
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 400, canvas.width, 200);

            if(gameState === 'playing') {
                // Draw Splats (Ground)
                splats.forEach(s => {
                    ctx.fillStyle = s.hit ? 'rgba(231, 76, 60, 0.8)' : 'rgba(149, 165, 166, 0.5)';
                    ctx.globalAlpha = Math.max(0, s.time / 2);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 15, 0, Math.PI*2);
                    ctx.fill();
                    // irregular shape
                    ctx.beginPath();
                    ctx.arc(s.x-5, s.y+5, 10, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s.x+8, s.y-2, 12, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                // Draw Tourists
                tourists.forEach(t => {
                    let actualTy = t.y + Math.sin(performance.now()/200 + t.wobbleOffset)*10;

                    // Body
                    ctx.fillStyle = '#e67e22'; // shirt
                    ctx.fillRect(t.x - 15, actualTy, 30, 40);

                    // Head
                    ctx.fillStyle = '#f1c40f'; // skin
                    ctx.beginPath();
                    ctx.arc(t.x, actualTy - 15, 15, 0, Math.PI*2);
                    ctx.fill();

                    // Camera
                    ctx.fillStyle = '#34495e';
                    ctx.fillRect(t.x - 8, actualTy + 5, 16, 10);
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(t.x, actualTy + 10, 4, 0, Math.PI*2);
                    ctx.fill();
                });

                // Llama (Foreground)
                const lx = canvas.width / 2;
                const ly = canvas.height - 20 + llamaRecoil;

                // Neck
                ctx.fillStyle = '#bdc3c7';
                ctx.fillRect(lx - 20, ly - 80, 40, 100);

                // Head
                ctx.fillRect(lx - 25, ly - 120, 50, 60);

                // Snout
                ctx.fillStyle = '#95a5a6';
                ctx.fillRect(lx - 15, ly - 100, 30, 40);

                // Ears
                ctx.fillStyle = '#bdc3c7';
                ctx.beginPath();
                ctx.moveTo(lx - 20, ly - 120);
                ctx.lineTo(lx - 10, ly - 140);
                ctx.lineTo(lx, ly - 120);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(lx + 20, ly - 120);
                ctx.lineTo(lx + 10, ly - 140);
                ctx.lineTo(lx, ly - 120);
                ctx.fill();

                // Eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(lx - 10, ly - 110, 3, 0, Math.PI*2);
                ctx.arc(lx + 10, ly - 110, 3, 0, Math.PI*2);
                ctx.fill();

                // Spits in flight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                spits.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 5, 0, Math.PI*2);
                    ctx.fill();
                    // Tail
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x - s.vx*2, s.y - s.vy*2);
                    ctx.stroke();
                });

                // Crosshair
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 10, 0, Math.PI*2);
                ctx.moveTo(mouseX - 15, mouseY);
                ctx.lineTo(mouseX + 15, mouseY);
                ctx.moveTo(mouseX, mouseY - 15);
                ctx.lineTo(mouseX, mouseY + 15);
                ctx.stroke();
            }
        }

        function startGame() {
            gameState = 'playing';
            score = 0;
            timeLeft = 30;
            tourists = [];
            spits = [];
            splats = [];

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');

            scoreDisplay.innerText = `Score: 0`;
            timerDisplay.innerText = `Time: 30`;

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'gameover';
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            if (window.userSystem) {
                window.userSystem.addXP(score * 5);
                window.userSystem.addCoins(Math.floor(score / 2));
            }
        }

        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if(dt < 0.1) {
                update(dt);
            }
            draw();

            if(gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        draw();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'llama-spit';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
