<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mathe Sprint</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f093fb; padding-top: 50px; }
        #equation { font-size: 40px; margin: 30px; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Mathe Sprint</h1>
    <p>Stimmt die Gleichung?</p>
    <p>Punkte: <span id="score">0</span> | Zeit: <span id="time">30</span>s</p>
    <div id="equation">2 + 2 = 4</div>
    <button class="btn" onclick="answer(true)">Richtig</button>
    <button class="btn" onclick="answer(false)">Falsch</button>
    <br><br>
    <button class="btn" onclick="start()">Neustart</button>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        let score=0, time=30, isCorrect=true, interval, playing=false;
        function start() { score=0; time=30; playing=true; document.getElementById('score').textContent=score; next(); clearInterval(interval); interval=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0){playing=false;clearInterval(interval);alert('Ende! Punkte: '+score);}},1000); }
        function next() {
            let a = Math.floor(Math.random()*20), b = Math.floor(Math.random()*20);
            isCorrect = Math.random() > 0.5;
            let ans = isCorrect ? a + b : a + b + Math.floor(Math.random()*5+1);
            document.getElementById('equation').textContent = `${a} + ${b} = ${ans}`;
        }
        function answer(guess) {
            if(!playing) return;
            if (guess === isCorrect) { score++; document.getElementById('score').textContent=score; next(); }
            else { time -= 3; if(time<0)time=0; document.getElementById('time').textContent=time; next(); }
        }
        start();
    </script>
</body>
</html>
