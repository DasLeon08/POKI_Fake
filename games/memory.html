<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Memory Match</title>
    <style>
        body { margin: 0; background: #ffeaa7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #2d3436; font-family: 'Comic Sans MS', cursive, sans-serif; overflow: hidden; padding: 20px;}
        h1 { margin: 10px; font-size: 2.5rem; color: #d63031; text-shadow: 2px 2px #fff; }
        .stats { display: flex; gap: 20px; font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; background: white; padding: 10px 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 500px; width: 100%; }
        .card { background-color: #0984e3; height: 100px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 3rem; cursor: pointer; transform: scale(1); transform-style: preserve-3d; transition: transform .5s; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .card:active { transform: scale(0.97); transition: transform .2s; }
        .card.flip { transform: rotateY(180deg); background-color: white; border: 2px solid #0984e3;}
        .front-face, .back-face { width: 100%; height: 100%; position: absolute; border-radius: 10px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
        .front-face { transform: rotateY(180deg); }
        .back-face { background: linear-gradient(135deg, #74b9ff, #0984e3); color: white; font-size: 2rem; }
        button { background: #00b894; border: none; padding: 12px 25px; color: white; font-size: 1.2rem; cursor: pointer; border-radius: 25px; margin-top: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: background 0.3s; }
        button:hover { background: #00cec9; }

        @media (max-width: 500px) {
            .card { height: 80px; font-size: 2rem; }
            .game-board { gap: 5px; }
        }
    </style>
</head>
<body>
    <h1>Memory Match</h1>
    <div class="stats">
        <span>Züge: <span id="moves">0</span></span>
        <span>Paare: <span id="matches">0</span>/8</span>
    </div>

    <div class="game-board" id="gameBoard">
        <!-- Cards generated by JS -->
    </div>

    <button onclick="startGame()">Neues Spiel</button>

    <script>
        const gameBoard = document.getElementById('gameBoard');
        const movesEl = document.getElementById('moves');
        const matchesEl = document.getElementById('matches');

        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        let cardsArray = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matches = 0;

        function startGame() {
            gameBoard.innerHTML = '';
            moves = 0;
            matches = 0;
            movesEl.innerText = moves;
            matchesEl.innerText = matches;
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;

            // Create paired array
            cardsArray = [...emojis, ...emojis];

            // Shuffle
            cardsArray.sort(() => 0.5 - Math.random());

            // Generate DOM
            cardsArray.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="front-face">${emoji}</div>
                    <div class="back-face">?</div>
                `;

                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesEl.innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

            if (isMatch) {
                disableCards();
                matches++;
                matchesEl.innerText = matches;
                if (matches === 8) {
                    setTimeout(() => alert(`Gewonnen in ${moves} Zügen! 🎉`), 500);
                }
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        startGame();
    </script>
</body>
</html>
