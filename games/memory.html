<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Memory - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .memory-game { width: 400px; height: 400px; display: flex; flex-wrap: wrap; perspective: 1000px; margin-top: 20px; }
        .memory-card { width: calc(25% - 10px); height: calc(25% - 10px); margin: 5px; position: relative; transform-style: preserve-3d; transition: transform .5s; cursor: pointer; }
        .memory-card:active { transform: scale(0.97); transition: transform .2s; }
        .memory-card.flip { transform: rotateY(180deg); }
        .front-face, .back-face { width: 100%; height: 100%; padding: 10px; position: absolute; border-radius: 5px; background: #1abc9c; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .front-face { transform: rotateY(180deg); background: #ecf0f1; color: #2c3e50; }
        #score { margin-top: 20px; font-size: 1.5rem; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 1rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">Zurück zum Portal</a>
    <h1>Memory</h1>
    <div id="score">Versuche: 0</div>
    <div class="memory-game" id="memory-game"></div>
    <button onclick="resetGame()">Neues Spiel</button>

    <script>
        const cardsArray = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matches = 0;

        const memoryGame = document.getElementById('memory-game');
        const scoreDisplay = document.getElementById('score');

        function createBoard() {
            cardsArray.sort(() => 0.5 - Math.random());
            memoryGame.innerHTML = '';
            cardsArray.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.framework = item;

                const front = document.createElement('div');
                front.classList.add('front-face');
                front.textContent = item;

                const back = document.createElement('div');
                back.classList.add('back-face');
                back.textContent = '❓';

                card.appendChild(front);
                card.appendChild(back);
                memoryGame.appendChild(card);

                card.addEventListener('click', flipCard);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            moves++;
            scoreDisplay.textContent = `Versuche: ${moves}`;
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;

            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matches++;
            if(matches === cardsArray.length / 2) {
                setTimeout(() => alert(`Gewonnen in ${moves} Versuchen!`), 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');

                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function resetGame() {
            moves = 0;
            matches = 0;
            scoreDisplay.textContent = `Versuche: ${moves}`;
            resetBoard();
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
