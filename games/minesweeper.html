<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Minesweeper - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; user-select: none; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .game-header { display: flex; justify-content: space-between; align-items: center; width: 400px; padding: 10px 20px; background: #34495e; border-radius: 5px 5px 0 0; margin-top: 20px; }
        .mine-count, .timer { font-size: 1.5rem; font-family: monospace; color: #e74c3c; background: #000; padding: 5px 10px; border-radius: 3px; }
        .reset-btn { font-size: 1.5rem; cursor: pointer; background: #bdc3c7; border: 2px solid #7f8c8d; border-radius: 5px; padding: 5px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .reset-btn:active { background: #95a5a6; }
        .grid { display: grid; background: #7f8c8d; padding: 10px; border-radius: 0 0 5px 5px; border: 3px solid #95a5a6; }
        .cell { width: 30px; height: 30px; background: #bdc3c7; border: 2px solid; border-color: #ecf0f1 #7f8c8d #7f8c8d #ecf0f1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: monospace; font-size: 1.2rem; cursor: pointer; }
        .cell:active { border-color: #7f8c8d; background: #95a5a6; }
        .cell.revealed { background: #95a5a6; border: 1px solid #7f8c8d; cursor: default; }
        .cell.mine { background: #e74c3c; border-color: #e74c3c; }
        .cell.flagged::before { content: '🚩'; font-size: 1rem; }
        .cell.question::before { content: '❓'; font-size: 1rem; color: #2c3e50; }
        .n1 { color: #2980b9; } .n2 { color: #27ae60; } .n3 { color: #c0392b; } .n4 { color: #8e44ad; }
        .n5 { color: #d35400; } .n6 { color: #16a085; } .n7 { color: #2c3e50; } .n8 { color: #7f8c8d; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">Zurück zum Portal</a>
    <h1>Minesweeper</h1>

    <div class="game-header">
        <div class="mine-count" id="mineCount">010</div>
        <div class="reset-btn" id="resetBtn" onclick="initGame()">😊</div>
        <div class="timer" id="timer">000</div>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        const ROWS = 10;
        const COLS = 10;
        const MINES = 10;

        let grid = [];
        let flagsLeft = MINES;
        let timeElapsed = 0;
        let timerInterval;
        let isGameOver = false;
        let isFirstClick = true;

        const gridEl = document.getElementById('grid');
        const mineCountEl = document.getElementById('mineCount');
        const timerEl = document.getElementById('timer');
        const resetBtn = document.getElementById('resetBtn');

        gridEl.style.gridTemplateColumns = `repeat(${COLS}, 30px)`;
        gridEl.style.gridTemplateRows = `repeat(${ROWS}, 30px)`;

        function updateMineCount() {
            mineCountEl.textContent = String(flagsLeft).padStart(3, '0');
        }

        function updateTimer() {
            timerEl.textContent = String(timeElapsed).padStart(3, '0');
        }

        function createBoard() {
            gridEl.innerHTML = '';
            grid = [];

            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.r = r;
                    cell.dataset.c = c;

                    cell.addEventListener('mousedown', handleCellClick);
                    cell.addEventListener('contextmenu', e => e.preventDefault());

                    gridEl.appendChild(cell);
                    row.push({
                        element: cell,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    });
                }
                grid.push(row);
            }
        }

        function placeMines(firstR, firstC) {
            let placed = 0;
            while (placed < MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);

                // Don't place mine on first click or already placed mine
                if (!grid[r][c].isMine && (Math.abs(r - firstR) > 1 || Math.abs(c - firstC) > 1)) {
                    grid[r][c].isMine = true;
                    placed++;
                }
            }
        }

        function calculateNeighbors() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].isMine) continue;

                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            const nr = r + i;
                            const nc = c + j;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                if (grid[nr][nc].isMine) count++;
                            }
                        }
                    }
                    grid[r][c].neighborMines = count;
                }
            }
        }

        function handleCellClick(e) {
            if (isGameOver) return;

            const r = parseInt(e.target.dataset.r);
            const c = parseInt(e.target.dataset.c);
            const cellData = grid[r][c];

            if (cellData.isRevealed) return;

            // Right click
            if (e.button === 2) {
                if (!cellData.isFlagged && flagsLeft > 0) {
                    cellData.isFlagged = true;
                    cellData.element.classList.add('flagged');
                    flagsLeft--;
                } else if (cellData.isFlagged) {
                    cellData.isFlagged = false;
                    cellData.element.classList.remove('flagged');
                    flagsLeft++;
                }
                updateMineCount();
                checkWin();
                return;
            }

            // Left click on flagged cell does nothing
            if (cellData.isFlagged) return;

            if (isFirstClick) {
                isFirstClick = false;
                placeMines(r, c);
                calculateNeighbors();
                timerInterval = setInterval(() => {
                    timeElapsed++;
                    if (timeElapsed > 999) timeElapsed = 999;
                    updateTimer();
                }, 1000);
            }

            revealCell(r, c);
        }

        function revealCell(r, c) {
            const cellData = grid[r][c];
            if (cellData.isRevealed || cellData.isFlagged) return;

            cellData.isRevealed = true;
            cellData.element.classList.add('revealed');

            if (cellData.isMine) {
                gameOver(false);
                return;
            }

            if (cellData.neighborMines > 0) {
                cellData.element.textContent = cellData.neighborMines;
                cellData.element.classList.add(`n${cellData.neighborMines}`);
            } else {
                // Flood fill
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const nr = r + i;
                        const nc = c + j;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }

            checkWin();
        }

        function checkWin() {
            let revealedCount = 0;
            let correctFlags = 0;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].isRevealed) revealedCount++;
                    if (grid[r][c].isMine && grid[r][c].isFlagged) correctFlags++;
                }
            }

            if (revealedCount === ROWS * COLS - MINES || correctFlags === MINES) {
                gameOver(true);
            }
        }

        function gameOver(win) {
            isGameOver = true;
            clearInterval(timerInterval);

            if (win) {
                resetBtn.textContent = '😎';
                flagsLeft = 0;
                updateMineCount();
            } else {
                resetBtn.textContent = '😵';
                // Reveal all mines
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = grid[r][c];
                        if (cell.isMine) {
                            cell.element.classList.add('revealed', 'mine');
                            cell.element.textContent = '💣';
                        }
                    }
                }
            }
        }

        function initGame() {
            clearInterval(timerInterval);
            flagsLeft = MINES;
            timeElapsed = 0;
            isGameOver = false;
            isFirstClick = true;
            resetBtn.textContent = '😊';

            updateMineCount();
            updateTimer();
            createBoard();
        }

        initGame();
    </script>
</body>
</html>
