<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Tycoon - Jules Spiele</title>
    <style>
        body { font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif; background-color: #81c784; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .back-btn { align-self: flex-start; text-decoration: none; color: white; background: #388e3c; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        .back-btn:hover { background: #2e7d32; }
        h1 { margin-top: 0; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .header-panel { display: flex; justify-content: space-between; width: 100%; max-width: 900px; background: white; padding: 15px 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-bottom: 20px; border-top: 5px solid #4caf50; }
        .stat { text-align: center; }
        .stat-icon { font-size: 24px; margin-bottom: 5px; }
        .stat-val { font-size: 20px; font-weight: bold; color: #2e7d32; }
        .stat-label { font-size: 12px; color: #757575; text-transform: uppercase; }

        .park-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 900px; background: #aed581; padding: 15px; border-radius: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); margin-bottom: 30px; min-height: 400px; }
        .plot { background: #c5e1a5; border: 2px dashed #81c784; border-radius: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; position: relative; min-height: 150px; }
        .plot:hover { background: #dcedc8; border-color: #4caf50; }
        .plot-icon { font-size: 50px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
        .build-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); border-radius: 10px; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 10px; box-sizing: border-box; }
        .plot:hover .build-menu.active { display: flex; }
        .build-btn { background: #ff9800; color: white; border: none; padding: 5px 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; font-size: 12px; width: 90%; }
        .build-btn:hover { background: #f57c00; }
        .build-btn:disabled { background: #9e9e9e; cursor: not-allowed; }

        .ride-info { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 10px; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 0; border-radius: 0 0 10px 10px; display: none; }
        .plot.occupied .ride-info { display: block; }

        .visitor { position: absolute; font-size: 20px; animation: wander 3s infinite alternate ease-in-out; pointer-events: none; }
        @keyframes wander { 0% { transform: translate(0, 0); } 100% { transform: translate(20px, -20px); } }

    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Park Tycoon - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>



    <h1>🎢 Freizeitpark Tycoon</h1>

    <div class="header-panel">
        <div class="stat">
            <div class="stat-icon">💵</div>
            <div class="stat-val" id="funds">$1,000</div>
            <div class="stat-label">Budget</div>
        </div>
        <div class="stat">
            <div class="stat-icon">👥</div>
            <div class="stat-val" id="visitors">0</div>
            <div class="stat-label">Besucher</div>
        </div>
        <div class="stat">
            <div class="stat-icon">📈</div>
            <div class="stat-val" id="income">+$0 /s</div>
            <div class="stat-label">Einkommen</div>
        </div>
        <div class="stat">
            <div class="stat-icon">⭐</div>
            <div class="stat-val" id="rating">0.0</div>
            <div class="stat-label">Bewertung</div>
        </div>
    </div>

    <div class="park-area" id="park">
        <!-- Plots generated by JS -->
    </div>

    <script>
        let money = 1000;
        let visitors = 0;
        let incomePerSec = 0;
        let parkRating = 0;
        let totalRides = 0;

        const buildings = [
            { id: 'burger', name: 'Burger-Stand', cost: 200, income: 5, rating: 0.1, icon: '🍔' },
            { id: 'carousel', name: 'Karussell', cost: 500, income: 15, rating: 0.5, icon: '🎠' },
            { id: 'ferris', name: 'Riesenrad', cost: 1500, income: 40, rating: 1.2, icon: '🎡' },
            { id: 'coaster', name: 'Achterbahn', cost: 5000, income: 150, rating: 3.0, icon: '🎢' },
            { id: 'circus', name: 'Zirkuszelt', cost: 10000, income: 350, rating: 5.0, icon: '🎪' }
        ];

        const parkLayout = Array(12).fill(null); // 12 plots

        function updateUI() {
            document.getElementById('funds').innerText = '$' + Math.floor(money).toLocaleString();
            document.getElementById('visitors').innerText = Math.floor(visitors).toLocaleString();
            document.getElementById('income').innerText = '+$' + incomePerSec + ' /s';
            document.getElementById('rating').innerText = parkRating.toFixed(1) + ' ⭐';

            // Update build buttons state in open menus
            document.querySelectorAll('.build-btn').forEach(btn => {
                const cost = parseInt(btn.dataset.cost);
                btn.disabled = money < cost;
            });
        }

        function createPark() {
            const parkDiv = document.getElementById('park');
            parkDiv.innerHTML = '';

            parkLayout.forEach((ride, index) => {
                const plot = document.createElement('div');
                plot.className = ride ? 'plot occupied' : 'plot';
                plot.id = `plot-${index}`;

                if (ride) {
                    plot.innerHTML = `
                        <div class="plot-icon">${ride.icon}</div>
                        <div class="ride-info">${ride.name}<br>+$${ride.income}/s</div>
                    `;
                } else {
                    plot.innerHTML = `<div class="plot-icon" style="opacity: 0.2;">+</div>`;

                    const menu = document.createElement('div');
                    menu.className = 'build-menu active';
                    buildings.forEach(b => {
                        const btn = document.createElement('button');
                        btn.className = 'build-btn';
                        btn.dataset.cost = b.cost;
                        btn.innerText = `${b.icon} ${b.name} ($${b.cost})`;
                        btn.onclick = (e) => { e.stopPropagation(); buildRide(index, b); };
                        menu.appendChild(btn);
                    });
                    plot.appendChild(menu);
                    plot.onclick = () => {
                        document.querySelectorAll('.build-menu').forEach(m => m.style.display = 'none');
                        menu.style.display = 'flex';
                    };
                }
                parkDiv.appendChild(plot);
            });

            // Click outside closes menus
            document.body.onclick = (e) => {
                if(!e.target.closest('.plot')) {
                    document.querySelectorAll('.build-menu').forEach(m => m.style.display = '');
                }
            };
        }

        function buildRide(plotIndex, buildingObj) {
            if (money >= buildingObj.cost) {
                money -= buildingObj.cost;
                parkLayout[plotIndex] = { ...buildingObj };
                totalRides++;

                // Recalculate stats
                incomePerSec += buildingObj.income;
                parkRating += buildingObj.rating;

                // Add visitors burst based on rating
                visitors += Math.floor(buildingObj.rating * 10);

                createPark(); // re-render
                updateUI();
                spawnVisitorEffect(plotIndex);
            }
        }

        function spawnVisitorEffect(plotIndex) {
            const plot = document.getElementById(`plot-${plotIndex}`);
            if(!plot) return;
            const visitor = document.createElement('div');
            visitor.className = 'visitor';
            visitor.innerText = ['🚶', '🧍', '🏃', '👨‍👩‍👦'][Math.floor(Math.random()*4)];
            visitor.style.left = '50%';
            visitor.style.top = '50%';
            plot.appendChild(visitor);
            setTimeout(() => visitor.remove(), 6000);
        }

        // Game Loop
        setInterval(() => {
            if (totalRides > 0) {
                money += incomePerSec;

                // Slowly accumulate visitors based on rating
                if(Math.random() < 0.3) {
                    visitors += Math.max(1, Math.floor(parkRating / 2));
                    // Randomly show visitor emoji on a random ride
                    const occupiedIndices = parkLayout.map((r,i) => r ? i : -1).filter(i => i !== -1);
                    if(occupiedIndices.length > 0) {
                        const rIdx = occupiedIndices[Math.floor(Math.random() * occupiedIndices.length)];
                        spawnVisitorEffect(rIdx);
                    }
                }

                updateUI();

                // Integration with main portal
                if(window.parent && window.parent.userSystem && Math.random() < 0.02) {
                    window.parent.userSystem.addCoins(1);
                }
            }
        }, 1000);

        // Init
        createPark();
        updateUI();
        if(window.parent && window.parent.userSystem) {
            window.parent.userSystem.addXP(20);
        }
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'park-tycoon';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
