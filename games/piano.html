<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mini Klavier</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #ace0f9; padding-top: 50px; }
        .piano { display: flex; justify-content: center; margin: 50px auto; }
        .key { width: 50px; height: 200px; background: white; border: 1px solid black; margin: 0 2px; cursor: pointer; border-radius: 0 0 5px 5px; }
        .key.black { background: black; height: 120px; width: 30px; margin-left: -15px; margin-right: -15px; z-index: 2; }
        .key:active { background: #eee; }
        .key.black:active { background: #333; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Mini Klavier</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Mini Klavier</h1>
    <div class="piano">
        <div class="key" onclick="play(261.63)"></div>
        <div class="key black" onclick="play(277.18)"></div>
        <div class="key" onclick="play(293.66)"></div>
        <div class="key black" onclick="play(311.13)"></div>
        <div class="key" onclick="play(329.63)"></div>
        <div class="key" onclick="play(349.23)"></div>
        <div class="key black" onclick="play(369.99)"></div>
        <div class="key" onclick="play(392.00)"></div>
        <div class="key black" onclick="play(415.30)"></div>
        <div class="key" onclick="play(440.00)"></div>
        <div class="key black" onclick="play(466.16)"></div>
        <div class="key" onclick="play(493.88)"></div>
    </div>
    <br>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        function play(freq) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine'; osc.frequency.value = freq;
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1);
            setTimeout(() => osc.stop(), 1000);
        }
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'piano';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
