<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Shooter (2 Spieler) - PlayZone</title>
    <style>
        body { margin: 0; padding: 0; background-color: #2c3e50; color: white; font-family: 'Verdana', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-header { width: 100%; padding: 10px 20px; background-color: #1a252f; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 2px solid #e74c3c; }
        h1 { margin: 0; font-size: 1.5rem; color: #e74c3c; }
        .back-btn { padding: 8px 16px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .back-btn:hover { background-color: #c0392b; }
        #game-container { position: relative; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 4px solid #34495e; border-radius: 8px; overflow: hidden; background: #ecf0f1; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .score-board { display: flex; justify-content: space-between; width: 100%; font-size: 24px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .p1-score { color: #2980b9; }
        .p2-score { color: #c0392b; text-align: right; }
        .controls-info { font-size: 12px; color: #2c3e50; text-align: center; margin-top: auto; padding-bottom: 10px; font-weight: bold; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
        #overlay h2 { font-size: 3rem; margin-bottom: 20px; color: #fff; text-shadow: 2px 2px 4px #000; }
        #start-btn { padding: 15px 40px; font-size: 1.5rem; background-color: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        #start-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Platform Shooter (2 Spieler) - PlayZone</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <div id="game-header">
        <h1>Gun Mayhem</h1>

    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="score-board">
                <div class="p1-score">P1 (Blau): <span id="score1">0</span></div>
                <div class="p2-score">P2 (Rot): <span id="score2">0</span></div>
            </div>
            <div class="controls-info">P1: W,A,D (Bewegen) | F (Schießen)<br>P2: Pfeiltasten (Bewegen) | M (Schießen)</div>
        </div>
        <div id="overlay">
            <h2 id="overlay-title">Platform Arena</h2>
            <button id="start-btn">Kämpfen</button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let gameState = 'start';
        let score1 = 0;
        let score2 = 0;

        // Level Design
        const platforms = [
            {x: 0, y: 550, w: 800, h: 50}, // Ground
            {x: 150, y: 400, w: 200, h: 20},
            {x: 450, y: 400, w: 200, h: 20},
            {x: 300, y: 250, w: 200, h: 20},
            {x: 50, y: 150, w: 150, h: 20},
            {x: 600, y: 150, w: 150, h: 20}
        ];

        class Bullet {
            constructor(x, y, vx, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.w = 10;
                this.h = 4;
                this.color = color;
                this.active = true;
            }

            update() {
                this.x += this.vx;
                if (this.x < 0 || this.x > canvas.width) this.active = false;

                // Hit platform
                for (let p of platforms) {
                    if (this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) {
                        this.active = false;
                        break;
                    }
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
            }
        }

        class Player {
            constructor(x, y, color, controls, facingRight) {
                this.x = x;
                this.y = y;
                this.w = 30;
                this.h = 40;
                this.vx = 0;
                this.vy = 0;
                this.speed = 5;
                this.jumpPower = -12;
                this.gravity = 0.6;
                this.color = color;
                this.controls = controls;
                this.facingRight = facingRight;
                this.onGround = false;
                this.bullets = [];
                this.shootCooldown = 0;
                this.health = 100;
                this.dead = false;
            }

            update() {
                if (this.dead) return;

                // Move
                if (keys[this.controls.left]) { this.vx = -this.speed; this.facingRight = false; }
                else if (keys[this.controls.right]) { this.vx = this.speed; this.facingRight = true; }
                else { this.vx *= 0.8; } // Friction

                // Jump
                if (keys[this.controls.up] && this.onGround) {
                    this.vy = this.jumpPower;
                    this.onGround = false;
                }

                // Shoot
                if (this.shootCooldown > 0) this.shootCooldown--;
                if (keys[this.controls.shoot] && this.shootCooldown <= 0) {
                    this.shoot();
                }

                this.vy += this.gravity;

                // Horizontal Collision
                this.x += this.vx;
                this.checkPlatformCollision(true);

                // Vertical Collision
                this.y += this.vy;
                this.onGround = false;
                this.checkPlatformCollision(false);

                // Screen bounds
                if (this.x < 0) this.x = 0;
                if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

                // Falling off map (shouldnt happen with ground, but just in case)
                if (this.y > canvas.height) this.health = 0;

                if (this.health <= 0) this.dead = true;

                // Update bullets
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i];
                    b.update();
                    if (!b.active) this.bullets.splice(i, 1);
                }
            }

            checkPlatformCollision(horizontal) {
                for (let p of platforms) {
                    if (this.x < p.x + p.w && this.x + this.w > p.x &&
                        this.y < p.y + p.h && this.y + this.h > p.y) {

                        if (horizontal) {
                            if (this.vx > 0) this.x = p.x - this.w;
                            else if (this.vx < 0) this.x = p.x + p.w;
                            this.vx = 0;
                        } else {
                            if (this.vy > 0) { // Landing
                                this.y = p.y - this.h;
                                this.onGround = true;
                            } else if (this.vy < 0) { // Hitting head
                                this.y = p.y + p.h;
                            }
                            this.vy = 0;
                        }
                    }
                }
            }

            shoot() {
                let bx = this.facingRight ? this.x + this.w : this.x - 10;
                let by = this.y + 15;
                let bvx = this.facingRight ? 12 : -12;
                this.bullets.push(new Bullet(bx, by, bvx, '#f1c40f'));
                this.shootCooldown = 20; // Frames
            }

            draw() {
                if (this.dead) return;

                // Body
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);

                // Eye / Direction
                ctx.fillStyle = 'white';
                let eyeX = this.facingRight ? this.x + 20 : this.x + 5;
                ctx.fillRect(eyeX, this.y + 5, 5, 5);

                // Gun
                ctx.fillStyle = '#333';
                let gunX = this.facingRight ? this.x + this.w : this.x - 15;
                ctx.fillRect(gunX, this.y + 15, 15, 6);

                // Health bar
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(this.x, this.y - 10, this.w, 5);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(this.x, this.y - 10, this.w * (this.health / 100), 5);

                // Bullets
                for (let b of this.bullets) b.draw();
            }
        }

        let p1, p2;

        function initRound() {
            p1 = new Player(100, 450, '#2980b9', { left: 'KeyA', right: 'KeyD', up: 'KeyW', shoot: 'KeyF' }, true);
            p2 = new Player(650, 450, '#c0392b', { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', shoot: 'KeyM' }, false);
            gameState = 'playing';
            overlay.classList.add('hidden');
        }

        function checkHit(shooter, target) {
            for (let b of shooter.bullets) {
                if (b.active && b.x < target.x + target.w && b.x + b.w > target.x &&
                    b.y < target.y + target.h && b.y + b.h > target.y) {
                    b.active = false;
                    target.health -= 25;
                }
            }
        }

        function update() {
            if (gameState !== 'playing') return;

            p1.update();
            p2.update();

            checkHit(p1, p2);
            checkHit(p2, p1);

            if (p1.dead || p2.dead) {
                gameState = 'roundOver';
                if (p2.dead) { score1++; overlayTitle.textContent = "P1 (Blau) Gewinnt!"; }
                else if (p1.dead) { score2++; overlayTitle.textContent = "P2 (Rot) Gewinnt!"; }

                score1El.textContent = score1;
                score2El.textContent = score2;

                if (score1 >= 5 || score2 >= 5) {
                    overlayTitle.textContent = (p1.dead ? "P2" : "P1") + " SIEGT!";
                    startBtn.textContent = "Neues Match";
                    if(window.userSystem) {
                        window.userSystem.addCoins(50);
                        window.userSystem.addXP(150);
                    }
                } else {
                    startBtn.textContent = "Nächste Runde";
                }
                overlay.classList.remove('hidden');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#34495e';
            for (let p of platforms) {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Top highlight
                ctx.fillStyle = '#95a5a6';
                ctx.fillRect(p.x, p.y, p.w, 4);
                ctx.fillStyle = '#34495e'; // reset
            }

            if (p1) p1.draw();
            if (p2) p2.draw();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            score1 = 0;
            score2 = 0;
            score1El.textContent = score1;
            score2El.textContent = score2;
            initRound();
        }

        startBtn.addEventListener('click', () => {
            if (score1 >= 5 || score2 >= 5) startGame();
            else initRound();
        });

        // initial draw
        draw();
        loop();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'platform-shooter';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
