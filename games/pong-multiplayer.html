<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Multiplayer</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .instructions {
            margin-top: 15px;
            color: #ecf0f1;
            text-align: center;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 10px;
        }
        .player1-color { color: #3498db; font-weight: bold; }
        .player2-color { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-container">

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Pong Multiplayer</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>



        <div class="player-controls">
            <div class="player1-color">Spieler 1 (Blau): W / S</div>
            <div class="player2-color">Spieler 2 (Rot): Pfeil Oben / Unten</div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="instructions">
            Das klassische Pong-Spiel für 2 Spieler am selben PC!<br>
            Wer zuerst 10 Punkte erreicht, gewinnt.
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game objects
        const paddleWidth = 10;
        const paddleHeight = 100;
        const playerSpeed = 8;
        let isGameOver = false;

        const player1 = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: "#3498db",
            score: 0,
            dy: 0
        };

        const player2 = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: "#e74c3c",
            score: 0,
            dy: 0
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            speed: 5,
            dx: 5,
            dy: 5,
            color: "#fff"
        };

        // Key states
        const keys = {
            w: false,
            s: false,
            ArrowUp: false,
            ArrowDown: false
        };

        // Event listeners
        window.addEventListener("keydown", (e) => {
            if (e.key === "w" || e.key === "W") keys.w = true;
            if (e.key === "s" || e.key === "S") keys.s = true;
            if (e.key === "ArrowUp") keys.ArrowUp = true;
            if (e.key === "ArrowDown") keys.ArrowDown = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "w" || e.key === "W") keys.w = false;
            if (e.key === "s" || e.key === "S") keys.s = false;
            if (e.key === "ArrowUp") keys.ArrowUp = false;
            if (e.key === "ArrowDown") keys.ArrowDown = false;
        });

        // Reset ball
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5;
            ball.dx = -ball.dx;
            ball.dy = 5 * (Math.random() > 0.5 ? 1 : -1);
        }

        // Collision detection
        function collision(b, p) {
            b.top = b.y - b.radius;
            b.bottom = b.y + b.radius;
            b.left = b.x - b.radius;
            b.right = b.x + b.radius;

            p.top = p.y;
            p.bottom = p.y + p.height;
            p.left = p.x;
            p.right = p.x + p.width;

            return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
        }

        // Draw functions
        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawArc(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
        }

        function drawText(text, x, y, color) {
            ctx.fillStyle = color;
            ctx.font = "40px 'Fredoka One'";
            ctx.fillText(text, x, y);
        }

        function drawNet() {
            for (let i = 0; i <= canvas.height; i += 15) {
                drawRect(canvas.width / 2 - 1, i, 2, 10, "#ecf0f1");
            }
        }

        // Update logic
        function update() {
            if (isGameOver) return;

            // Move Player 1
            if (keys.w && player1.y > 0) {
                player1.y -= playerSpeed;
            } else if (keys.s && player1.y + player1.height < canvas.height) {
                player1.y += playerSpeed;
            }

            // Move Player 2
            if (keys.ArrowUp && player2.y > 0) {
                player2.y -= playerSpeed;
            } else if (keys.ArrowDown && player2.y + player2.height < canvas.height) {
                player2.y += playerSpeed;
            }

            // Move Ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collision (top/bottom)
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
            }

            // Score update
            if (ball.x - ball.radius < 0) {
                player2.score++;
                checkWin();
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player1.score++;
                checkWin();
                resetBall();
            }

            // Determine which player the ball is hitting
            let player = (ball.x < canvas.width / 2) ? player1 : player2;

            // Paddle collision
            if (collision(ball, player)) {
                // Determine hit point on paddle
                let collidePoint = (ball.y - (player.y + player.height / 2));
                // Normalize it
                collidePoint = collidePoint / (player.height / 2);
                // Calculate angle
                let angleRad = (Math.PI / 4) * collidePoint;

                // Change direction
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                ball.dx = direction * ball.speed * Math.cos(angleRad);
                ball.dy = ball.speed * Math.sin(angleRad);

                // Increase speed
                ball.speed += 0.5;
            }
        }

        function checkWin() {
            if (player1.score >= 10 || player2.score >= 10) {
                isGameOver = true;
            }
        }

        // Render game
        function render() {
            // Clear canvas
            drawRect(0, 0, canvas.width, canvas.height, "#34495e");

            if (isGameOver) {
                let winnerText = player1.score >= 10 ? "Spieler 1 gewinnt!" : "Spieler 2 gewinnt!";
                ctx.fillStyle = player1.score >= 10 ? player1.color : player2.color;
                ctx.font = "40px 'Fredoka One'";
                ctx.textAlign = "center";
                ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2);
                ctx.font = "20px 'Nunito'";
                ctx.fillStyle = "white";
                ctx.fillText("Lade die Seite neu, um nochmal zu spielen", canvas.width / 2, canvas.height / 2 + 40);
                return;
            }

            // Draw Net
            drawNet();

            // Draw Score
            drawText(player1.score, canvas.width / 4, canvas.height / 5, player1.color);
            drawText(player2.score, 3 * canvas.width / 4, canvas.height / 5, player2.color);

            // Draw Paddles
            drawRect(player1.x, player1.y, player1.width, player1.height, player1.color);
            drawRect(player2.x, player2.y, player2.width, player2.height, player2.color);

            // Draw Ball
            drawArc(ball.x, ball.y, ball.radius, ball.color);
        }

        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'pong-multiplayer';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
