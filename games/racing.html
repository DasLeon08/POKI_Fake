<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Racing</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #333; color: white; font-family: 'Trebuchet MS', Arial, sans-serif; }
        .header { display: flex; justify-content: space-between; width: 400px; margin-bottom: 20px; align-items: center; }
        .btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #c0392b; }
        a { color: #ecf0f1; text-decoration: none; font-size: 16px; font-weight: bold; }
        a:hover { color: #f1c40f; }
        #gameCanvas { background: #2c3e50; border: 6px solid #7f8c8d; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hud { font-size: 20px; font-weight: bold; color: #f1c40f; display: flex; gap: 20px; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px; border-radius: 10px; text-align: center; border: 4px solid #e74c3c; z-index: 10; width: 250px; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Retro Racing</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <div class="header">
        <a href="../index.html">← Zurück</a>
        <div class="hud">
            <div>Score: <span id="score">0</span></div>
            <div>Speed: <span id="speed">0</span></div>
        </div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOver">
            <h2 style="color: #e74c3c; margin-top: 0;">CRASH!</h2>
            <p id="finalScore" style="font-size: 24px;">Score: 0</p>
            <button class="btn" onclick="initGame()">Restart</button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const speedEl = document.getElementById('speed');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        let player, obstacles, lines, score, speed, isGameOver, gameLoop, keys;

        const ROAD_WIDTH = 300;
        const CAR_WIDTH = 40;
        const CAR_HEIGHT = 70;

        function initGame() {
            player = { x: 200, y: 500, w: CAR_WIDTH, h: CAR_HEIGHT, color: '#e74c3c' };
            obstacles = [];
            lines = [0, 150, 300, 450, 600]; // Y positions for road lines
            score = 0;
            speed = 5;
            isGameOver = false;
            keys = { left: false, right: false, up: false, down: false };

            scoreEl.textContent = score;
            speedEl.textContent = speed;
            gameOverEl.style.display = 'none';

            spawnObstacle();

            if (gameLoop) cancelAnimationFrame(gameLoop);
            loop();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
            if (e.key === 'ArrowUp') keys.up = true;
            if (e.key === 'ArrowDown') keys.down = true;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === 'ArrowUp') keys.up = false;
            if (e.key === 'ArrowDown') keys.down = false;
        });

        function spawnObstacle() {
            const laneWidth = ROAD_WIDTH / 3;
            const lane = Math.floor(Math.random() * 3);
            const x = (canvas.width - ROAD_WIDTH) / 2 + lane * laneWidth + (laneWidth - CAR_WIDTH) / 2;

            obstacles.push({
                x: x, y: -CAR_HEIGHT,
                w: CAR_WIDTH, h: CAR_HEIGHT,
                color: ['#3498db', '#2ecc71', '#9b59b6', '#f1c40f'][Math.floor(Math.random() * 4)],
                passed: false
            });
        }

        function update() {
            if (isGameOver) return;

            // Speed Control
            if (keys.up && speed < 15) speed += 0.1;
            else if (keys.down && speed > 3) speed -= 0.2;
            else if (speed > 5) speed -= 0.05; // Friction

            speedEl.textContent = Math.floor(speed * 10);

            // Player Movement
            if (keys.left) player.x -= 5 + speed/3;
            if (keys.right) player.x += 5 + speed/3;

            // Bounds
            const leftBound = (canvas.width - ROAD_WIDTH) / 2;
            const rightBound = leftBound + ROAD_WIDTH;
            if (player.x < leftBound) player.x = leftBound;
            if (player.x + player.w > rightBound) player.x = rightBound - player.w;

            // Road Lines
            for (let i = 0; i < lines.length; i++) {
                lines[i] += speed;
                if (lines[i] > 600) lines[i] = -150;
            }

            // Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += speed - 2; // Obstacles move slightly slower than player max speed

                // Collision
                if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                    gameOver();
                }

                // Score
                if (obs.y > player.y + player.h && !obs.passed) {
                    obs.passed = true;
                    score += 10;
                    scoreEl.textContent = score;
                    if (score % 50 === 0) speed += 1; // Difficulty increase
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // Spawning
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].y > 200 + Math.random() * 200) {
                spawnObstacle();
                // Double spawn chance
                if (Math.random() < 0.2 + (speed/100)) {
                    spawnObstacle();
                }
            }
        }

        function drawCar(x, y, color) {
            // Body
            ctx.fillStyle = color;
            ctx.fillRect(x, y + 10, CAR_WIDTH, CAR_HEIGHT - 20);
            ctx.fillRect(x + 5, y, CAR_WIDTH - 10, CAR_HEIGHT);

            // Windows
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 5, y + 15, CAR_WIDTH - 10, 15); // Windshield
            ctx.fillRect(x + 5, y + CAR_HEIGHT - 25, CAR_WIDTH - 10, 10); // Rear window

            // Wheels
            ctx.fillStyle = '#111';
            ctx.fillRect(x - 2, y + 15, 4, 15);
            ctx.fillRect(x + CAR_WIDTH - 2, y + 15, 4, 15);
            ctx.fillRect(x - 2, y + CAR_HEIGHT - 30, 4, 15);
            ctx.fillRect(x + CAR_WIDTH - 2, y + CAR_HEIGHT - 30, 4, 15);
        }

        function draw() {
            // Grass
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road
            const roadX = (canvas.width - ROAD_WIDTH) / 2;
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(roadX, 0, ROAD_WIDTH, canvas.height);

            // Shoulders (Rumble strips)
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(roadX - 10, 0, 10, canvas.height);
            ctx.fillRect(roadX + ROAD_WIDTH, 0, 10, canvas.height);

            ctx.fillStyle = '#ecf0f1';
            for (let i = -100; i < canvas.height; i += 40) {
                let offset = (lines[0] % 40) + i;
                ctx.fillRect(roadX - 10, offset, 10, 20);
                ctx.fillRect(roadX + ROAD_WIDTH, offset, 10, 20);
            }

            // Lane markers
            ctx.fillStyle = '#ecf0f1';
            for (let l = 1; l < 3; l++) {
                let laneX = roadX + l * (ROAD_WIDTH / 3) - 2;
                for (let i = 0; i < lines.length; i++) {
                    ctx.fillRect(laneX, lines[i], 4, 50);
                }
            }

            // Obstacles
            obstacles.forEach(o => drawCar(o.x, o.y, o.color));

            // Player
            drawCar(player.x, player.y, player.color);
        }

        function loop() {
            if (!isGameOver) {
                update();
                draw();
                gameLoop = requestAnimationFrame(loop);
            }
        }

        function gameOver() {
            isGameOver = true;
            gameOverEl.style.display = 'block';
            finalScoreEl.textContent = `Score: ${score}`;

            // Explosion effect
            ctx.fillStyle = '#e67e22';
            ctx.beginPath(); ctx.arc(player.x + CAR_WIDTH/2, player.y + CAR_HEIGHT/2, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath(); ctx.arc(player.x + CAR_WIDTH/2, player.y + CAR_HEIGHT/2, 20, 0, Math.PI*2); ctx.fill();

            if (window.userSystem) {
                window.userSystem.addXP(Math.floor(score / 5));
                window.userSystem.addCoins(Math.floor(score / 20));
            }
        }

        initGame();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'racing';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
