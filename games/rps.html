<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Schere, Stein, Papier</title>
    <style>
        body { margin: 0; background: #9b59b6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; font-family: 'Verdana', sans-serif; overflow: hidden; padding: 20px; text-align: center;}
        h1 { margin-bottom: 20px; font-size: 2.5rem; text-shadow: 2px 2px #8e44ad; }
        .score-board { display: flex; gap: 50px; font-size: 2rem; font-weight: bold; margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 15px 30px; border-radius: 10px; }
        .choices { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .choice { background: #ecf0f1; color: #2c3e50; font-size: 4rem; width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 8px 15px rgba(0,0,0,0.2); border: 5px solid transparent;}
        .choice:hover { transform: scale(1.1); box-shadow: 0 12px 20px rgba(0,0,0,0.3); }
        .result { font-size: 2rem; font-weight: bold; min-height: 40px; }
        .action { margin-top: 10px; font-size: 1.2rem; opacity: 0.8; }

        /* Win/Lose Borders */
        .win { border-color: #2ecc71; }
        .lose { border-color: #e74c3c; }
        .draw { border-color: #f1c40f; }

        @media (max-width: 500px) {
            .choice { width: 80px; height: 80px; font-size: 2.5rem; }
            .score-board { gap: 20px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <h1>Schere, Stein, Papier</h1>

    <div class="score-board">
        <div id="user-score" class="badge">Spieler: <span>0</span></div>
        <div id="comp-score" class="badge">CPU: <span>0</span></div>
    </div>

    <div class="result">
        <p id="result-text">Wähle eine Option, um zu starten!</p>
    </div>

    <div class="choices">
        <div class="choice" id="r" title="Stein">✊</div>
        <div class="choice" id="p" title="Papier">📄</div>
        <div class="choice" id="s" title="Schere">✂️</div>
    </div>

    <p class="action">Klicke auf ein Symbol</p>

    <script>
        let userScore = 0;
        let compScore = 0;
        const userScoreSpan = document.querySelector('#user-score span');
        const compScoreSpan = document.querySelector('#comp-score span');
        const resultText = document.getElementById('result-text');
        const rBtn = document.getElementById('r');
        const pBtn = document.getElementById('p');
        const sBtn = document.getElementById('s');

        function getCompChoice() {
            const choices = ['r', 'p', 's'];
            const rNum = Math.floor(Math.random() * 3);
            return choices[rNum];
        }

        function convertToWord(letter) {
            if (letter === 'r') return 'Stein';
            if (letter === 'p') return 'Papier';
            return 'Schere';
        }

        function win(userChoice, compChoice) {
            userScore++;
            userScoreSpan.innerHTML = userScore;
            resultText.innerHTML = `${convertToWord(userChoice)} schlägt ${convertToWord(compChoice)}. Du gewinnst! 🎉`;
            const userChoiceDiv = document.getElementById(userChoice);
            userChoiceDiv.classList.add('win');
            setTimeout(() => userChoiceDiv.classList.remove('win'), 400);
        }

        function lose(userChoice, compChoice) {
            compScore++;
            compScoreSpan.innerHTML = compScore;
            resultText.innerHTML = `${convertToWord(userChoice)} verliert gegen ${convertToWord(compChoice)}. CPU gewinnt! 😢`;
            const userChoiceDiv = document.getElementById(userChoice);
            userChoiceDiv.classList.add('lose');
            setTimeout(() => userChoiceDiv.classList.remove('lose'), 400);
        }

        function draw(userChoice, compChoice) {
            resultText.innerHTML = `${convertToWord(userChoice)} und ${convertToWord(compChoice)}. Unentschieden! 🤝`;
            const userChoiceDiv = document.getElementById(userChoice);
            userChoiceDiv.classList.add('draw');
            setTimeout(() => userChoiceDiv.classList.remove('draw'), 400);
        }

        function game(userChoice) {
            const compChoice = getCompChoice();
            switch (userChoice + compChoice) {
                case 'rs':
                case 'pr':
                case 'sp':
                    win(userChoice, compChoice);
                    break;
                case 'rp':
                case 'ps':
                case 'sr':
                    lose(userChoice, compChoice);
                    break;
                case 'rr':
                case 'pp':
                case 'ss':
                    draw(userChoice, compChoice);
                    break;
            }
        }

        function main() {
            rBtn.addEventListener('click', () => game('r'));
            pBtn.addEventListener('click', () => game('p'));
            sBtn.addEventListener('click', () => game('s'));
        }

        main();
    </script>
</body>
</html>
