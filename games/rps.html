<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Schere Stein Papier - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .choices { display: flex; gap: 20px; margin-top: 30px; }
        .choice-btn { padding: 20px; font-size: 3rem; cursor: pointer; background: #34495e; border: 2px solid #ecf0f1; border-radius: 10px; transition: transform 0.1s, background-color 0.2s; }
        .choice-btn:hover { background: #3b536b; transform: scale(1.05); }
        .choice-btn:active { transform: scale(0.95); }
        .results { margin-top: 40px; text-align: center; font-size: 2rem; }
        .scores { display: flex; justify-content: space-around; width: 300px; margin-top: 20px; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Schere Stein Papier - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <h1>Schere, Stein, Papier</h1>

    <div class="scores">
        <div>Du: <span id="playerScore">0</span></div>
        <div>Computer: <span id="compScore">0</span></div>
    </div>

    <div class="choices">
        <button class="choice-btn" id="rock">✊</button>
        <button class="choice-btn" id="paper">✋</button>
        <button class="choice-btn" id="scissors">✌️</button>
    </div>

    <div class="results" id="resultText">Wähle deine Waffe!</div>

    <script>
        const choices = ['rock', 'paper', 'scissors'];
        const emojis = { 'rock': '✊', 'paper': '✋', 'scissors': '✌️' };
        let pScore = 0;
        let cScore = 0;

        const playerScoreEl = document.getElementById('playerScore');
        const compScoreEl = document.getElementById('compScore');
        const resultTextEl = document.getElementById('resultText');

        document.getElementById('rock').addEventListener('click', () => playRound('rock'));
        document.getElementById('paper').addEventListener('click', () => playRound('paper'));
        document.getElementById('scissors').addEventListener('click', () => playRound('scissors'));

        function getComputerChoice() {
            return choices[Math.floor(Math.random() * 3)];
        }

        function playRound(playerSelection) {
            const computerSelection = getComputerChoice();
            let result = '';

            if (playerSelection === computerSelection) {
                result = `Unentschieden! Beide wählten ${emojis[playerSelection]}`;
            } else if (
                (playerSelection === 'rock' && computerSelection === 'scissors') ||
                (playerSelection === 'paper' && computerSelection === 'rock') ||
                (playerSelection === 'scissors' && computerSelection === 'paper')
            ) {
                pScore++;
                playerScoreEl.textContent = pScore;
                result = `Du gewinnst! ${emojis[playerSelection]} schlägt ${emojis[computerSelection]}`;
            } else {
                cScore++;
                compScoreEl.textContent = cScore;
                result = `Du verlierst! ${emojis[computerSelection]} schlägt ${emojis[playerSelection]}`;
            }

            resultTextEl.textContent = result;
        }
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'rps';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
