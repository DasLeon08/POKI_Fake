<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter.io - Online PVP Simulation</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px black; }
        #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 5px; width: 150px; pointer-events: none; }
        h3 { margin: 0 0 5px 0; font-size: 14px; text-transform: uppercase; color: #ecf0f1; }
        ol { margin: 0; padding-left: 20px; font-size: 14px; }
        li { margin-bottom: 3px; }
        #back-btn { position: absolute; bottom: 10px; left: 10px; padding: 10px 20px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-family: Arial, sans-serif; z-index: 20;}
        #back-btn:hover { background-color: #c0392b; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 30px; border-radius: 10px; text-align: center; display: none; z-index: 30; border: 2px solid #e74c3c;}
        #game-over h1 { margin-top: 0; color: #e74c3c; }
        #game-over button { margin-top: 15px; padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #3498db; color: white; }
        #game-over button:hover { background: #2980b9; }
        #controls-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; text-align: right; pointer-events: none; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Shooter.io - Online PVP Simulation</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <div id="ui">
        <h2>Kills: <span id="score">0</span> | HP: <span id="hp">100</span></h2>
    </div>

    <div id="leaderboard">
        <h3>Bestenliste</h3>
        <ol id="lb-list"></ol>
    </div>

    <div id="controls-hint">
        WASD: Bewegen<br>
        Maus: Zielen & Schießen
    </div>

    <div id="game-over">
        <h1>Ausgeschaltet!</h1>
        <p>Deine Kills: <span id="final-score"></span></p>
        <button onclick="location.reload()">Neustart</button>
    </div>

    <a href="../index.html" id="back-btn">Zurück zum Portal</a>
    <canvas id="gameCanvas"></canvas>

    <script src="../js/user-system.js"></script>
    <script>

            // Advanced Particle System Graphics

            // Playable Particle Popper Mechanics

            // ==========================================
            // SUPERCHARGED PARTICLE POPPER V3.0
            // ==========================================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            // State
            let score = 0;
            let highScore = localStorage.getItem('poki_highscore_v3') || 0;
            let combo = 0;
            let comboTimer = 0;
            let maxCombo = 0;
            let gameSpeed = 1;

            let particles = [];
            let explosions = [];
            let floatingTexts = [];
            let shockwaves = [];

            // Mouse
            let mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
            let lastMouse = { x: -1000, y: -1000 };

            canvas.addEventListener('mousemove', (e) => {
                const r = canvas.getBoundingClientRect();
                lastMouse.x = mouse.x;
                lastMouse.y = mouse.y;
                mouse.x = e.clientX - r.left;
                mouse.y = e.clientY - r.top;
                mouse.vx = mouse.x - lastMouse.x;
                mouse.vy = mouse.y - lastMouse.y;
            });

            canvas.addEventListener('mouseleave', () => {
                mouse.x = -1000;
                mouse.y = -1000;
            });

            const colors = [
                '#FF0099', '#493240', '#00C9FF', '#92FE9D',
                '#ff4757', '#2ed573', '#1e90ff', '#ffa502',
                '#ff6348', '#a29bfe', '#fd79a8', '#f9ca24'
            ];

            // Classes
            class Particle {
                constructor() {
                    this.x = Math.random() * (canvas.width / dpr);
                    this.y = Math.random() * (canvas.height / dpr);
                    this.vx = (Math.random() - 0.5) * 4 * gameSpeed;
                    this.vy = (Math.random() - 0.5) * 4 * gameSpeed;
                    this.radius = Math.random() * 5 + 3;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.isBomb = Math.random() > 0.95; // 5% chance to be a bomb
                    if (this.isBomb) {
                        this.color = '#fff';
                        this.radius = 8;
                    }
                }
                update() {
                    this.x += this.vx * gameSpeed;
                    this.y += this.vy * gameSpeed;

                    // Bounce
                    if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
                    if (this.x > (canvas.width / dpr) - this.radius) { this.x = (canvas.width / dpr) - this.radius; this.vx *= -1; }
                    if (this.y < this.radius) { this.y = this.radius; this.vy *= -1; }
                    if (this.y > (canvas.height / dpr) - this.radius) { this.y = (canvas.height / dpr) - this.radius; this.vy *= -1; }

                    // Dodge mouse slightly unless bomb
                    if(!this.isBomb) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 100) {
                            this.vx -= dx * 0.005;
                            this.vy -= dy * 0.005;
                        }
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = this.isBomb ? 20 : 10;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.closePath();

                    if (this.isBomb) {
                        ctx.strokeStyle = '#ff4757';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                }
            }

            class Shockwave {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.radius = 0;
                    this.maxRadius = 100;
                    this.life = 1;
                }
                update() {
                    this.radius += 5;
                    this.life -= 0.05;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `${this.color.replace(')', `,${this.life})`).replace('rgb', 'rgba')}`;
                    ctx.lineWidth = 3 * this.life;
                    ctx.stroke();
                    ctx.closePath();
                }
            }

            class FloatingText {
                constructor(x, y, text, color) {
                    this.x = x;
                    this.y = y;
                    this.text = text;
                    this.color = color;
                    this.life = 1.0;
                    this.vy = -2;
                }
                update() {
                    this.y += this.vy;
                    this.life -= 0.02;
                }
                draw() {
                    ctx.fillStyle = `rgba(255,255,255,${this.life})`;
                    ctx.font = 'bold 20px "Fredoka One"';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.text, this.x, this.y);
                }
            }

            function createExplosion(x, y, color, isBomb = false) {
                const count = isBomb ? 20 : 8;
                for(let i=0; i<count; i++) {
                    explosions.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * (isBomb ? 15 : 6),
                        vy: (Math.random() - 0.5) * (isBomb ? 15 : 6),
                        life: 1.0,
                        color: color
                    });
                }
                // Shockwave
                shockwaves.push(new Shockwave(x, y, color === '#fff' ? 'rgb(255,255,255)' : 'rgb(0,255,255)'));
            }

            // Init
            for (let i = 0; i < 70; i++) particles.push(new Particle());

            // Interaction
            canvas.addEventListener('mousedown', (e) => {
                const r = canvas.getBoundingClientRect();
                const mx = e.clientX - r.left;
                const my = e.clientY - r.top;

                let hit = false;
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    const dx = mx - p.x;
                    const dy = my - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist <= p.radius * 3) {
                        if (p.isBomb) {
                            // Bomb logic: blow up all nearby particles
                            createExplosion(p.x, p.y, p.color, true);
                            floatingTexts.push(new FloatingText(p.x, p.y, "BOOM!", "#fff"));
                            particles.splice(i, 1);

                            // Find nearby
                            for(let j = particles.length - 1; j >= 0; j--) {
                                const bp = particles[j];
                                const bdx = p.x - bp.x;
                                const bdy = p.y - bp.y;
                                if(Math.sqrt(bdx*bdx + bdy*bdy) < 150) {
                                    createExplosion(bp.x, bp.y, bp.color);
                                    score += 20 * combo;
                                    particles.splice(j, 1);
                                    particles.push(new Particle()); // respawn
                                }
                            }
                            hit = true;
                            combo += 5;
                        } else {
                            // Normal pop
                            createExplosion(p.x, p.y, p.color);
                            floatingTexts.push(new FloatingText(p.x, p.y, `+${10 * (combo+1)}`, p.color));
                            particles.splice(i, 1);
                            hit = true;
                            combo++;
                            score += 10 * combo;
                            particles.push(new Particle());
                        }

                        comboTimer = 90; // longer combo timer
                        if(combo > maxCombo) maxCombo = combo;

                        // Increase difficulty
                        gameSpeed = 1 + (score / 5000);

                        // Sync XP
                        if (window.userSystem) {
                            window.userSystem.addXP(Math.min(combo, 10));
                        }
                    }
                }

                if (!hit) {
                    combo = 0;
                    floatingTexts.push(new FloatingText(mx, my, "Miss!", "#ff4757"));
                } else {
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('poki_highscore_v3', highScore);
                    }
                }
            });

            // Parallax Stars
            let stars = Array.from({length: 50}, () => ({
                x: Math.random() * (canvas.width/dpr),
                y: Math.random() * (canvas.height/dpr),
                s: Math.random() * 2 + 0.5
            }));

            function animate() {
                // Dark background with slight transparency for trails
                ctx.fillStyle = 'rgba(10, 14, 25, 0.4)';
                ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

                // Draw stars
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                stars.forEach(s => {
                    s.y += s.s * 0.5 * gameSpeed;
                    if(s.y > canvas.height/dpr) s.y = 0;
                    ctx.fillRect(s.x, s.y, s.s, s.s);
                });

                // Draw connecting lines (Performance opt: only check close ones)
                for(let i=0; i<particles.length; i++) {
                    for(let j=i+1; j<particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = dx*dx + dy*dy;

                        if(dist < 8000) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 255, 255, ${0.2 - dist/40000})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                // Entities
                particles.forEach(p => { p.update(); p.draw(); });

                // Shockwaves
                for(let i = shockwaves.length - 1; i >= 0; i--) {
                    shockwaves[i].update();
                    shockwaves[i].draw();
                    if(shockwaves[i].life <= 0) shockwaves.splice(i, 1);
                }

                // Explosions
                for(let i = explosions.length - 1; i >= 0; i--) {
                    let ex = explosions[i];
                    ex.x += ex.vx;
                    ex.y += ex.vy;
                    ex.life -= 0.03;
                    if(ex.life <= 0) { explosions.splice(i, 1); continue; }

                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, 3 * ex.life, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${ex.life})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = ex.color;
                    ctx.fill();
                    ctx.closePath();
                    ctx.shadowBlur = 0;
                }

                // Floating texts
                for(let i = floatingTexts.length - 1; i >= 0; i--) {
                    floatingTexts[i].update();
                    floatingTexts[i].draw();
                    if(floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
                }

                // UI overlays
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px "Fredoka One", cursive';
                ctx.textAlign = 'left';
                ctx.fillText(`Punkte: ${score}`, 20, 40);

                ctx.font = 'bold 16px "Nunito"';
                ctx.fillStyle = '#95a5a6';
                ctx.fillText(`High Score: ${highScore} | Max Combo: ${maxCombo}`, 20, 65);

                if (combo > 1 && comboTimer > 0) {
                    comboTimer--;
                    const scale = 1 + (comboTimer/90) * 0.5;
                    ctx.save();
                    ctx.translate(20, 100);
                    ctx.scale(scale, scale);
                    ctx.fillStyle = `hsla(${combo * 10}, 100%, 60%, ${comboTimer/90})`;
                    ctx.font = 'bold 32px "Fredoka One", cursive';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.fillText(`${combo}x COMBO!`, 0, 0);
                    ctx.restore();
                } else if (comboTimer <= 0) {
                    combo = 0;
                }

                requestAnimationFrame(animate);
            }
            animate();
});
    </script>

</body>
</html>
