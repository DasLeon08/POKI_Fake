<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Simon Says - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .game-board { width: 400px; height: 400px; border-radius: 50%; background-color: #34495e; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; margin-top: 20px; display: flex; flex-wrap: wrap; }
        .simon-btn { width: 50%; height: 50%; opacity: 0.6; transition: opacity 0.2s, background-color 0.2s; cursor: pointer; }
        .top-left { background-color: #e74c3c; border-top-left-radius: 100%; }
        .top-right { background-color: #3498db; border-top-right-radius: 100%; }
        .bottom-left { background-color: #f1c40f; border-bottom-left-radius: 100%; }
        .bottom-right { background-color: #2ecc71; border-bottom-right-radius: 100%; }
        .simon-btn:hover { opacity: 0.8; }
        .simon-btn.active { opacity: 1; box-shadow: inset 0 0 20px rgba(255,255,255,0.8); }
        .center-circle { width: 150px; height: 150px; background-color: #2c3e50; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; border: 10px solid #34495e; }
        #levelDisplay { font-size: 2rem; font-weight: bold; }
        button { padding: 10px 20px; font-size: 1.2rem; cursor: pointer; background: #95a5a6; border: none; color: white; border-radius: 5px; margin-top: 20px; }
        button:hover { background: #7f8c8d; }
        #message { font-size: 1.5rem; margin-top: 20px; height: 30px; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Simon Says - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <h1>Simon Says</h1>

    <div id="message">Drücke Start</div>

    <div class="game-board">
        <div class="simon-btn top-left" id="red"></div>
        <div class="simon-btn top-right" id="blue"></div>
        <div class="simon-btn bottom-left" id="yellow"></div>
        <div class="simon-btn bottom-right" id="green"></div>
        <div class="center-circle">
            <div>Level</div>
            <div id="levelDisplay">0</div>
        </div>
    </div>

    <button id="startBtn" onclick="startGame()">Start</button>

    <script>
        const colors = ['red', 'blue', 'yellow', 'green'];
        let gameSequence = [];
        let playerSequence = [];
        let level = 0;
        let playing = false;
        let playerTurn = false;

        const levelDisplay = document.getElementById('levelDisplay');
        const messageDisplay = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');
        const buttons = document.querySelectorAll('.simon-btn');

        // Sounds can be added later, for now we just use visual cues
        const activateButton = (color) => {
            const btn = document.getElementById(color);
            btn.classList.add('active');
            setTimeout(() => {
                btn.classList.remove('active');
            }, 300);
        };

        const playSequence = async () => {
            playerTurn = false;
            messageDisplay.textContent = 'Pass auf!';
            messageDisplay.style.color = '#fff';

            for (let i = 0; i < gameSequence.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 600)); // Delay between colors
                activateButton(gameSequence[i]);
            }

            playerTurn = true;
            messageDisplay.textContent = 'Dein Zug!';
        };

        const nextLevel = () => {
            level++;
            levelDisplay.textContent = level;
            playerSequence = [];

            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            gameSequence.push(randomColor);

            setTimeout(playSequence, 1000);
        };

        const checkSequence = () => {
            const currentIndex = playerSequence.length - 1;

            if (playerSequence[currentIndex] !== gameSequence[currentIndex]) {
                gameOver();
                return;
            }

            if (playerSequence.length === gameSequence.length) {
                if (playerSequence.length === 20) {
                    messageDisplay.textContent = 'GEWONNEN!';
                    messageDisplay.style.color = '#2ecc71';
                    playing = false;
                    playerTurn = false;
                    startBtn.style.display = 'inline-block';
                    startBtn.textContent = 'Neues Spiel';
                } else {
                    setTimeout(nextLevel, 1000);
                }
            }
        };

        const handleButtonClick = (e) => {
            if (!playing || !playerTurn) return;

            const color = e.target.id;
            activateButton(color);
            playerSequence.push(color);
            checkSequence();
        };

        const gameOver = () => {
            playing = false;
            playerTurn = false;
            messageDisplay.textContent = `Game Over! Level: ${level}`;
            messageDisplay.style.color = '#e74c3c';

            // Flash all colors
            buttons.forEach(btn => btn.classList.add('active'));
            setTimeout(() => {
                buttons.forEach(btn => btn.classList.remove('active'));
            }, 500);

            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'Neustart';
        };

        const startGame = () => {
            gameSequence = [];
            playerSequence = [];
            level = 0;
            playing = true;
            startBtn.style.display = 'none';
            nextLevel();
        };

        buttons.forEach(btn => btn.addEventListener('click', handleButtonClick));
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'simon';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
