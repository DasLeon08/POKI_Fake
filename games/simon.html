<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Simon Says</title>
    <style>
        body { margin: 0; background: #2f3542; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; font-family: 'Arial Black', sans-serif; overflow: hidden; padding: 20px;}
        h1 { margin: 10px; font-size: 2.5rem; color: #ced6e0; text-shadow: 2px 2px #57606f; }
        .info { display: flex; gap: 20px; font-size: 1.5rem; margin-bottom: 30px; }
        .simon-board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-radius: 50%; background: #1e272e; padding: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); width: 300px; height: 300px; position: relative;}

        .simon-btn { border: none; cursor: pointer; opacity: 0.6; transition: opacity 0.2s, transform 0.1s; }
        .simon-btn:active { transform: scale(0.95); }
        .simon-btn.active { opacity: 1; box-shadow: inset 0 0 20px rgba(255,255,255,0.8); }

        #green { background: #2ecc71; border-top-left-radius: 100%; }
        #red { background: #e74c3c; border-top-right-radius: 100%; }
        #yellow { background: #f1c40f; border-bottom-left-radius: 100%; }
        #blue { background: #3498db; border-bottom-right-radius: 100%; }

        .center-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: #2f3542; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #fff; z-index: 10; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

        button.start { background: #ff4757; border: none; padding: 15px 30px; color: white; font-size: 1.5rem; cursor: pointer; border-radius: 10px; margin-top: 30px; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.3s; }
        button.start:hover { background: #ff6b81; }

        @media (max-width: 400px) {
            .simon-board { width: 250px; height: 250px; }
            .center-circle { width: 80px; height: 80px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <h1>Simon Says 🚥</h1>
    <div class="info">
        <span>Level: <span id="level">0</span></span>
    </div>

    <div class="simon-board">
        <button class="simon-btn" id="green" data-color="green"></button>
        <button class="simon-btn" id="red" data-color="red"></button>
        <button class="simon-btn" id="yellow" data-color="yellow"></button>
        <button class="simon-btn" id="blue" data-color="blue"></button>

        <div class="center-circle" id="status">Bereit</div>
    </div>

    <button class="start" id="startBtn" onclick="startGame()">Start</button>

    <script>
        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let isPlayerTurn = false;

        const colors = ['green', 'red', 'yellow', 'blue'];
        const levelDisplay = document.getElementById('level');
        const statusDisplay = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const buttons = document.querySelectorAll('.simon-btn');

        // Sounds (Using Web Audio API for simple beeps)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const frequencies = { green: 329.6, red: 261.6, yellow: 392.0, blue: 440.0 };

        function playTone(freq, duration=300) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = freq;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration/1000);
            oscillator.stop(audioCtx.currentTime + duration/1000);
        }

        function flashButton(color) {
            const btn = document.getElementById(color);
            btn.classList.add('active');
            playTone(frequencies[color]);
            setTimeout(() => {
                btn.classList.remove('active');
            }, 300);
        }

        function playSequence() {
            isPlayerTurn = false;
            playerSequence = [];
            statusDisplay.innerText = 'Merk dir!';
            statusDisplay.style.color = '#fff';

            let i = 0;
            const interval = setInterval(() => {
                flashButton(sequence[i]);
                i++;
                if (i >= sequence.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        isPlayerTurn = true;
                        statusDisplay.innerText = 'Du bist dran';
                        statusDisplay.style.color = '#2ecc71';
                    }, 500);
                }
            }, 800);
        }

        function nextLevel() {
            level++;
            levelDisplay.innerText = level;
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);
            setTimeout(playSequence, 1000);
        }

        function checkSequence(index) {
            if (playerSequence[index] !== sequence[index]) {
                gameOver();
                return;
            }

            if (playerSequence.length === sequence.length) {
                statusDisplay.innerText = 'Richtig! ✅';
                statusDisplay.style.color = '#f1c40f';
                setTimeout(nextLevel, 1000);
            }
        }

        function handleButtonClick(e) {
            if (!isPlayerTurn) return;

            const color = e.target.dataset.color;
            playerSequence.push(color);
            flashButton(color);

            checkSequence(playerSequence.length - 1);
        }

        buttons.forEach(btn => btn.addEventListener('click', handleButtonClick));
        buttons.forEach(btn => btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleButtonClick(e);
        }));

        function startGame() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startBtn.style.display = 'none';
            sequence = [];
            playerSequence = [];
            level = 0;
            nextLevel();
        }

        function gameOver() {
            isPlayerTurn = false;
            statusDisplay.innerText = 'Falsch! ❌';
            statusDisplay.style.color = '#e74c3c';

            // Error sound
            playTone(150, 500);
            setTimeout(() => playTone(100, 500), 200);

            // Flash all
            buttons.forEach(btn => btn.classList.add('active'));
            setTimeout(() => {
                buttons.forEach(btn => btn.classList.remove('active'));
                startBtn.style.display = 'block';
                startBtn.innerText = 'Neu Starten';
            }, 800);
        }
    </script>
</body>
</html>
