<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Volleyball (2 Spieler) - PlayZone</title>
    <style>
        body { margin: 0; padding: 0; background-color: #87CEEB; color: #fff; font-family: 'Comic Sans MS', cursive, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-header { width: 100%; padding: 10px 20px; background-color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        h1 { margin: 0; font-size: 1.5rem; color: #FFD700; text-shadow: 2px 2px 0 #000; }
        .back-btn { padding: 8px 16px; background-color: #FF4500; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; border: 2px solid #fff; }
        .back-btn:hover { background-color: #DC143C; }
        #game-container { position: relative; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 8px solid #fff; border-radius: 12px; overflow: hidden; background: #87CEEB; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .score-board { display: flex; justify-content: space-around; width: 100%; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        .p1-score { color: #32CD32; }
        .p2-score { color: #FF69B4; }
        .controls-info { background: rgba(0,0,0,0.4); padding: 5px; border-radius: 5px; font-size: 14px; text-align: center; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
        #overlay h2 { font-size: 3rem; margin-bottom: 20px; color: #fff; text-shadow: 3px 3px 0 #000; }
        #start-btn { padding: 15px 40px; font-size: 1.5rem; background-color: #FFD700; color: #000; font-weight: bold; border: 4px solid #fff; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        #start-btn:active { transform: scale(0.95); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Slime Volleyball (2 Spieler) - PlayZone</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <div id="game-header">
        <h1>Slime Volleyball</h1>

    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui-layer">
            <div class="score-board">
                <div class="p1-score"><span id="score1">0</span></div>
                <div class="p2-score"><span id="score2">0</span></div>
            </div>
            <div class="controls-info">P1 (Grün): A, D Bewegen | W Springen &nbsp;&nbsp;&nbsp; P2 (Pink): Pfeil Links, Rechts Bewegen | Pfeil Hoch Springen</div>
        </div>
        <div id="overlay">
            <h2 id="overlay-title">Volleyball</h2>
            <button id="start-btn">Serve!</button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Physics constants
        const gravity = 0.4;
        const groundY = 350;
        const netX = canvas.width / 2;
        const netHeight = 80;

        let gameState = 'start';
        let score1 = 0;
        let score2 = 0;
        let serveTurn = 1;

        class Slime {
            constructor(x, color, controls, isLeft) {
                this.x = x;
                this.y = groundY;
                this.radius = 40;
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.controls = controls;
                this.isLeft = isLeft;
                this.speed = 6;
                this.jumpStrength = -10;
            }

            update() {
                // Horizontal
                if (keys[this.controls.left]) this.vx = -this.speed;
                else if (keys[this.controls.right]) this.vx = this.speed;
                else this.vx = 0;

                // Jump
                if (keys[this.controls.up] && this.y >= groundY) {
                    this.vy = this.jumpStrength;
                }

                // Apply physics
                this.vy += gravity;
                this.x += this.vx;
                this.y += this.vy;

                // Floor collision
                if (this.y > groundY) {
                    this.y = groundY;
                    this.vy = 0;
                }

                // Wall & Net collisions
                if (this.isLeft) {
                    if (this.x - this.radius < 0) this.x = this.radius;
                    if (this.x + this.radius > netX - 5) this.x = netX - 5 - this.radius; // Net limit
                } else {
                    if (this.x + this.radius > canvas.width) this.x = canvas.width - this.radius;
                    if (this.x - this.radius < netX + 5) this.x = netX + 5 + this.radius; // Net limit
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, Math.PI, 0); // Halbkreis
                ctx.fill();

                // Eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                let eyeX = this.isLeft ? this.x + 15 : this.x - 15;
                ctx.arc(eyeX, this.y - 15, 8, 0, Math.PI * 2);
                ctx.fill();

                // Pupil
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(eyeX + (ball.x > this.x ? 2 : -2), this.y - 15, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Ball {
            constructor() {
                this.radius = 12;
                this.reset(1);
            }

            reset(server) {
                this.x = server === 1 ? canvas.width / 4 : canvas.width * 3 / 4;
                this.y = 100;
                this.vx = 0;
                this.vy = 0;
            }

            update(p1, p2) {
                this.vy += gravity * 0.8; // Ball falls slightly slower than slime
                this.x += this.vx;
                this.y += this.vy;

                // Wall collisions
                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
                if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }

                // Net collision
                if (this.y > groundY - netHeight && Math.abs(this.x - netX) < this.radius + 5) {
                    if (this.y < groundY - netHeight + this.radius) {
                        // Top of net bounce
                        this.vy *= -1;
                        this.y = groundY - netHeight - this.radius;
                    } else {
                        // Side of net bounce
                        this.vx *= -1;
                        if(this.x < netX) this.x = netX - 5 - this.radius;
                        else this.x = netX + 5 + this.radius;
                    }
                }

                // Player collisions (Circle to Circle approx)
                this.checkPlayerCollision(p1);
                this.checkPlayerCollision(p2);

                // Floor collision / Scoring
                if (this.y + this.radius > groundY) {
                    if (this.x < netX) score(2); // P2 scores
                    else score(1); // P1 scores
                }
            }

            checkPlayerCollision(p) {
                const dx = this.x - p.x;
                const dy = this.y - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // Slime is semi-circle, so only collide if ball is above ground level relative to slime center
                if (dist < this.radius + p.radius && this.y <= p.y + this.radius/2) {
                    // Calculate bounce vector based on angle
                    const angle = Math.atan2(dy, dx);

                    // Add player velocity to ball
                    const bounceSpeed = 10;
                    this.vx = Math.cos(angle) * bounceSpeed + (p.vx * 0.5);
                    this.vy = Math.sin(angle) * bounceSpeed - 3; // Extra upward push

                    // Prevent ball getting stuck inside slime
                    this.x = p.x + Math.cos(angle) * (this.radius + p.radius);
                    this.y = p.y + Math.sin(angle) * (this.radius + p.radius);
                }
            }

            draw() {
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        let p1 = new Slime(canvas.width/4, '#32CD32', { left: 'KeyA', right: 'KeyD', up: 'KeyW' }, true);
        let p2 = new Slime(canvas.width*3/4, '#FF69B4', { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp' }, false);
        let ball = new Ball();

        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, groundY);

            // Ground
            ctx.fillStyle = '#F4A460'; // Sand
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Net
            ctx.fillStyle = '#FFF';
            ctx.fillRect(netX - 5, groundY - netHeight, 10, netHeight);
        }

        function score(playerNum) {
            gameState = 'scored';
            if (playerNum === 1) score1++;
            else score2++;

            score1El.textContent = score1;
            score2El.textContent = score2;

            serveTurn = playerNum; // Winner serves

            if (score1 >= 7 || score2 >= 7) {
                gameState = 'gameover';
                overlayTitle.textContent = `P${playerNum} WIN!`;
                startBtn.textContent = "Play Again";
                overlay.classList.remove('hidden');

                if(window.userSystem) {
                    window.userSystem.addCoins(25);
                    window.userSystem.addXP(60);
                }
            } else {
                overlayTitle.textContent = `P${playerNum} Point!`;
                startBtn.textContent = "Serve";
                overlay.classList.remove('hidden');
            }
        }

        function startRound() {
            p1.x = canvas.width/4; p1.y = groundY; p1.vx = 0; p1.vy = 0;
            p2.x = canvas.width*3/4; p2.y = groundY; p2.vx = 0; p2.vy = 0;
            ball.reset(serveTurn);
            gameState = 'playing';
            overlay.classList.add('hidden');
        }

        function startGame() {
            score1 = 0;
            score2 = 0;
            score1El.textContent = score1;
            score2El.textContent = score2;
            serveTurn = 1;
            startRound();
        }

        function loop() {
            if (gameState === 'playing') {
                p1.update();
                p2.update();
                ball.update(p1, p2);
            }

            drawBackground();
            p1.draw();
            p2.draw();
            ball.draw();

            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', () => {
            if (gameState === 'gameover' || gameState === 'start') startGame();
            else startRound();
        });

        // Init draw
        drawBackground();
        p1.draw();
        p2.draw();
        ball.draw();

        loop();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'slime-volleyball';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
