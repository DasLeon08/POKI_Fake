<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Volleyball (2 Spieler) - PlayZone</title>
    <style>
        body { margin: 0; padding: 0; background-color: #87CEEB; color: #fff; font-family: 'Comic Sans MS', cursive, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-header { width: 100%; padding: 10px 20px; background-color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        h1 { margin: 0; font-size: 1.5rem; color: #FFD700; text-shadow: 2px 2px 0 #000; }
        .back-btn { padding: 8px 16px; background-color: #FF4500; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; border: 2px solid #fff; }
        .back-btn:hover { background-color: #DC143C; }
        #game-container { position: relative; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 8px solid #fff; border-radius: 12px; overflow: hidden; background: #87CEEB; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .score-board { display: flex; justify-content: space-around; width: 100%; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        .p1-score { color: #32CD32; }
        .p2-score { color: #FF69B4; }
        .controls-info { background: rgba(0,0,0,0.4); padding: 5px; border-radius: 5px; font-size: 14px; text-align: center; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
        #overlay h2 { font-size: 3rem; margin-bottom: 20px; color: #fff; text-shadow: 3px 3px 0 #000; }
        #start-btn { padding: 15px 40px; font-size: 1.5rem; background-color: #FFD700; color: #000; font-weight: bold; border: 4px solid #fff; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        #start-btn:active { transform: scale(0.95); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Slime Volleyball (2 Spieler) - PlayZone</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <div id="game-header">
        <h1>Slime Volleyball</h1>

    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui-layer">
            <div class="score-board">
                <div class="p1-score"><span id="score1">0</span></div>
                <div class="p2-score"><span id="score2">0</span></div>
            </div>
            <div class="controls-info">P1 (Grün): A, D Bewegen | W Springen &nbsp;&nbsp;&nbsp; P2 (Pink): Pfeil Links, Rechts Bewegen | Pfeil Hoch Springen</div>
        </div>
        <div id="overlay">
            <h2 id="overlay-title">Volleyball</h2>
            <button id="start-btn">Serve!</button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>

            // Advanced Particle System Graphics
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // Adjust canvas to match device pixel ratio for sharper graphics
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            let particles = [];
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6348'];
            let mouse = { x: canvas.width / (2 * dpr), y: canvas.height / (2 * dpr) };

            canvas.addEventListener('mousemove', (e) => {
                const r = canvas.getBoundingClientRect();
                mouse.x = e.clientX - r.left;
                mouse.y = e.clientY - r.top;
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * (canvas.width / dpr);
                    this.y = Math.random() * (canvas.height / dpr);
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                    this.radius = Math.random() * 3 + 1;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > canvas.width / dpr) this.vx = -this.vx;
                    if (this.y < 0 || this.y > canvas.height / dpr) this.vy = -this.vy;

                    // Mouse interaction
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        this.x -= dx * 0.02;
                        this.y -= dy * 0.02;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.closePath();
                    ctx.shadowBlur = 0; // Reset
                }
            }

            for (let i = 0; i < 80; i++) particles.push(new Particle());

            function animate() {
                // Trail effect
                ctx.fillStyle = 'rgba(10, 14, 23, 0.3)';
                ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

                particles.forEach(p => p.update());

                // Draw connecting lines
                for(let i=0; i<particles.length; i++) {
                    for(let j=i; j<particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx*dx + dy*dy);

                        if(dist < 80) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${1 - dist/80})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => p.draw());
                requestAnimationFrame(animate);
            }
            animate();
</script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'slime-volleyball';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
