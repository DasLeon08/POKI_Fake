<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielautomat - Jules Spiele</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #f1c40f, #e74c3c); font-family: 'Fredoka One', cursive; color: white; }
        .slot-machine { background: #c0392b; padding: 40px; border-radius: 20px; box-shadow: inset 0 -10px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .slots { display: flex; gap: 20px; justify-content: center; margin: 30px 0; background: white; padding: 20px; border-radius: 10px; box-shadow: inset 0 5px 10px rgba(0,0,0,0.3); }
        .slot { font-size: 80px; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; background: #ecf0f1; border-radius: 10px; color: #2c3e50; }
        .btn-spin { font-family: 'Fredoka One', cursive; font-size: 30px; padding: 15px 50px; background-color: #f1c40f; color: #c0392b; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 10px #f39c12; transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; }
        .btn-spin:active { transform: translateY(5px); box-shadow: 0 5px #f39c12; }
        .btn-back { margin-top: 30px; padding: 10px 20px; background-color: #34495e; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-family: 'Nunito', sans-serif; }
        .balance { font-size: 24px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="slot-machine">
        <div class="balance">Coins: <span id="balance">100</span></div>
        <div class="slots">
            <div class="slot" id="slot1">🍒</div>
            <div class="slot" id="slot2">🍋</div>
            <div class="slot" id="slot3">🔔</div>
        </div>
        <button class="btn-spin" onclick="spin()">Spin (10 Coins)</button>
        <div id="result" style="margin-top: 20px; font-size: 24px;">Viel Glück!</div>
        <br>
        <a href="../index.html" class="btn-back">Zurück zum Portal</a>
    </div>

    <script>
        const symbols = ["🍒", "🍋", "🔔", "🍉", "⭐", "💎"];
        let balance = 100;
        const balanceEl = document.getElementById("balance");
        const resultEl = document.getElementById("result");

        function spin() {
            if (balance < 10) {
                resultEl.innerText = "Nicht genug Coins!";
                return;
            }

            balance -= 10;
            balanceEl.innerText = balance;
            resultEl.innerText = "Dreht...";

            let s1 = symbols[Math.floor(Math.random() * symbols.length)];
            let s2 = symbols[Math.floor(Math.random() * symbols.length)];
            let s3 = symbols[Math.floor(Math.random() * symbols.length)];

            // Simple animation simulation
            let spins = 0;
            let interval = setInterval(() => {
                document.getElementById("slot1").innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById("slot2").innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById("slot3").innerText = symbols[Math.floor(Math.random() * symbols.length)];
                spins++;
                if (spins > 10) {
                    clearInterval(interval);
                    document.getElementById("slot1").innerText = s1;
                    document.getElementById("slot2").innerText = s2;
                    document.getElementById("slot3").innerText = s3;
                    checkWin(s1, s2, s3);
                }
            }, 100);
        }

        function checkWin(s1, s2, s3) {
            if (s1 === s2 && s2 === s3) {
                let win = s1 === "💎" ? 500 : 100;
                balance += win;
                resultEl.innerText = "JACKPOT! +" + win + " Coins!";
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                balance += 20;
                resultEl.innerText = "Kleiner Gewinn! +20 Coins!";
            } else {
                resultEl.innerText = "Leider nichts. Versuch es nochmal!";
            }
            balanceEl.innerText = balance;
        }
    </script>
</body>
</html>
