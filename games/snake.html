<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Snake - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        canvas { background: #34495e; border: 2px solid #ecf0f1; margin-top: 20px; }
        #score { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Snake - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <h1>Snake</h1>
    <div id="score">Punkte: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        let snake = [{x: 200, y: 200}];
        let dx = 0;
        let dy = -gridSize;
        let foodX;
        let foodY;
        let score = 0;

        function main() {
            if (hasGameEnded()) return;
            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            // Create nice grid background
            ctx.fillStyle = "#1a252f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            for(let x=0; x<=canvas.width; x+=gridSize) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
            }
            for(let y=0; y<=canvas.height; y+=gridSize) {
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
            }
        }

        function drawSnakePart(snakePart, index) {
            // Gradient based on position
            let gradient = ctx.createLinearGradient(snakePart.x, snakePart.y, snakePart.x + gridSize, snakePart.y + gridSize);
            if (index === 0) {
                // Head
                gradient.addColorStop(0, '#2ecc71');
                gradient.addColorStop(1, '#27ae60');
            } else {
                // Body
                gradient.addColorStop(0, '#27ae60');
                gradient.addColorStop(1, '#1e8449');
            }

            ctx.fillStyle = gradient;
            ctx.strokeStyle = '#145a32';
            ctx.lineWidth = 1;

            // Draw rounded rect
            ctx.beginPath();
            ctx.roundRect(snakePart.x, snakePart.y, gridSize - 1, gridSize - 1, 4);
            ctx.fill();
            ctx.stroke();

            // Eyes for head
            if (index === 0) {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(snakePart.x + gridSize/3, snakePart.y + gridSize/3, 2, 0, Math.PI*2);
                ctx.arc(snakePart.x + 2*gridSize/3, snakePart.y + gridSize/3, 2, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => drawSnakePart(part, index));
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            const hasEatenFood = snake[0].x === foodX && snake[0].y === foodY;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerHTML = "Punkte: " + score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width - 10;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height - 10;
            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        function randomTen(min, max) {
            return Math.round((Math.random() * (max - min) + min) / gridSize) * gridSize;
        }

        function generateFood() {
            foodX = randomTen(0, canvas.width - gridSize);
            foodY = randomTen(0, canvas.height - gridSize);
            snake.forEach(function has_snake_eaten_food(part) {
                const has_eaten = part.x == foodX && part.y == foodY;
                if (has_eaten) generateFood();
            });
        }

        function drawFood() {
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#e74c3c";
            ctx.fillStyle = "#e74c3c";

            ctx.beginPath();
            ctx.arc(foodX + gridSize/2, foodY + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
            ctx.fill();

            ctx.shadowBlur = 0; // reset
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            const keyPressed = event.keyCode;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -gridSize;
                dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -gridSize;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = gridSize;
                dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = gridSize;
            }
        }

        generateFood();
        main();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'snake';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
