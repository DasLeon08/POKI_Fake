<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Snake</title>
    <style>
        body { margin: 0; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #000; border: 2px solid #4CAF50; border-radius: 5px; box-shadow: 0 0 10px rgba(76, 175, 80, 0.5); }
        h1 { margin: 10px; font-size: 24px; color: #4CAF50; }
        #score { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        #gameover { display: none; position: absolute; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; text-align: center; border: 2px solid red; }
        button { background: #4CAF50; border: none; padding: 10px 20px; color: white; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #45a049; }
        .controls { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        .controls button { padding: 15px; font-size: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Snake 🐍</h1>
    <div id="score">Punkte: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls" style="display: none;"> <!-- Mobile controls hidden by default -->
        <div></div><button id="up">↑</button><div></div>
        <button id="left">←</button><button id="down">↓</button><button id="right">→</button>
    </div>

    <div id="gameover">
        <h2>Game Over!</h2>
        <p id="finalScore">Punkte: 0</p>
        <button onclick="resetGame()">Neu Starten</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameOverScreen = document.getElementById("gameover");
        const finalScore = document.getElementById("finalScore");

        const gridSize = 20;
        let snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
        let food = {x: 300, y: 300};
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let changingDirection = false;
        let gameLoop;

        // Show mobile controls if touch
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.querySelector('.controls').style.display = 'grid';
            canvas.width = 300; canvas.height = 300; // Smaller canvas for mobile
            snake = [{x: 140, y: 140}, {x: 120, y: 140}, {x: 100, y: 140}];
        }

        function main() {
            if (hasGameEnded()) {
                gameOverScreen.style.display = "block";
                finalScore.innerText = `Punkte: ${score}`;
                return;
            }

            changingDirection = false;
            gameLoop = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach(drawSnakePart);
        }

        function drawSnakePart(snakePart) {
            ctx.fillStyle = 'lightgreen';
            ctx.strokeStyle = 'darkgreen';
            ctx.fillRect(snakePart.x, snakePart.y, gridSize, gridSize);
            ctx.strokeRect(snakePart.x, snakePart.y, gridSize, gridSize);
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerHTML = `Punkte: ${score}`;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.round((Math.random() * (canvas.width - gridSize)) / gridSize) * gridSize;
            food.y = Math.round((Math.random() * (canvas.height - gridSize)) / gridSize) * gridSize;

            snake.forEach(function has_snake_eaten_food(part) {
                const has_eaten = part.x == food.x && part.y == food.y;
                if (has_eaten) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = 'red';
            ctx.strokeStyle = 'darkred';
            ctx.fillRect(food.x, food.y, gridSize, gridSize);
            ctx.strokeRect(food.x, food.y, gridSize, gridSize);
        }

        function changeDirection(event) {
            const LEFT_KEY = 37; const RIGHT_KEY = 39; const UP_KEY = 38; const DOWN_KEY = 40;
            const W_KEY = 87; const A_KEY = 65; const S_KEY = 83; const D_KEY = 68;

            if (changingDirection) return;
            const keyPressed = event.keyCode;
            const goingUp = dy === -gridSize; const goingDown = dy === gridSize; const goingRight = dx === gridSize; const goingLeft = dx === -gridSize;

            if ((keyPressed === LEFT_KEY || keyPressed === A_KEY) && !goingRight) { dx = -gridSize; dy = 0; changingDirection = true;}
            if ((keyPressed === UP_KEY || keyPressed === W_KEY) && !goingDown) { dx = 0; dy = -gridSize; changingDirection = true;}
            if ((keyPressed === RIGHT_KEY || keyPressed === D_KEY) && !goingLeft) { dx = gridSize; dy = 0; changingDirection = true;}
            if ((keyPressed === DOWN_KEY || keyPressed === S_KEY) && !goingUp) { dx = 0; dy = gridSize; changingDirection = true;}
        }

        document.addEventListener("keydown", changeDirection);

        // Mobile Controls
        document.getElementById('up').onclick = () => { if(dy !== gridSize) { dx=0; dy=-gridSize; }};
        document.getElementById('down').onclick = () => { if(dy !== -gridSize) { dx=0; dy=gridSize; }};
        document.getElementById('left').onclick = () => { if(dx !== gridSize) { dx=-gridSize; dy=0; }};
        document.getElementById('right').onclick = () => { if(dx !== -gridSize) { dx=gridSize; dy=0; }};


        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;
            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        function resetGame() {
            score = 0;
            scoreElement.innerHTML = `Punkte: 0`;
            dx = gridSize; dy = 0;
            if (canvas.width === 300) snake = [{x: 140, y: 140}, {x: 120, y: 140}, {x: 100, y: 140}];
            else snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            gameOverScreen.style.display = "none";
            generateFood();
            clearTimeout(gameLoop);
            main();
        }

        generateFood();
        main();
    </script>
</body>
</html>
