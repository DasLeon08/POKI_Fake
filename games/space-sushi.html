<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Sushi Delivery - Poki Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            padding: 10px 20px;
            background-color: #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 2px solid #ff4757;
        }
        .back-btn {
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #ff6b81;
        }
        #game-container {
            position: relative;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background-color: #0b0c10;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hidden {
            display: none !important;
        }
        .screen {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            border: 2px solid #ff4757;
        }
        h1 { margin-top: 0; color: #ff4757; }
        button {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover { background-color: #7bed9f; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        .controls-info {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h2>Space Sushi Delivery</h2>
        <a href="../index.html" class="back-btn">Zurück zur Übersicht</a>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud" class="hidden">
            <div id="scoreDisplay">Score: 0</div>
            <div id="energyDisplay">Energy: 100%</div>
        </div>
        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <h1>Space Sushi Delivery</h1>
                <p>Deliver sushi to alien customers before your energy runs out!</p>
                <div class="controls-info">
                    Steering: A / D or Left / Right Arrows<br>
                    Thrust: W or Up Arrow<br>
                    Throw Sushi: SPACE (when near a customer)
                </div>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <h1>Out of Energy!</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="../js/progress.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const energyDisplay = document.getElementById('energyDisplay');
        const finalScoreDisplay = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game State
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let lastTime = 0;
        let particles = [];
        let stars = [];

        // Input
        const keys = {
            ArrowUp: false, ArrowLeft: false, ArrowRight: false,
            w: false, a: false, d: false,
            ' ': false
        };

        window.addEventListener('keydown', e => {
            if(keys.hasOwnProperty(e.key) || e.key === ' ') {
                keys[e.key] = true;
                if(e.key === ' ' && gameState === 'playing') {
                    attemptDelivery();
                }
            }
        });
        window.addEventListener('keyup', e => {
            if(keys.hasOwnProperty(e.key) || e.key === ' ') keys[e.key] = false;
        });

        // Init Stars
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        // Entities
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: 0,
            vy: 0,
            angle: -Math.PI / 2,
            radius: 15,
            energy: 100,
            thrust: 0.1,
            turnSpeed: 0.05,
            friction: 0.98,
            maxEnergy: 100,
            energyDrain: 2 // per second
        };

        let customers = [];
        let sushis = [];

        function spawnCustomer() {
            const margin = 50;
            customers.push({
                x: margin + Math.random() * (canvas.width - margin*2),
                y: margin + Math.random() * (canvas.height - margin*2),
                radius: 20,
                color: `hsl(${Math.random()*360}, 70%, 50%)`,
                timer: 10, // seconds to deliver
                maxTimer: 10 + Math.random() * 10
            });
        }

        function attemptDelivery() {
            // Check if near customer
            for(let i=customers.length-1; i>=0; i--) {
                const c = customers[i];
                const dx = player.x - c.x;
                const dy = player.y - c.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if(dist < player.radius + c.radius + 60) { // Delivery range
                    // Throw sushi animation
                    sushis.push({
                        x: player.x, y: player.y,
                        tx: c.x, ty: c.y,
                        progress: 0,
                        customerIndex: i
                    });

                    // Immediately score it for logic simplicity, visually it travels
                    score += Math.floor(c.timer * 10);
                    player.energy = Math.min(player.maxEnergy, player.energy + 15);
                    createExplosion(c.x, c.y, '#fff');
                    customers.splice(i, 1);
                    spawnCustomer();
                    updateHUD();
                    break; // one at a time
                }
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1,
                    color: color
                });
            }
        }

        function update(dt) {
            if(gameState !== 'playing') return;

            // Player Turn
            if(keys.ArrowLeft || keys.a) player.angle -= player.turnSpeed;
            if(keys.ArrowRight || keys.d) player.angle += player.turnSpeed;

            // Player Thrust
            let thrusting = false;
            if(keys.ArrowUp || keys.w) {
                player.vx += Math.cos(player.angle) * player.thrust;
                player.vy += Math.sin(player.angle) * player.thrust;
                thrusting = true;
                player.energy -= (player.energyDrain * 2) * dt; // More drain when thrusting

                // Thrust particles
                if(Math.random() < 0.3) {
                    particles.push({
                        x: player.x - Math.cos(player.angle) * player.radius,
                        y: player.y - Math.sin(player.angle) * player.radius,
                        vx: -Math.cos(player.angle) * 2 + (Math.random()-0.5),
                        vy: -Math.sin(player.angle) * 2 + (Math.random()-0.5),
                        life: 1,
                        color: '#ffaa00'
                    });
                }
            }

            player.vx *= player.friction;
            player.vy *= player.friction;
            player.x += player.vx;
            player.y += player.vy;

            // Screen Wrap
            if(player.x < 0) player.x = canvas.width;
            if(player.x > canvas.width) player.x = 0;
            if(player.y < 0) player.y = canvas.height;
            if(player.y > canvas.height) player.y = 0;

            // Energy Drain
            player.energy -= player.energyDrain * dt;
            if(player.energy <= 0) {
                endGame();
            }

            // Customers
            for(let i=customers.length-1; i>=0; i--) {
                let c = customers[i];
                c.timer -= dt;
                if(c.timer <= 0) {
                    customers.splice(i, 1);
                    spawnCustomer();
                    // Penalty?
                    player.energy -= 10;
                }
            }

            // Ensure we always have at least one customer
            if(customers.length === 0) spawnCustomer();

            // Sushis (visual only)
            for(let i=sushis.length-1; i>=0; i--) {
                sushis[i].progress += dt * 3;
                if(sushis[i].progress >= 1) {
                    sushis.splice(i, 1);
                }
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= dt * 2;
                if(p.life <= 0) particles.splice(i, 1);
            }

            // Background Stars (parallax slightly based on player vel)
            stars.forEach(s => {
                s.x -= player.vx * s.speed;
                s.y -= player.vy * s.speed;
                if(s.x < 0) s.x = canvas.width;
                if(s.x > canvas.width) s.x = 0;
                if(s.y < 0) s.y = canvas.height;
                if(s.y > canvas.height) s.y = 0;
            });

            updateHUD();
        }

        function draw() {
            // Background
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.globalAlpha = s.speed;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            if(gameState === 'playing') {
                // Customers
                customers.forEach(c => {
                    // Draw alien
                    ctx.fillStyle = c.color;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(c.x - 5, c.y - 5, 4, 0, Math.PI*2);
                    ctx.arc(c.x + 5, c.y - 5, 4, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(c.x - 5, c.y - 5, 2, 0, Math.PI*2);
                    ctx.arc(c.x + 5, c.y - 5, 2, 0, Math.PI*2);
                    ctx.fill();

                    // Timer ring
                    ctx.strokeStyle = c.timer < 3 ? '#ff4757' : '#2ed573';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius + 5, -Math.PI/2, -Math.PI/2 + (c.timer/c.maxTimer) * Math.PI*2);
                    ctx.stroke();

                    // Delivery zone indicator
                    const distToPlayer = Math.sqrt((player.x-c.x)**2 + (player.y-c.y)**2);
                    if(distToPlayer < player.radius + c.radius + 60) {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.arc(c.x, c.y, player.radius + c.radius + 60, 0, Math.PI*2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Spacebar prompt
                        ctx.fillStyle = 'white';
                        ctx.font = '12px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('SPACE', c.x, c.y + c.radius + 20);
                    }
                });

                // Sushis in flight
                sushis.forEach(s => {
                    const sx = s.x + (s.tx - s.x) * s.progress;
                    const sy = s.y + (s.ty - s.y) * s.progress;
                    ctx.fillStyle = '#ffa502'; // Salmon color
                    ctx.fillRect(sx - 4, sy - 3, 8, 6);
                    ctx.fillStyle = 'white'; // Rice
                    ctx.fillRect(sx - 4, sy, 8, 4);
                });

                // Player Ship (Scooter)
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);

                // Ship body
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.moveTo(player.radius, 0);
                ctx.lineTo(-player.radius, player.radius*0.7);
                ctx.lineTo(-player.radius*0.5, 0);
                ctx.lineTo(-player.radius, -player.radius*0.7);
                ctx.closePath();
                ctx.fill();

                // Windshield
                ctx.fillStyle = '#7bed9f';
                ctx.beginPath();
                ctx.moveTo(player.radius*0.2, 0);
                ctx.lineTo(-player.radius*0.2, player.radius*0.4);
                ctx.lineTo(-player.radius*0.2, -player.radius*0.4);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                // Particles
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
        }

        function updateHUD() {
            scoreDisplay.innerText = `Score: ${score}`;
            const ePercent = Math.max(0, Math.floor(player.energy));
            energyDisplay.innerText = `Energy: ${ePercent}%`;
            energyDisplay.style.color = ePercent < 20 ? '#ff4757' : 'white';
        }

        function startGame() {
            gameState = 'playing';
            score = 0;
            player.x = canvas.width/2;
            player.y = canvas.height/2;
            player.vx = 0; player.vy = 0;
            player.energy = player.maxEnergy;
            player.angle = -Math.PI/2;
            customers = [];
            sushis = [];
            particles = [];
            spawnCustomer();
            spawnCustomer();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'gameover';
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreDisplay.innerText = score;

            if (window.ProgressSystem) {
                window.ProgressSystem.addXP(Math.floor(score / 10));
                window.ProgressSystem.addCoins(Math.floor(score / 20));
            }
        }

        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Cap dt to prevent huge jumps if tab is inactive
            if(dt < 0.1) {
                update(dt);
            }
            draw();

            if(gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initial Draw
        draw();

    </script>
</body>
</html>
