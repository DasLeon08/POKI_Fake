<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fidget Spinner</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #96e6a1; padding-top: 50px; }
        #spinner { font-size: 100px; display: inline-block; cursor: pointer; user-select: none; transition: transform 0.1s linear; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Fidget Spinner</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <h1>Fidget Spinner</h1>
    <p>Klicke wiederholt auf den Spinner, um ihn schneller zu drehen!</p>
    <div id="spinner" onclick="spin()">🌀</div>
    <p>Drehzahl: <span id="speed">0</span></p>
    <br>
    <button class="btn" onclick="window.location.href='../index.html'">Zurück zum Portal</button>

    <script>
        let angle = 0, speed = 0;
        const spinner = document.getElementById('spinner'), speedEl = document.getElementById('speed');
        function spin() { speed += 10; }
        setInterval(() => {
            if (speed > 0) speed -= 0.1;
            if (speed < 0) speed = 0;
            angle += speed;
            spinner.style.transform = `rotate(${angle}deg)`;
            speedEl.textContent = Math.round(speed);
        }, 20);
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'spinner';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
