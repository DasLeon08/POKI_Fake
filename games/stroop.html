<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farb-Verwirrung - Jules Spiele</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #e74c3c, #3498db, #2ecc71); font-family: 'Nunito', sans-serif; color: white; text-align: center; }
        .game-container { background: rgba(0,0,0,0.6); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 500px; width: 100%; }
        .target { font-size: 60px; font-weight: bold; margin: 30px 0; text-transform: uppercase; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .buttons button { padding: 20px; font-size: 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: transform 0.1s; color: white; }
        .buttons button:active { transform: scale(0.95); }
        .info { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .btn-back { margin-top: 30px; display: inline-block; padding: 10px 20px; background-color: #f1c40f; color: #2c3e50; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-container">

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Farb-Verwirrung - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

        <div class="info">Punkte: <span id="score">0</span></div>
        <p>Wähle die **FARBE** des Textes, nicht das geschriebene Wort!</p>
        <div class="target" id="targetWord">ROT</div>
        <div class="buttons" id="colorButtons"></div>
        <a href="../index.html" class="btn-back">Zurück zum Portal</a>
    </div>

    <script>
        const colors = [
            { name: "Rot", hex: "#e74c3c" },
            { name: "Blau", hex: "#3498db" },
            { name: "Grün", hex: "#2ecc71" },
            { name: "Gelb", hex: "#f1c40f" }
        ];

        let targetColor;
        let score = 0;
        const scoreEl = document.getElementById("score");
        const targetWordEl = document.getElementById("targetWord");
        const buttonsContainer = document.getElementById("colorButtons");

        function newRound() {
            let nameObj = colors[Math.floor(Math.random() * colors.length)];
            let colorObj = colors[Math.floor(Math.random() * colors.length)];

            targetWordEl.innerText = nameObj.name;
            targetWordEl.style.color = colorObj.hex;
            targetColor = colorObj.hex;

            buttonsContainer.innerHTML = '';

            let shuffledColors = [...colors].sort(() => Math.random() - 0.5);

            shuffledColors.forEach(c => {
                let btn = document.createElement("button");
                btn.innerText = c.name;
                btn.style.backgroundColor = c.hex;
                btn.onclick = () => {
                    if (c.hex === targetColor) {
                        score++;
                        scoreEl.innerText = score;
                        newRound();
                    } else {
                        alert(`Falsch! Die Farbe war ${colors.find(col => col.hex === targetColor).name}. Punkte: ${score}`);
                        score = 0;
                        scoreEl.innerText = score;
                        newRound();
                    }
                };
                buttonsContainer.appendChild(btn);
            });
        }

        newRound();
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'stroop';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
