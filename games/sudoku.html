<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Sudoku - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #ecf0f1; color: #2c3e50; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        #sudoku-board { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(9, 40px); gap: 2px; background: #34495e; padding: 2px; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .cell { width: 40px; height: 40px; background: white; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; user-select: none; }
        .cell:nth-child(3n) { border-right: 2px solid #2c3e50; }
        .cell:nth-child(27n) { border-bottom: 2px solid #2c3e50; }
        .cell.fixed { font-weight: bold; color: #000; background: #eee; cursor: not-allowed; }
        .cell.selected { background: #bdf; }
        .cell.error { color: red; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 380px; }
        .num-btn { width: 40px; height: 40px; font-size: 18px; border: none; border-radius: 5px; background: #3498db; color: white; cursor: pointer; }
        .num-btn:hover { background: #2980b9; }
        .action-btn { padding: 10px 20px; border: none; border-radius: 5px; background: #2ecc71; color: white; font-weight: bold; cursor: pointer; }
        .action-btn:hover { background: #27ae60; }
        #message { margin-top: 15px; font-size: 18px; font-weight: bold; color: #27ae60; display: none; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">Zurück zum Portal</a>

    <h1 style="margin-bottom: 10px;">Sudoku</h1>
    <div style="margin-bottom: 15px; color: #7f8c8d;">Wähle ein Feld und gib eine Zahl ein (1-9)</div>

    <div id="sudoku-board"></div>

    <div class="controls" id="number-pad">
        <button class="num-btn" onclick="inputNumber(1)">1</button>
        <button class="num-btn" onclick="inputNumber(2)">2</button>
        <button class="num-btn" onclick="inputNumber(3)">3</button>
        <button class="num-btn" onclick="inputNumber(4)">4</button>
        <button class="num-btn" onclick="inputNumber(5)">5</button>
        <button class="num-btn" onclick="inputNumber(6)">6</button>
        <button class="num-btn" onclick="inputNumber(7)">7</button>
        <button class="num-btn" onclick="inputNumber(8)">8</button>
        <button class="num-btn" onclick="inputNumber(9)">9</button>
        <button class="num-btn" onclick="inputNumber(0)" style="background: #e74c3c;">X</button>
    </div>

    <div class="controls" style="margin-top: 15px;">
        <button class="action-btn" onclick="generateBoard()">Neues Spiel</button>
        <button class="action-btn" onclick="checkSolution()" style="background: #f39c12;">Prüfen</button>
    </div>

    <div id="message">Glückwunsch! Du hast das Sudoku gelöst! +50 Münzen</div>

    <script src="../js/user-system.js"></script>
    <script>
        const boardEl = document.getElementById('sudoku-board');
        const messageEl = document.getElementById('message');
        let board = [];
        let solution = [];
        let selectedCell = null;

        // A basic pre-defined valid complete grid (can be shifted/swapped for variations)
        const baseGrid = [
            [5,3,4,6,7,8,9,1,2],
            [6,7,2,1,9,5,3,4,8],
            [1,9,8,3,4,2,5,6,7],
            [8,5,9,7,6,1,4,2,3],
            [4,2,6,8,5,3,7,9,1],
            [7,1,3,9,2,4,8,5,6],
            [9,6,1,5,3,7,2,8,4],
            [2,8,7,4,1,9,6,3,5],
            [3,4,5,2,8,6,1,7,9]
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generatePuzzle() {
            // Very simple generator: take base grid, remove some numbers
            // For a real game, we'd use a backtracking solver to ensure uniqueness
            solution = JSON.parse(JSON.stringify(baseGrid));
            board = JSON.parse(JSON.stringify(baseGrid));

            // Remove roughly 40-50 cells
            let cellsToRemove = 45;
            while(cellsToRemove > 0) {
                let r = Math.floor(Math.random() * 9);
                let c = Math.floor(Math.random() * 9);
                if (board[r][c] !== 0) {
                    board[r][c] = 0;
                    cellsToRemove--;
                }
            }
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c] !== 0) {
                        cell.innerText = board[r][c];
                        // If it matches the original board, it's fixed
                        // We assume fixed cells are the ones generated initially
                        cell.classList.add('fixed');
                    }

                    cell.addEventListener('click', () => selectCell(cell));
                    boardEl.appendChild(cell);
                }
            }
        }

        function selectCell(cell) {
            if (cell.classList.contains('fixed')) return;

            // Deselect previous
            if (selectedCell) {
                selectedCell.classList.remove('selected');
            }

            selectedCell = cell;
            cell.classList.add('selected');
        }

        function inputNumber(num) {
            if (!selectedCell) return;

            if (num === 0) {
                selectedCell.innerText = '';
                selectedCell.classList.remove('error');
            } else {
                selectedCell.innerText = num;
                selectedCell.classList.remove('error'); // Clear error state on new input
            }
        }

        function checkSolution() {
            let isComplete = true;
            let isCorrect = true;
            const cells = boardEl.querySelectorAll('.cell');

            cells.forEach(cell => {
                cell.classList.remove('error');
                let r = parseInt(cell.dataset.row);
                let c = parseInt(cell.dataset.col);
                let val = parseInt(cell.innerText);

                if (isNaN(val)) {
                    isComplete = false;
                } else if (val !== solution[r][c]) {
                    isCorrect = false;
                    cell.classList.add('error');
                }
            });

            if (isComplete && isCorrect) {
                messageEl.style.display = 'block';
                if(window.userSystem) {
                    window.userSystem.addCoins(50);
                    window.userSystem.addXP(100);
                }
            } else if (!isComplete) {
                alert("Das Sudoku ist noch nicht vollständig!");
            } else {
                alert("Es gibt Fehler! Die roten Zahlen sind falsch.");
            }
        }

        function generateBoard() {
            messageEl.style.display = 'none';
            selectedCell = null;
            generatePuzzle();
            renderBoard();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (!selectedCell) return;

            if (e.key >= '1' && e.key <= '9') {
                inputNumber(parseInt(e.key));
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                inputNumber(0);
            }
        });

        // Start
        generateBoard();
    </script>
</body>
</html>
