<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Battle (2 Spieler) - PlayZone</title>
    <style>
        body { margin: 0; padding: 0; background-color: #333; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-header { width: 100%; padding: 10px 20px; background-color: #1a1a1a; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        h1 { margin: 0; font-size: 1.5rem; color: #ffeb3b; }
        .back-btn { padding: 8px 16px; background-color: #f44336; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .back-btn:hover { background-color: #d32f2f; }
        #game-container { position: relative; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 4px solid #555; border-radius: 8px; overflow: hidden; }
        canvas { display: block; background-color: #222; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .score-board { display: flex; justify-content: space-between; width: 100%; font-size: 24px; font-weight: bold; }
        .p1-score { color: #4CAF50; }
        .p2-score { color: #F44336; text-align: right; }
        .controls-info { display: flex; justify-content: space-between; width: 100%; font-size: 14px; color: #aaa; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
        #overlay h2 { font-size: 3rem; margin-bottom: 20px; color: #fff; text-shadow: 2px 2px 4px #000; }
        #start-btn { padding: 15px 40px; font-size: 1.5rem; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        #start-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Tank Battle (2 Spieler) - PlayZone</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>


    <div id="game-header">
        <h1>Tank Battle (2 Spieler)</h1>

    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="score-board">
                <div class="p1-score">P1 (Grün): <span id="score1">0</span></div>
                <div class="p2-score">P2 (Rot): <span id="score2">0</span></div>
            </div>
            <div class="controls-info">
                <span>P1: W,A,S,D Bewegen | Leertaste Schießen</span>
                <span>P2: Pfeiltasten Bewegen | Enter Schießen</span>
            </div>
        </div>
        <div id="overlay">
            <h2 id="overlay-title">Tank Battle</h2>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let gameState = 'start'; // start, playing, gameover
        let score1 = 0;
        let score2 = 0;
        const winScore = 5;

        class Tank {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.color = color;
                this.controls = controls;
                this.angle = color === '#4CAF50' ? 0 : Math.PI;
                this.speed = 3;
                this.turnSpeed = 0.05;
                this.bullets = [];
                this.lastShot = 0;
                this.shootCooldown = 500;
                this.isAlive = true;
            }

            update() {
                if (!this.isAlive) return;

                // Drehung
                if (keys[this.controls.left]) this.angle -= this.turnSpeed;
                if (keys[this.controls.right]) this.angle += this.turnSpeed;

                // Bewegung
                if (keys[this.controls.up]) {
                    const newX = this.x + Math.cos(this.angle) * this.speed;
                    const newY = this.y + Math.sin(this.angle) * this.speed;
                    if (!this.checkCollisionWithWalls(newX, newY)) {
                        this.x = newX;
                        this.y = newY;
                    }
                }
                if (keys[this.controls.down]) {
                    const newX = this.x - Math.cos(this.angle) * (this.speed / 2);
                    const newY = this.y - Math.sin(this.angle) * (this.speed / 2);
                    if (!this.checkCollisionWithWalls(newX, newY)) {
                        this.x = newX;
                        this.y = newY;
                    }
                }

                // Spielfeldbegrenzung
                this.x = Math.max(this.width/2, Math.min(canvas.width - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(canvas.height - this.height/2, this.y));

                // Schießen
                if (keys[this.controls.shoot] && Date.now() - this.lastShot > this.shootCooldown) {
                    this.shoot();
                }

                // Bullets updaten
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    let b = this.bullets[i];
                    b.x += Math.cos(b.angle) * b.speed;
                    b.y += Math.sin(b.angle) * b.speed;
                    b.life--;

                    // Bullet Wandkollision (Bounce)
                    let bounced = false;
                    if (b.x < 0 || b.x > canvas.width) { b.angle = Math.PI - b.angle; bounced = true; }
                    if (b.y < 0 || b.y > canvas.height) { b.angle = -b.angle; bounced = true; }

                    if (bounced) {
                        b.x = Math.max(0, Math.min(canvas.width, b.x));
                        b.y = Math.max(0, Math.min(canvas.height, b.y));
                    }

                    // Bullet Hinderniskollision
                    for(let w of walls) {
                        if (b.x > w.x && b.x < w.x + w.width && b.y > w.y && b.y < w.y + w.height) {
                            this.bullets.splice(i, 1);
                            continue;
                        }
                    }

                    if (b.life <= 0) this.bullets.splice(i, 1);
                }
            }

            checkCollisionWithWalls(newX, newY) {
                // Einfache AABB Kollision (ungenau bei Rotation, aber für Box-Wände okay genug)
                const left = newX - this.width/2;
                const right = newX + this.width/2;
                const top = newY - this.height/2;
                const bottom = newY + this.height/2;

                for (let w of walls) {
                    if (right > w.x && left < w.x + w.width && bottom > w.y && top < w.y + w.height) {
                        return true;
                    }
                }
                return false;
            }

            shoot() {
                const gunLength = 25;
                const tipX = this.x + Math.cos(this.angle) * gunLength;
                const tipY = this.y + Math.sin(this.angle) * gunLength;

                this.bullets.push({
                    x: tipX,
                    y: tipY,
                    angle: this.angle,
                    speed: 7,
                    life: 150
                });
                this.lastShot = Date.now();
            }

            draw() {
                if (!this.isAlive) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Body
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                // Treads
                ctx.fillStyle = '#111';
                ctx.fillRect(-this.width/2 - 2, -this.height/2 - 4, this.width + 4, 6);
                ctx.fillRect(-this.width/2 - 2, this.height/2 - 2, this.width + 4, 6);

                // Turret
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                // Gun
                ctx.fillStyle = '#888';
                ctx.fillRect(0, -3, 25, 6);

                ctx.restore();

                // Draw Bullets
                ctx.fillStyle = '#ffeb3b';
                for (let b of this.bullets) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        let player1, player2;
        let walls = [];

        function generateWalls() {
            walls = [];
            // Random obstacles
            for(let i=0; i<8; i++) {
                walls.push({
                    x: 100 + Math.random() * 600,
                    y: 100 + Math.random() * 400,
                    width: 40 + Math.random() * 80,
                    height: 40 + Math.random() * 80
                });
            }
            // Add central block
            walls.push({ x: 350, y: 250, width: 100, height: 100 });
        }

        function initRound() {
            player1 = new Tank(100, canvas.height/2, '#4CAF50', { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', shoot: 'Space' });
            player2 = new Tank(canvas.width - 100, canvas.height/2, '#F44336', { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', shoot: 'Enter' });
            generateWalls();
            gameState = 'playing';
            overlay.classList.add('hidden');
        }

        function startGame() {
            score1 = 0;
            score2 = 0;
            updateScoreUI();
            initRound();
        }

        function updateScoreUI() {
            score1El.textContent = score1;
            score2El.textContent = score2;
        }

        function checkHit(tank, bullet) {
            const dist = Math.hypot(tank.x - bullet.x, tank.y - bullet.y);
            return dist < 20; // Hit radius
        }

        function update() {
            if (gameState !== 'playing') return;

            player1.update();
            player2.update();

            // Collision checks
            for (let i = player1.bullets.length - 1; i >= 0; i--) {
                if (checkHit(player2, player1.bullets[i])) {
                    player1.bullets.splice(i, 1);
                    player2.isAlive = false;
                    endRound(1);
                    return;
                }
            }
            for (let i = player2.bullets.length - 1; i >= 0; i--) {
                if (checkHit(player1, player2.bullets[i])) {
                    player2.bullets.splice(i, 1);
                    player1.isAlive = false;
                    endRound(2);
                    return;
                }
            }
        }

        function endRound(winner) {
            gameState = 'roundOver';
            if (winner === 1) score1++;
            else score2++;

            updateScoreUI();

            if (score1 >= winScore || score2 >= winScore) {
                gameState = 'gameover';
                overlayTitle.textContent = `Spieler ${winner} Gewinnt das Match!`;
                startBtn.textContent = "Neues Spiel";
                overlay.classList.remove('hidden');

                if(window.userSystem) {
                    window.userSystem.addCoins(50);
                    window.userSystem.addXP(100);
                }
            } else {
                setTimeout(initRound, 1500); // Nächste Runde
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw floor grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i=0; i<canvas.height; i+=40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Draw walls
            ctx.fillStyle = '#555';
            ctx.strokeStyle = '#777';
            ctx.lineWidth = 2;
            for(let w of walls) {
                ctx.fillRect(w.x, w.y, w.width, w.height);
                ctx.strokeRect(w.x, w.y, w.width, w.height);
            }

            if (player1) player1.draw();
            if (player2) player2.draw();

            if (gameState === 'roundOver') {
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Runde Beendet!', canvas.width/2, canvas.height/2);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', startGame);
        loop();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'tank-battle';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
