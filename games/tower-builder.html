<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Builder</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #87CEEB; color: #333; font-family: 'Arial Rounded MT Bold', Arial, sans-serif; overflow: hidden; }
        .header { display: flex; justify-content: space-between; width: 400px; margin-bottom: 10px; align-items: center; position: relative; z-index: 20; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #2980b9; }
        a { color: #2c3e50; text-decoration: none; font-size: 16px; font-weight: bold; }
        a:hover { color: #e74c3c; }
        #gameCanvas { background: transparent; border-bottom: 4px solid #27ae60; cursor: pointer; }
        .hud { font-size: 24px; font-weight: bold; color: #2c3e50; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); padding: 30px; border-radius: 10px; text-align: center; border: 4px solid #3498db; z-index: 10; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 200px; }
        .ground { position: absolute; bottom: 0; width: 100%; height: 50px; background: #27ae60; z-index: 1; display: none;} /* Optional visual ground */
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Tower Builder</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <div class="header">
        <a href="../index.html">← Zurück</a>
        <div class="hud">Etage: <span id="score">0</span></div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="gameOver">
            <h2 style="color: #e74c3c; margin-top: 0;">Eingestürzt!</h2>
            <p id="finalScore" style="font-size: 20px;">Höhe: 0</p>
            <button class="btn" onclick="initGame()">Nochmal</button>
        </div>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        let blocks = [], currentBlock, score, isGameOver, gameLoop, cameraY = 0;

        const BLOCK_HEIGHT = 30;
        const INITIAL_WIDTH = 200;
        const START_Y = 550; // Near bottom

        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c'];

        function initGame() {
            blocks = [];
            score = 0;
            isGameOver = false;
            cameraY = 0;

            // Base block
            blocks.push({
                x: 100, y: START_Y, w: INITIAL_WIDTH, h: BLOCK_HEIGHT,
                color: '#34495e'
            });

            scoreEl.textContent = score;
            gameOverEl.style.display = 'none';

            spawnBlock();

            if (gameLoop) cancelAnimationFrame(gameLoop);
            loop();
        }

        canvas.addEventListener('mousedown', dropBlock);
        document.addEventListener('keydown', e => { if (e.code === 'Space') dropBlock(); });
        canvas.addEventListener('touchstart', e => { dropBlock(); e.preventDefault(); }, {passive: false});

        function spawnBlock() {
            let prev = blocks[blocks.length - 1];
            let width = prev.w;
            let y = prev.y - BLOCK_HEIGHT;
            let dir = Math.random() > 0.5 ? 1 : -1;
            let speed = 3 + (score * 0.2); // Increases with score

            currentBlock = {
                x: dir === 1 ? -width : 400,
                y: y,
                w: width,
                h: BLOCK_HEIGHT,
                vx: speed * dir,
                color: colors[score % colors.length]
            };
        }

        function dropBlock() {
            if (isGameOver) return;

            let prev = blocks[blocks.length - 1];

            // Calculate overlap
            let diff = currentBlock.x - prev.x;
            let overlap = currentBlock.w - Math.abs(diff);

            if (overlap > 0) {
                score++;
                scoreEl.textContent = score;

                // Perfect match bonus (snap to grid)
                if (Math.abs(diff) < 5) {
                    currentBlock.x = prev.x;
                    overlap = currentBlock.w;
                    // Flash effect could go here
                }

                // Trim block
                let newWidth = overlap;
                let newX = currentBlock.x > prev.x ? prev.x + diff : currentBlock.x;

                blocks.push({
                    x: newX,
                    y: currentBlock.y,
                    w: newWidth,
                    h: BLOCK_HEIGHT,
                    color: currentBlock.color
                });

                // Falling piece logic (visual only, simplified)
                // In a full game, you'd animate the chopped piece falling

                // Move camera up
                if (blocks.length > 10) {
                    cameraY += BLOCK_HEIGHT;
                }

                spawnBlock();
            } else {
                gameOver();
            }
        }

        function update() {
            if (isGameOver) return;

            // Move current block
            currentBlock.x += currentBlock.vx;

            // Bounce off walls
            if (currentBlock.x <= 0) {
                currentBlock.x = 0;
                currentBlock.vx *= -1;
            } else if (currentBlock.x + currentBlock.w >= canvas.width) {
                currentBlock.x = canvas.width - currentBlock.w;
                currentBlock.vx *= -1;
            }
        }

        function draw() {
            // Background gradient based on height
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            let skyColor = Math.min(255, score * 5); // Gets darker as you go up
            gradient.addColorStop(0, `rgb(${135 - skyColor/2}, ${206 - skyColor/2}, ${235 - skyColor/4})`);
            gradient.addColorStop(1, '#87CEEB');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, cameraY);

            // Placed Blocks
            blocks.forEach((b, i) => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(b.x, b.y, b.w, 5);
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(b.x, b.y + b.h - 5, b.w, 5);
            });

            // Current moving block
            if (!isGameOver) {
                ctx.fillStyle = currentBlock.color;
                ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.w, currentBlock.h);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.w, 5);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(currentBlock.x, currentBlock.y + currentBlock.h - 5, currentBlock.w, 5);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                gameLoop = requestAnimationFrame(loop);
            }
        }

        function gameOver() {
            isGameOver = true;
            gameOverEl.style.display = 'block';
            finalScoreEl.textContent = `Höhe: ${score}`;

            // Animate falling off
            currentBlock.vy = 0;
            let fallInterval = setInterval(() => {
                currentBlock.vy += 0.5;
                currentBlock.y += currentBlock.vy;
                draw();
                if (currentBlock.y > START_Y + 100) clearInterval(fallInterval);
            }, 1000/60);

            if (window.userSystem) {
                window.userSystem.addXP(score * 10);
                window.userSystem.addCoins(Math.floor(score / 2));
            }
        }

        initGame();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'tower-builder';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
