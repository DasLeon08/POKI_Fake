<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmverteidigung</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #27ae60;
            font-family: 'Nunito', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 10px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .stats {
            display: flex;
            gap: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .btn-wave {
            background-color: #e74c3c;
            color: white;
        }
        .tower-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
        }
        .tower-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid transparent;
        }
        .tower-btn.selected {
            border-color: #f1c40f;
        }
        canvas {
            background-color: #82ccdd; /* Sky/grass base */
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }
        .overlay h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            margin-bottom: 20px;
            color: #f1c40f;
        }
        .restart-btn {
            background-color: #2ecc71;
            color: white;
            font-size: 1.5rem;
            padding: 15px 30px;
        }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Turmverteidigung</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>



    <div class="header">
        <div class="stats">
            <div>❤️ <span id="lives">20</span></div>
            <div>💰 <span id="money">350</span></div>
            <div>Welle: <span id="wave">1</span></div>
        </div>
        <div class="controls">
            <button class="btn-wave" id="start-wave" onclick="startWave()">Welle Starten</button>
        </div>
    </div>

    <div class="tower-selector">
        <button class="tower-btn selected" onclick="selectTower(0)" id="tbtn-0">
            <span>Pfeil</span>
            <span>$100</span>
        </button>
        <button class="tower-btn" onclick="selectTower(1)" id="tbtn-1">
            <span>Bombe</span>
            <span>$250</span>
        </button>
        <button class="tower-btn" onclick="selectTower(2)" id="tbtn-2">
            <span>Laser</span>
            <span>$500</span>
        </button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="overlay" id="game-over">
        <h1>Spiel Vorbei!</h1>
        <p style="font-size: 24px; margin-bottom: 30px;">Du hast bis Welle <span id="final-wave"></span> überlebt.</p>
        <button class="restart-btn" onclick="location.reload()">Neustart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let lives = 20;
        let money = 350;
        let wave = 1;
        let waveInProgress = false;
        let gameOver = false;

        // DOM Elements
        const elLives = document.getElementById('lives');
        const elMoney = document.getElementById('money');
        const elWave = document.getElementById('wave');
        const elStartBtn = document.getElementById('start-wave');

        // Path Waypoints
        const waypoints = [
            {x: 0, y: 100},
            {x: 300, y: 100},
            {x: 300, y: 400},
            {x: 600, y: 400},
            {x: 600, y: 200},
            {x: 800, y: 200}
        ];

        // Tower Types
        const towerTypes = [
            { name: 'Pfeil', cost: 100, range: 120, damage: 20, fireRate: 30, color: '#3498db', type: 'single' },
            { name: 'Bombe', cost: 250, range: 100, damage: 40, fireRate: 60, color: '#e74c3c', type: 'splash', splashRadius: 60 },
            { name: 'Laser', cost: 500, range: 150, damage: 5, fireRate: 5, color: '#9b59b6', type: 'beam' }
        ];

        let selectedTowerType = 0;
        let towers = [];
        let enemies = [];
        let projectiles = [];
        let particles = [];

        let enemySpawnTimer = 0;
        let enemiesToSpawn = 0;
        let enemySpawnDelay = 60;
        let currentEnemyHp = 30;
        let frameCount = 0;
        let hoverCell = null;

        // Path drawing logic
        function drawPath() {
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            for (let i = 1; i < waypoints.length; i++) {
                ctx.lineTo(waypoints[i].x, waypoints[i].y);
            }
            ctx.strokeStyle = '#e67e22';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.strokeStyle = '#d35400';
            ctx.lineWidth = 36;
            ctx.stroke();
        }

        class Enemy {
            constructor(hp, speed, radius, color) {
                this.x = waypoints[0].x - 30;
                this.y = waypoints[0].y;
                this.targetIndex = 1;
                this.hp = hp;
                this.maxHp = hp;
                this.speed = speed;
                this.radius = radius;
                this.color = color;
                this.value = Math.floor(hp / 10) + 2;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                let target = waypoints[this.targetIndex];
                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.targetIndex++;

                    if (this.targetIndex >= waypoints.length) {
                        this.active = false;
                        lives--;
                        updateUI();
                        if (lives <= 0) endGame();
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }

            draw() {
                if (!this.active) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.stroke();

                // Health bar
                if (this.hp < this.maxHp) {
                    let hpPercent = this.hp / this.maxHp;
                    ctx.fillStyle = 'red';
                    ctx.fillRect(this.x - 15, this.y - 20, 30, 4);
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillRect(this.x - 15, this.y - 20, 30 * hpPercent, 4);
                }
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp <= 0 && this.active) {
                    this.active = false;
                    money += this.value;
                    updateUI();
                    createExplosion(this.x, this.y, this.color);
                }
            }
        }

        class Tower {
            constructor(x, y, typeIndex) {
                this.x = x;
                this.y = y;
                this.type = towerTypes[typeIndex];
                this.cooldown = 0;
                this.target = null;
                this.angle = 0;
                this.activeBeam = null; // For laser
            }

            update() {
                this.activeBeam = null;
                if (this.cooldown > 0) this.cooldown--;

                // Find target
                let closestEnemy = null;
                let minDist = this.type.range;

                for (let e of enemies) {
                    if (!e.active) continue;
                    let dist = Math.hypot(e.x - this.x, e.y - this.y);
                    if (dist < minDist) {
                        minDist = dist;
                        closestEnemy = e;
                    }
                }

                this.target = closestEnemy;

                if (this.target) {
                    this.angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);

                    if (this.cooldown <= 0) {
                        this.fire();
                    }
                }
            }

            fire() {
                this.cooldown = this.type.fireRate;

                if (this.type.type === 'single' || this.type.type === 'splash') {
                    projectiles.push(new Projectile(this.x, this.y, this.target, this.type));
                } else if (this.type.type === 'beam') {
                    this.activeBeam = this.target;
                    this.target.takeDamage(this.type.damage);
                    // Add small spark particles at target
                    if (Math.random() > 0.5) {
                        particles.push(new Particle(this.target.x, this.target.y, this.type.color, 2));
                    }
                }
            }

            draw() {
                // Base
                ctx.beginPath();
                ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#34495e';
                ctx.fill();

                // Head
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = this.type.color;
                ctx.beginPath();
                if (this.type.type === 'single') {
                    ctx.moveTo(0, -10); ctx.lineTo(25, 0); ctx.lineTo(0, 10);
                } else if (this.type.type === 'splash') {
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.fillStyle = '#2c3e50'; ctx.fill();
                    ctx.fillStyle = this.type.color; ctx.fillRect(0, -5, 20, 10);
                } else if (this.type.type === 'beam') {
                    ctx.fillRect(-10, -8, 20, 16);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(0, -4, 25, 8);
                }
                ctx.fill();
                ctx.restore();

                // Draw Beam if active
                if (this.activeBeam && this.activeBeam.active) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.activeBeam.x, this.activeBeam.y);
                    ctx.strokeStyle = this.type.color;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        class Projectile {
            constructor(x, y, target, towerType) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.type = towerType;
                this.speed = 10;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                if (!this.target.active) {
                    // Try to find a new target or die
                    this.active = false;
                    return;
                }

                let dx = this.target.x - this.x;
                let dy = this.target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.hit();
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }

            hit() {
                this.active = false;

                if (this.type.type === 'single') {
                    this.target.takeDamage(this.type.damage);
                } else if (this.type.type === 'splash') {
                    createExplosion(this.x, this.y, '#e74c3c');
                    // Splash damage
                    for (let e of enemies) {
                        if (!e.active) continue;
                        let d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d <= this.type.splashRadius) {
                            e.takeDamage(this.type.damage);
                        }
                    }
                }
            }

            draw() {
                if (!this.active) return;

                ctx.beginPath();
                if (this.type.type === 'single') {
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#000';
                } else {
                    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#c0392b';
                }
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color, size = 3) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
                this.color = color;
                this.size = size;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function selectTower(index) {
            selectedTowerType = index;
            document.querySelectorAll('.tower-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
        }

        function updateUI() {
            elLives.innerText = lives;
            elMoney.innerText = money;
            elWave.innerText = wave;

            // Check affordability
            towerTypes.forEach((t, i) => {
                const btn = document.getElementById(`tbtn-${i}`);
                if (money < t.cost) btn.style.opacity = '0.5';
                else btn.style.opacity = '1';
            });
        }

        function startWave() {
            if (waveInProgress || gameOver) return;
            waveInProgress = true;
            elStartBtn.disabled = true;
            elStartBtn.style.opacity = '0.5';

            enemiesToSpawn = 5 + wave * 3;
            enemySpawnTimer = 0;

            // Calculate hp based on wave (exponential growth roughly)
            currentEnemyHp = 20 + (wave * 15) * Math.pow(1.1, wave);
            // Speed up slightly every 5 waves
            let spd = 1.5 + Math.floor(wave / 5) * 0.2;
            enemySpawnDelay = Math.max(20, 60 - wave * 2);
        }

        // Interaction
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            hoverCell = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        });

        canvas.addEventListener('mouseout', () => hoverCell = null);

        function isOnPath(x, y) {
            // Check distance to all line segments
            for (let i = 0; i < waypoints.length - 1; i++) {
                let p1 = waypoints[i];
                let p2 = waypoints[i+1];

                let A = x - p1.x;
                let B = y - p1.y;
                let C = p2.x - p1.x;
                let D = p2.y - p1.y;

                let dot = A * C + B * D;
                let len_sq = C * C + D * D;
                let param = -1;
                if (len_sq != 0) //in case of 0 length line
                    param = dot / len_sq;

                let xx, yy;

                if (param < 0) {
                    xx = p1.x;
                    yy = p1.y;
                }
                else if (param > 1) {
                    xx = p2.x;
                    yy = p2.y;
                }
                else {
                    xx = p1.x + param * C;
                    yy = p1.y + param * D;
                }

                let dx = x - xx;
                let dy = y - yy;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 30) return true; // Path width / 2 + margin
            }
            return false;
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            let tType = towerTypes[selectedTowerType];

            if (money >= tType.cost) {
                // Check if on path
                if (isOnPath(x, y)) return;

                // Check collision with other towers
                for (let t of towers) {
                    if (Math.hypot(t.x - x, t.y - y) < 40) return;
                }

                money -= tType.cost;
                towers.push(new Tower(x, y, selectedTowerType));
                updateUI();
                createExplosion(x, y, '#ecf0f1'); // Place effect
            }
        });

        function endGame() {
            gameOver = true;
            document.getElementById('final-wave').innerText = wave;
            document.getElementById('game-over').style.display = 'flex';
        }

        function loop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPath();

            // Draw hover preview
            if (hoverCell) {
                let tType = towerTypes[selectedTowerType];
                let valid = !isOnPath(hoverCell.x, hoverCell.y);
                for (let t of towers) {
                    if (Math.hypot(t.x - hoverCell.x, t.y - hoverCell.y) < 40) valid = false;
                }

                ctx.beginPath();
                ctx.arc(hoverCell.x, hoverCell.y, tType.range, 0, Math.PI * 2);
                ctx.fillStyle = valid ? 'rgba(255, 255, 255, 0.2)' : 'rgba(231, 76, 60, 0.3)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(hoverCell.x, hoverCell.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = valid ? 'rgba(52, 152, 219, 0.5)' : 'rgba(231, 76, 60, 0.5)';
                ctx.fill();
            }

            // Spawning logic
            if (waveInProgress) {
                if (enemiesToSpawn > 0) {
                    enemySpawnTimer++;
                    if (enemySpawnTimer >= enemySpawnDelay) {
                        enemySpawnTimer = 0;
                        enemiesToSpawn--;

                        // Vary colors and speed slightly
                        let colors = ['#f1c40f', '#e67e22', '#e74c3c', '#8e44ad', '#34495e'];
                        let cIdx = Math.min(Math.floor(wave / 3), colors.length - 1);
                        let rColor = colors[cIdx];
                        let rSpeed = 1.5 + Math.floor(wave/5)*0.2 + (Math.random()*0.5);

                        enemies.push(new Enemy(currentEnemyHp, rSpeed, 12 + Math.min(wave, 8), rColor));
                    }
                } else {
                    // Check if wave is over
                    let allDead = true;
                    for (let e of enemies) {
                        if (e.active) {
                            allDead = false;
                            break;
                        }
                    }
                    if (allDead) {
                        waveInProgress = false;
                        wave++;
                        money += 100 + wave * 10; // Wave bonus
                        updateUI();
                        elStartBtn.disabled = false;
                        elStartBtn.style.opacity = '1';
                        enemies = []; // Clean up array
                        projectiles = [];
                    }
                }
            }

            // Update & Draw
            towers.forEach(t => { t.update(); t.draw(); });
            enemies.forEach(e => { e.update(); e.draw(); });

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.update();
                p.draw();
                if (!p.active) projectiles.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            frameCount++;
            requestAnimationFrame(loop);
        }

        updateUI();
        loop();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'tower-defense';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
