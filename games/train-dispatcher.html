<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zug-Dispatcher - Minigame Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            background-color: #0f3460;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            display: block;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 10px 20px;
            box-sizing: border-box;
            background-color: #16213e;
            border-bottom: 2px solid #e94560;
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            background-color: #e94560;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #d1304d;
        }
        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .controls-info {
            margin-top: 15px;
            text-align: center;
            max-width: 600px;
            color: #ccc;
        }
        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #d1304d;
        }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Zug-Dispatcher - Minigame Portal</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <div class="header">

        <div class="game-title">Zug-Dispatcher</div>
        <div style="width: 80px;"></div>
    </div>

    <div id="game-container">
        <div id="score-display">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="game-over">
            <h2>Spiel Vorbei!</h2>
            <p>Dein Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Nochmal spielen</button>
        </div>
    </div>

    <div class="controls-info">
        <h3>Zug-Dispatcher</h3>
        <p>Verwalte Weichen und verhindere Zugkollisionen.</p>
        <p><strong>Steuerung:</strong> Klicke auf die Objekte, um zu interagieren.</p>
    </div>

    <script src="../js/user-system.js"></script>
    <script>

            // Advanced Particle System Graphics
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // Adjust canvas to match device pixel ratio for sharper graphics
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            let particles = [];
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6348'];
            let mouse = { x: canvas.width / (2 * dpr), y: canvas.height / (2 * dpr) };

            canvas.addEventListener('mousemove', (e) => {
                const r = canvas.getBoundingClientRect();
                mouse.x = e.clientX - r.left;
                mouse.y = e.clientY - r.top;
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * (canvas.width / dpr);
                    this.y = Math.random() * (canvas.height / dpr);
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                    this.radius = Math.random() * 3 + 1;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > canvas.width / dpr) this.vx = -this.vx;
                    if (this.y < 0 || this.y > canvas.height / dpr) this.vy = -this.vy;

                    // Mouse interaction
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        this.x -= dx * 0.02;
                        this.y -= dy * 0.02;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.closePath();
                    ctx.shadowBlur = 0; // Reset
                }
            }

            for (let i = 0; i < 80; i++) particles.push(new Particle());

            function animate() {
                // Trail effect
                ctx.fillStyle = 'rgba(10, 14, 23, 0.3)';
                ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

                particles.forEach(p => p.update());

                // Draw connecting lines
                for(let i=0; i<particles.length; i++) {
                    for(let j=i; j<particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx*dx + dy*dy);

                        if(dist < 80) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${1 - dist/80})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => p.draw());
                requestAnimationFrame(animate);
            }
            animate();
</script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'train-dispatcher';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
