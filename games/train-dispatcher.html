<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zug-Dispatcher - Minigame Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            background-color: #0f3460;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            display: block;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 10px 20px;
            box-sizing: border-box;
            background-color: #16213e;
            border-bottom: 2px solid #e94560;
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            background-color: #e94560;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #d1304d;
        }
        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .controls-info {
            margin-top: 15px;
            text-align: center;
            max-width: 600px;
            color: #ccc;
        }
        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #d1304d;
        }
    </style>
</head>
<body>

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Zug-Dispatcher - Minigame Portal</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

    <div class="header">

        <div class="game-title">Zug-Dispatcher</div>
        <div style="width: 80px;"></div>
    </div>

    <div id="game-container">
        <div id="score-display">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="game-over">
            <h2>Spiel Vorbei!</h2>
            <p>Dein Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Nochmal spielen</button>
        </div>
    </div>

    <div class="controls-info">
        <h3>Zug-Dispatcher</h3>
        <p>Verwalte Weichen und verhindere Zugkollisionen.</p>
        <p><strong>Steuerung:</strong> Klicke auf die Objekte, um zu interagieren.</p>
    </div>

    <script src="../js/user-system.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');

        let score = 0;
        let isGameOver = false;
        let entities = [];
        let time = 0;

        function init() {
            score = 0;
            isGameOver = false;
            entities = [];
            time = 0;
            scoreElement.innerText = score;
            gameOverScreen.style.display = 'none';

            // Spawn initial entities
            for(let i=0; i<5; i++) {
                spawnEntity();
            }

            requestAnimationFrame(gameLoop);
        }

        function spawnEntity() {
            entities.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                radius: 20 + Math.random() * 20,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                active: true
            });
        }

        canvas.addEventListener('mousedown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let clicked = false;
            for(let i = entities.length - 1; i >= 0; i--) {
                const ent = entities[i];
                const dx = mouseX - ent.x;
                const dy = mouseY - ent.y;
                if(Math.sqrt(dx*dx + dy*dy) < ent.radius) {
                    entities.splice(i, 1);
                    score += 10;
                    scoreElement.innerText = score;
                    clicked = true;
                    spawnEntity();
                    spawnEntity(); // gets harder
                    break;
                }
            }

            if (!clicked) {
                endGame();
            }
        });

        function update() {
            if (isGameOver) return;
            time++;

            entities.forEach(ent => {
                ent.x += ent.vx;
                ent.y += ent.vy;

                // Bounce
                if(ent.x - ent.radius < 0 || ent.x + ent.radius > canvas.width) ent.vx *= -1;
                if(ent.y - ent.radius < 0 || ent.y + ent.radius > canvas.height) ent.vy *= -1;
            });

            if (entities.length > 30) {
                endGame();
            }
        }

        function draw() {
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background grid pattern
            ctx.strokeStyle = '#16213e';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for(let i=0; i<canvas.height; i+=40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            entities.forEach(ent => {
                ctx.beginPath();
                ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI * 2);
                ctx.fillStyle = ent.color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw title in background
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.font = '80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Zug-Dispatcher', canvas.width/2, canvas.height/2);
            ctx.textAlign = 'left';
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            isGameOver = true;
            finalScoreElement.innerText = score;
            gameOverScreen.style.display = 'block';

            if (window.userSystem) {
                let xpEarned = Math.floor(score / 5);
                let coinsEarned = Math.floor(score / 10);
                if (xpEarned > 0) window.userSystem.addXP(xpEarned);
                if (coinsEarned > 0) window.userSystem.addCoins(coinsEarned);
            }
        }

        function resetGame() {
            init();
        }

        // Start
        init();
    </script>

    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'train-dispatcher';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
