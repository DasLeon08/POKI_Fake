<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tron Multiplayer</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .instructions {
            margin-top: 15px;
            color: #ecf0f1;
            text-align: center;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 10px;
        }
        .player1-color { color: #00ffff; font-weight: bold; }
        .player2-color { color: #ff00ff; font-weight: bold; }
        canvas {
            background-color: #111;
            border: 4px solid #333;
        }
    </style>
</head>
<body>
    <div class="game-container">

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Tron Multiplayer</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>



        <div class="player-controls">
            <div class="player1-color">Spieler 1 (Cyan): W A S D</div>
            <div class="player2-color">Spieler 2 (Magenta): Pfeiltasten</div>
        </div>

        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <div class="instructions">
            Weiche den Wänden und den Lichtspuren aus!<br>
            Wer überlebt, gewinnt. Leertaste zum Neustart.
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const grid = 10;
        let isGameOver = false;
        let winnerText = "";
        let winnerColor = "";

        const dirs = {
            up: {x: 0, y: -grid},
            down: {x: 0, y: grid},
            left: {x: -grid, y: 0},
            right: {x: grid, y: 0}
        };

        let player1 = {};
        let player2 = {};
        let trailMap = {};

        function initGame() {
            player1 = {
                x: 100, y: 200, color: "#00ffff", dir: dirs.right, trail: [], alive: true
            };
            player2 = {
                x: 500, y: 200, color: "#ff00ff", dir: dirs.left, trail: [], alive: true
            };
            trailMap = {};
            isGameOver = false;
        }

        window.addEventListener("keydown", (e) => {
            if (isGameOver && e.code === "Space") {
                initGame();
                return;
            }
            if (isGameOver) return;

            // P1
            if (e.key === "w" && player1.dir !== dirs.down) player1.dir = dirs.up;
            if (e.key === "s" && player1.dir !== dirs.up) player1.dir = dirs.down;
            if (e.key === "a" && player1.dir !== dirs.right) player1.dir = dirs.left;
            if (e.key === "d" && player1.dir !== dirs.left) player1.dir = dirs.right;

            // P2
            if (e.key === "ArrowUp" && player2.dir !== dirs.down) player2.dir = dirs.up;
            if (e.key === "ArrowDown" && player2.dir !== dirs.up) player2.dir = dirs.down;
            if (e.key === "ArrowLeft" && player2.dir !== dirs.right) player2.dir = dirs.left;
            if (e.key === "ArrowRight" && player2.dir !== dirs.left) player2.dir = dirs.right;
        });

        function checkCollision(p) {
            // Wall
            if (p.x < 0 || p.x >= canvas.width || p.y < 0 || p.y >= canvas.height) return true;
            // Trail
            if (trailMap[`${p.x},${p.y}`]) return true;
            return false;
        }

        function update() {
            if (isGameOver) return;

            // Add current pos to trail and map
            player1.trail.push({x: player1.x, y: player1.y});
            trailMap[`${player1.x},${player1.y}`] = true;

            player2.trail.push({x: player2.x, y: player2.y});
            trailMap[`${player2.x},${player2.y}`] = true;

            // Move
            player1.x += player1.dir.x;
            player1.y += player1.dir.y;

            player2.x += player2.dir.x;
            player2.y += player2.dir.y;

            // Head on collision
            if (player1.x === player2.x && player1.y === player2.y) {
                player1.alive = false;
                player2.alive = false;
            } else {
                if (checkCollision(player1)) player1.alive = false;
                if (checkCollision(player2)) player2.alive = false;
            }

            if (!player1.alive || !player2.alive) {
                isGameOver = true;
                if (!player1.alive && !player2.alive) {
                    winnerText = "Unentschieden!";
                    winnerColor = "white";
                } else if (player1.alive) {
                    winnerText = "Spieler 1 gewinnt!";
                    winnerColor = player1.color;
                } else {
                    winnerText = "Spieler 2 gewinnt!";
                    winnerColor = player2.color;
                }
            }
        }

        function draw() {
            // Clear but keep trails (fade effect could be added, but classic tron keeps them)
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw trails
            ctx.fillStyle = player1.color;
            player1.trail.forEach(t => ctx.fillRect(t.x, t.y, grid, grid));
            ctx.fillRect(player1.x, player1.y, grid, grid);

            ctx.fillStyle = player2.color;
            player2.trail.forEach(t => ctx.fillRect(t.x, t.y, grid, grid));
            ctx.fillRect(player2.x, player2.y, grid, grid);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = winnerColor;
                ctx.font = "40px 'Fredoka One'";
                ctx.textAlign = "center";
                ctx.fillText(winnerText, canvas.width/2, canvas.height/2);

                ctx.fillStyle = "white";
                ctx.font = "20px 'Nunito'";
                ctx.fillText("Leertaste für Neustart", canvas.width/2, canvas.height/2 + 40);
            }
        }

        initGame();

        // Loop speed (game tick)
        setInterval(() => {
            update();
            draw();
        }, 100);

    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'tron-multiplayer';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>

</body>
</html>
