<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Schreibtrainer - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .game-container { background: #34495e; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; margin-top: 20px; width: 600px; max-width: 90%; }
        .word-display { font-size: 3rem; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; height: 60px; display: flex; justify-content: center; align-items: center; }
        .input-area { width: 100%; margin-bottom: 20px; }
        input[type="text"] { font-size: 1.5rem; width: 100%; padding: 10px; border-radius: 5px; border: none; outline: none; text-align: center; }
        .stats { display: flex; justify-content: space-around; font-size: 1.2rem; color: #ecf0f1; border-top: 1px solid #7f8c8d; padding-top: 20px; }
        .time-left { font-weight: bold; color: #e74c3c; }
        .score { font-weight: bold; color: #2ecc71; }
        .message { font-size: 1.2rem; height: 30px; margin-bottom: 10px; color: #f1c40f; }
        button { padding: 10px 20px; font-size: 1.2rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; margin-top: 20px; display: none; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>


    <div class="game-container">

    <div class="ingame-header">
        <a href="../index.html" class="back-btn">Zurück zum Portal</a>
        <h1 class="ingame-title">Schreibtrainer - Jules Spiele</h1>
        <div class="ingame-controls">
            <button class="game-like-btn" id="inGameLikeBtn" title="Like this game">♡</button>
        </div>
    </div>

        <h1>Schreibtrainer</h1>
        <p>Tippe die Wörter so schnell du kannst!</p>

        <div class="message" id="message">Fange an zu tippen...</div>
        <div class="word-display" id="wordDisplay">Wort</div>

        <div class="input-area">
            <input type="text" id="wordInput" placeholder="Hier tippen..." autofocus>
        </div>

        <div class="stats">
            <div>Zeit: <span class="time-left" id="timeDisplay">60</span>s</div>
            <div>Punkte: <span class="score" id="scoreDisplay">0</span></div>
        </div>

        <button id="restartBtn" onclick="initGame()">Nochmal spielen</button>
    </div>

    <script>
        const words = [
            "apfel", "baum", "computer", "haus", "katze", "hund", "sonne", "mond", "stern", "auto",
            "fahrrad", "buch", "tisch", "stuhl", "fenster", "tür", "vogel", "fisch", "blume", "wiese",
            "wald", "berg", "fluss", "meer", "strand", "sand", "wasser", "feuer", "erde", "luft",
            "spielen", "laufen", "springen", "lachen", "weinen", "singen", "tanzen", "lesen", "schreiben", "rechnen",
            "schule", "lehrer", "schüler", "klasse", "tafel", "kreide", "heft", "stift", "radiergummi", "lineal",
            "rot", "blau", "grün", "gelb", "schwarz", "weiß", "grau", "braun", "orange", "lila"
        ];

        let time = 60;
        let score = 0;
        let isPlaying = false;
        let timerInterval;

        const wordDisplay = document.getElementById('wordDisplay');
        const wordInput = document.getElementById('wordInput');
        const timeDisplay = document.getElementById('timeDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const message = document.getElementById('message');
        const restartBtn = document.getElementById('restartBtn');

        function initGame() {
            time = 60;
            score = 0;
            isPlaying = true;
            timeDisplay.textContent = time;
            scoreDisplay.textContent = score;
            wordInput.value = '';
            wordInput.disabled = false;
            wordInput.focus();
            restartBtn.style.display = 'none';
            message.textContent = 'Los geht\'s!';

            showWord();

            clearInterval(timerInterval);
            timerInterval = setInterval(countdown, 1000);
        }

        function showWord() {
            const randomIndex = Math.floor(Math.random() * words.length);
            wordDisplay.textContent = words[randomIndex];
        }

        function startMatch() {
            if (matchWords()) {
                isPlaying = true;
                showWord();
                wordInput.value = '';
                score++;
                scoreDisplay.textContent = score;
                message.textContent = 'Richtig!';
                message.style.color = '#2ecc71';
            }
        }

        function matchWords() {
            return wordInput.value.toLowerCase() === wordDisplay.textContent.toLowerCase();
        }

        function countdown() {
            if (time > 0) {
                time--;
                timeDisplay.textContent = time;
            } else if (time === 0) {
                isPlaying = false;
                clearInterval(timerInterval);
                message.textContent = `Game Over! Du hast ${score} Wörter geschafft.`;
                message.style.color = '#e74c3c';
                wordInput.disabled = true;
                restartBtn.style.display = 'inline-block';
            }
        }

        wordInput.addEventListener('input', startMatch);
        wordInput.addEventListener('focus', () => {
            if (!isPlaying && time === 60) {
                initGame();
            }
        });

        // Initialize first word without starting timer
        showWord();
    </script>

    <script src="../js/audio.js"></script>
    <script src="../js/user-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameId = 'typing';
            const likeBtn = document.getElementById('inGameLikeBtn');
            const userSystem = new UserSystem();

            if (userSystem.isLiked(gameId)) {
                likeBtn.classList.add('liked');
                likeBtn.innerHTML = '♥';
            }

            likeBtn.addEventListener('click', () => {
                const isLiked = userSystem.toggleLike(gameId);
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.innerHTML = '♥';
                    userSystem.showToast('Spiel geliked! +5 XP');
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.innerHTML = '♡';
                }
            });
        });
    </script>



<!-- V12 Mechanics -->
<button id="v12-emp-btn" style="position:fixed; bottom:140px; right:20px; padding:10px; background:#9b59b6; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #9b59b6;">EMP BLAST (400)</button>
<button id="v12-wormhole-btn" style="position:fixed; bottom:100px; right:20px; padding:10px; background:#34495e; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; z-index:100; box-shadow:0 0 10px #34495e;">WORMHOLE (500)</button>

</body>
</html>
