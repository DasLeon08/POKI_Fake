<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Hau den Lukas - Jules Spiele</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; margin-top: 20px; }
        .hole { background: #34495e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; overflow: hidden; position: relative; cursor: crosshair; }
        .mole { background: url('https://img.icons8.com/?size=100&id=121111&format=png&color=000000') no-repeat center; width: 80px; height: 80px; position: absolute; bottom: -100px; transition: bottom 0.2s; }
        .up .mole { bottom: 10px; }
        .stats { display: flex; justify-content: space-around; width: 300px; margin-top: 20px; font-size: 1.5rem; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 1rem; cursor: pointer; background: #3498db; border: none; color: white; border-radius: 5px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">Zurück zum Portal</a>
    <h1>Hau den Lukas</h1>

    <div class="stats">
        <div>Punkte: <span id="score">0</span></div>
        <div>Zeit: <span id="time">30</span>s</div>
    </div>

    <div class="grid">
        <div class="hole" id="hole1"><div class="mole"></div></div>
        <div class="hole" id="hole2"><div class="mole"></div></div>
        <div class="hole" id="hole3"><div class="mole"></div></div>
        <div class="hole" id="hole4"><div class="mole"></div></div>
        <div class="hole" id="hole5"><div class="mole"></div></div>
        <div class="hole" id="hole6"><div class="mole"></div></div>
        <div class="hole" id="hole7"><div class="mole"></div></div>
        <div class="hole" id="hole8"><div class="mole"></div></div>
        <div class="hole" id="hole9"><div class="mole"></div></div>
    </div>

    <button onclick="startGame()">Start</button>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.getElementById('score');
        const moles = document.querySelectorAll('.mole');
        const timeDisplay = document.getElementById('time');
        let lastHole;
        let timeUp = false;
        let score = 0;
        let countdown;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = randomTime(500, 1000);
            const hole = randomHole(holes);
            hole.classList.add('up');
            setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            scoreBoard.textContent = 0;
            timeUp = false;
            score = 0;
            let timeLeft = 30;
            timeDisplay.textContent = timeLeft;
            peep();

            clearInterval(countdown);
            countdown = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timeUp = true;
                    alert(`Zeit abgelaufen! Du hast ${score} Punkte.`);
                }
            }, 1000);
        }

        function bonk(e) {
            if (!e.isTrusted) return; // cheater!
            score++;
            this.parentNode.classList.remove('up');
            scoreBoard.textContent = score;
        }

        moles.forEach(mole => mole.addEventListener('click', bonk));
    </script>
</body>
</html>
