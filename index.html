<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jules Spieleportal - Kostenlose Online-Spiele</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Jules Spiele</h1>
        </div>

        </div>

    <main>
        <section class="game-grid">
            <a href="games/snake.html" class="game-tile" style="background: linear-gradient(135deg, #a8e063, #56ab2f);">
                <div class="game-info">
                    <h2>Snake</h2>
                </div>

            <a href="games/pong.html" class="game-tile" style="background: linear-gradient(135deg, #2980b9, #6dd5fa, #ffffff);">
                <div class="game-info">
                    <h2>Pong</h2>
                </div>
            </a>
            <a href="games/tic-tac-toe.html" class="game-tile" style="background: linear-gradient(135deg, #f7971e, #ffd200);">
                <div class="game-info">
                    <h2>Tic-Tac-Toe</h2>
                </div>
            </a>
            <a href="games/memory.html" class="game-tile" style="background: linear-gradient(135deg, #ee0979, #ff6a00);">

                    <h2>Memory</h2>
                </div>
            </a>
            <a href="games/flappy-block.html" class="game-tile" style="background: linear-gradient(135deg, #00c6ff, #0072ff);">
                <div class="game-info">
                    <h2>Flappy Block</h2>
                </div>
            </a>
            <a href="games/clicker.html" class="game-tile" style="background: linear-gradient(135deg, #fceabb, #f8b500);">
                <div class="game-info">
                    <h2>Clicker</h2>

            <a href="games/rps.html" class="game-tile" style="background: linear-gradient(135deg, #11998e, #38ef7d);">
                <div class="game-info">
                    <h2>Schere Stein Papier</h2>
                </div>
            </a>
            <a href="games/color-guesser.html" class="game-tile" style="background: linear-gradient(135deg, #8A2387, #E94057, #F27121);">
                <div class="game-info">
                    <h2>Farben Raten</h2>
                </div>
            </a>
            <a href="games/reaction.html" class="game-tile" style="background: linear-gradient(135deg, #fc4a1a, #f7b733);">
                <div class="game-info">
                    <h2>Reaktionstest</h2>
                </div>
            </a>
            <a href="games/whack-a-mole.html" class="game-tile" style="background: linear-gradient(135deg, #8e44ad, #c0392b);">

                    <h2>Hau den Lukas</h2>
                </div>
